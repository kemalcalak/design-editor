# Overseas L4 ingress for a CN-anchored OpenPencil collaboration relay.
#
# The accepted TCP stream is the client's untouched inner TLS connection. This
# process wraps those bytes in an outer mTLS connection to exactly one private
# CN federation listener. It never terminates or inspects inner TLS.

pid /tmp/nginx.pid;
worker_processes 1;
worker_rlimit_nofile 4096;

events {
    worker_connections 1024;
    multi_accept off;
}

error_log /dev/stderr warn;

stream {
    log_format redacted '$time_local transport=$protocol status=$status '
                        'bytes_in=$bytes_received bytes_out=$bytes_sent '
                        'session_time=$session_time';
    access_log off;

    limit_conn_zone $binary_remote_addr zone=global_clients:1m;

    upstream cn_federation_listener {
        zone cn_federation_listener 32k;
        # TEST-NET-1 fails closed. Replace with one private/static CN IP only.
        server 192.0.2.10:9443;
    }

    server {
        listen 8443;
        listen [::]:8443;
        # One owner keeps four warm lanes. Leave bounded headroom for guests
        # and multiple users sharing an enterprise/CGNAT source address.
        limit_conn global_clients 32;

        proxy_connect_timeout 5s;
        proxy_timeout 180s;
        proxy_buffer_size 16k;
        proxy_socket_keepalive on;
        proxy_half_close off;
        proxy_upload_rate 16m;
        proxy_download_rate 16m;
        proxy_next_upstream off;

        proxy_ssl on;
        proxy_ssl_server_name on;
        proxy_ssl_name cn-federation.example.cn;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /run/secrets/cn-federation-ca.pem;
        proxy_ssl_certificate /run/secrets/global-edge-client-cert.pem;
        proxy_ssl_certificate_key /run/secrets/global-edge-client-key.pem;
        # Force every new backhaul connection through certificate validation.
        # The CN listener also disables its session cache. Operators must
        # recreate that container after atomically publishing a replacement
        # CRL because ssl_crl is read when the SSL context is loaded.
        proxy_ssl_session_reuse off;

        proxy_pass cn_federation_listener;
    }
}
