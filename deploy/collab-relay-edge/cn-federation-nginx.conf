# Private CN outer-mTLS listener for overseas relay ingress traffic.
#
# This process unwraps only the outer edge-to-CN mTLS layer, then forwards the
# untouched inner client TLS stream to exactly one normal CN WSS terminator.
# The inner terminator remains responsible for strict GET /v1/tunnel handling,
# Authorization, signed home_region=cn verification, and WebSocket upgrade.

pid /tmp/nginx.pid;
worker_processes 1;
worker_rlimit_nofile 4096;

events {
    worker_connections 2048;
    multi_accept off;
}

error_log /dev/stderr warn;

stream {
    log_format redacted '$time_local transport=$protocol status=$status '
                        'bytes_in=$bytes_received bytes_out=$bytes_sent '
                        'session_time=$session_time';
    access_log off;

    # All clients normally share one or a few trusted Global edge source IPs.
    # This is an aggregate safety ceiling, not a per-end-user rate limit.
    limit_conn_zone $binary_remote_addr zone=trusted_global_edges:1m;

    upstream cn_inner_wss {
        zone cn_inner_wss 32k;
        # TEST-NET-1 fails closed. Replace with the private/static dedicated
        # federation listener from deploy/collab-relay/nginx.conf only.
        server 192.0.2.20:8444;
    }

    server {
        listen 9443 ssl;
        listen [::]:9443 ssl;
        limit_conn trusted_global_edges 512;

        ssl_certificate /run/secrets/cn-federation-server-cert.pem;
        ssl_certificate_key /run/secrets/cn-federation-server-key.pem;
        ssl_client_certificate /run/secrets/global-edge-client-ca.pem;
        ssl_crl /run/secrets/global-edge-client-crl.pem;
        ssl_verify_client on;
        ssl_verify_depth 2;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_handshake_timeout 5s;
        ssl_session_cache off;
        ssl_session_tickets off;

        proxy_connect_timeout 3s;
        proxy_timeout 180s;
        proxy_buffer_size 16k;
        proxy_socket_keepalive on;
        proxy_half_close off;
        proxy_upload_rate 16m;
        proxy_download_rate 16m;
        proxy_next_upstream off;

        proxy_pass cn_inner_wss;
    }
}
