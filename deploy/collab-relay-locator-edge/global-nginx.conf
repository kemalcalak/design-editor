# Overseas L4 ingress for the CN relay-locator control plane.
#
# The accepted TCP stream is the client's untouched inner HTTPS connection.
# This process wraps those bytes in outer mTLS to exactly one private CN
# locator-federation listener. It never terminates or inspects inner TLS.

pid /tmp/nginx.pid;
worker_processes 1;
worker_rlimit_nofile 2048;

events {
    worker_connections 512;
    multi_accept off;
}

error_log /dev/stderr warn;

stream {
    log_format redacted '$time_local transport=$protocol status=$status '
                        'bytes_in=$bytes_received bytes_out=$bytes_sent '
                        'session_time=$session_time';
    access_log off;

    limit_conn_zone $binary_remote_addr zone=locator_global_clients:1m;

    upstream cn_locator_federation {
        zone cn_locator_federation 32k;
        # TEST-NET-1 fails closed. Replace with one private/static CN address.
        server 192.0.2.30:9543;
    }

    server {
        listen 8443;
        listen [::]:8443;
        # Keep enough room for users sharing carrier-grade NAT while bounding
        # one public address below the aggregate CN ceilings. The required
        # host nftables meter separately bounds new connections per address.
        limit_conn locator_global_clients 32;

        proxy_connect_timeout 5s;
        proxy_timeout 30s;
        proxy_buffer_size 4k;
        proxy_socket_keepalive on;
        proxy_half_close off;
        proxy_upload_rate 1m;
        proxy_download_rate 1m;
        proxy_next_upstream off;

        proxy_ssl on;
        proxy_ssl_server_name on;
        proxy_ssl_name locator-cn-federation.example.cn;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /run/secrets/cn-locator-federation-ca.pem;
        proxy_ssl_certificate /run/secrets/global-locator-edge-client-cert.pem;
        proxy_ssl_certificate_key /run/secrets/global-locator-edge-client-key.pem;
        proxy_ssl_session_reuse off;

        proxy_pass cn_locator_federation;
    }
}
