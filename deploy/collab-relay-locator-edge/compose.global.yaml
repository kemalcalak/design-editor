name: openpencil-collab-locator-global-edge

services:
  global-locator-edge:
    image: ${OPENPENCIL_LOCATOR_EDGE_IMAGE_REPOSITORY:?set the audited nginx-unprivileged repository}@sha256:${OPENPENCIL_LOCATOR_EDGE_IMAGE_SHA256:?set its reviewed 64-hex digest}
    user: "101:101"
    command:
      - nginx
      - -g
      - daemon off;
    ports:
      - target: 8443
        published: 443
        host_ip: ${OPENPENCIL_LOCATOR_EDGE_PUBLIC_BIND_IP:?set a dedicated overseas public IP}
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ./global-nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    secrets:
      - source: global_locator_edge_client_cert
        target: global-locator-edge-client-cert.pem
      - source: global_locator_edge_client_key
        target: global-locator-edge-client-key.pem
      - source: cn_locator_federation_ca
        target: cn-locator-federation-ca.pem
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,uid=101,gid=101,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 96m
    cpus: 0.50
    ulimits:
      nofile:
        soft: 2048
        hard: 2048
    # A supervisor must invoke deploy-global.sh, which installs/verifies the
    # host limiter before every start or restart.
    restart: "no"
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - nginx
        - -t
        - -q
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

secrets:
  global_locator_edge_client_cert:
    file: ${OPENPENCIL_LOCATOR_EDGE_CLIENT_CERT:?set an absolute locator-edge client certificate}
  global_locator_edge_client_key:
    file: ${OPENPENCIL_LOCATOR_EDGE_CLIENT_KEY:?set an absolute locator-edge client key}
  cn_locator_federation_ca:
    file: ${OPENPENCIL_LOCATOR_CN_FEDERATION_CA:?set an absolute pinned CN locator-federation CA}
