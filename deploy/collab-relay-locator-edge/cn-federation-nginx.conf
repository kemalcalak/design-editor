# Private CN outer-mTLS listener for overseas locator HTTPS traffic.
#
# This process unwraps only the outer Global-to-CN mTLS layer and forwards the
# untouched inner client TLS stream to one private CN locator HTTPS terminator.

pid /tmp/nginx.pid;
worker_processes 1;
worker_rlimit_nofile 2048;

events {
    worker_connections 1024;
    multi_accept off;
}

error_log /dev/stderr warn;

stream {
    log_format redacted '$time_local transport=$protocol status=$status '
                        'bytes_in=$bytes_received bytes_out=$bytes_sent '
                        'session_time=$session_time';
    access_log off;

    limit_conn_zone $binary_remote_addr zone=trusted_locator_edges:1m;

    upstream cn_locator_inner_https {
        zone cn_locator_inner_https 32k;
        # TEST-NET-1 fails closed. Replace with the one private/static
        # dedicated listener using cn-locator-https-nginx.conf.
        server 192.0.2.40:8445;
    }

    server {
        listen 9543 ssl;
        listen [::]:9543 ssl;
        limit_conn trusted_locator_edges 128;

        ssl_certificate /run/secrets/cn-locator-federation-server-cert.pem;
        ssl_certificate_key /run/secrets/cn-locator-federation-server-key.pem;
        ssl_client_certificate /run/secrets/global-locator-edge-client-ca.pem;
        ssl_crl /run/secrets/global-locator-edge-client-crl.pem;
        ssl_verify_client on;
        ssl_verify_depth 2;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_handshake_timeout 5s;
        ssl_session_cache off;
        ssl_session_tickets off;

        proxy_connect_timeout 3s;
        proxy_timeout 30s;
        proxy_buffer_size 4k;
        proxy_socket_keepalive on;
        proxy_half_close off;
        proxy_upload_rate 1m;
        proxy_download_rate 1m;
        proxy_next_upstream off;

        proxy_pass cn_locator_inner_https;
    }
}
