# Dedicated private inner-HTTPS terminator for overseas locator publication.
#
# Install this server beside the ordinary CN locator ingress and connect its
# fixed `locator:8092` upstream to the existing locator service. Bind/firewall
# 8445 exclusively to the CN locator-federation proxy.

pid /tmp/nginx.pid;
worker_processes 1;
worker_rlimit_nofile 2048;

events {
    worker_connections 1024;
    multi_accept off;
}

error_log /dev/stderr warn;

http {
    access_log off;
    server_tokens off;

    # The federation proxy is one aggregate source. The Global host firewall
    # supplies the per-original-source new-connection limiter.
    limit_req_zone $server_port zone=locator_federation_requests:1m rate=100r/s;
    limit_conn_zone $server_port zone=locator_federation_connections:1m;

    upstream openpencil_locator {
        zone openpencil_locator 32k;
        server locator:8092;
        keepalive 16;
    }

    server {
        listen 8445 ssl;
        listen [::]:8445 ssl;
        server_name locator.example.cn;

        client_header_buffer_size 64k;
        large_client_header_buffers 2 64k;
        ssl_certificate /run/secrets/cn-locator-inner-fullchain.pem;
        ssl_certificate_key /run/secrets/cn-locator-inner-privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        client_header_timeout 5s;
        client_body_timeout 5s;
        send_timeout 10s;
        keepalive_requests 1;
        keepalive_timeout 0;

        # Require the client-visible common hostname at both inner-TLS and
        # HTTP layers. $http_host has no server_name fallback when Host is
        # absent, unlike $host.
        if ($ssl_server_name != locator.example.cn) {
            return 421;
        }
        if ($http_host != locator.example.cn) {
            return 421;
        }

        location = /v1/locator {
            # Exact locations use Nginx's normalized URI. Refuse queries and
            # percent-encoded aliases by also checking the original target.
            if ($request_uri != "/v1/locator") {
                return 404;
            }
            limit_except POST {
                deny all;
            }

            if ($http_transfer_encoding != "") {
                return 400;
            }
            if ($http_content_encoding != "") {
                return 415;
            }
            if ($content_length != "191") {
                return 400;
            }
            if ($http_content_type != "application/vnd.openpencil.relay-owner-publish-v1") {
                return 415;
            }
            if ($http_accept != "application/vnd.openpencil.relay-locator-v1") {
                return 406;
            }

            access_log off;
            limit_req zone=locator_federation_requests burst=100 nodelay;
            limit_req_status 429;
            limit_conn locator_federation_connections 128;
            limit_conn_status 429;
            client_max_body_size 191;
            client_body_buffer_size 191;

            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_set_header Connection close;
            proxy_set_header Host locator.example.cn;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Accept $http_accept;
            proxy_set_header Content-Length 191;
            proxy_set_header Transfer-Encoding "";
            proxy_set_header Content-Encoding "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://openpencil_locator/v1/locator;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_request_buffering on;
            proxy_buffering off;
        }

        # Short pairing-code endpoints. Publish is variable-length (56..=624
        # bytes, validated exactly in Rust); claim is exactly 49 bytes.
        location = /v1/pairing-code {
            if ($request_uri != "/v1/pairing-code") {
                return 404;
            }
            limit_except POST {
                deny all;
            }

            if ($http_transfer_encoding != "") {
                return 400;
            }
            if ($http_content_encoding != "") {
                return 415;
            }
            if ($http_content_type != "application/vnd.openpencil.relay-pairing-publish-v1") {
                return 415;
            }

            access_log off;
            limit_req zone=locator_federation_requests burst=100 nodelay;
            limit_req_status 429;
            limit_conn locator_federation_connections 128;
            limit_conn_status 429;
            client_max_body_size 624;
            client_body_buffer_size 624;

            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_set_header Connection close;
            proxy_set_header Host locator.example.cn;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Content-Length $content_length;
            proxy_set_header Transfer-Encoding "";
            proxy_set_header Content-Encoding "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://openpencil_locator/v1/pairing-code;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_request_buffering on;
            proxy_buffering off;
        }

        location = /v1/pairing-code/claim {
            if ($request_uri != "/v1/pairing-code/claim") {
                return 404;
            }
            limit_except POST {
                deny all;
            }

            if ($http_transfer_encoding != "") {
                return 400;
            }
            if ($http_content_encoding != "") {
                return 415;
            }
            if ($content_length != "49") {
                return 400;
            }
            if ($http_content_type != "application/vnd.openpencil.relay-pairing-claim-v1") {
                return 415;
            }
            if ($http_accept != "application/vnd.openpencil.relay-sealed-invite-v1") {
                return 406;
            }

            access_log off;
            limit_req zone=locator_federation_requests burst=100 nodelay;
            limit_req_status 429;
            limit_conn locator_federation_connections 128;
            limit_conn_status 429;
            client_max_body_size 49;
            client_body_buffer_size 49;

            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_set_header Connection close;
            proxy_set_header Host locator.example.cn;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Accept $http_accept;
            proxy_set_header Content-Length 49;
            proxy_set_header Transfer-Encoding "";
            proxy_set_header Content-Encoding "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://openpencil_locator/v1/pairing-code/claim;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_request_buffering on;
            proxy_buffering off;
        }

        location / {
            return 404;
        }
    }
}
