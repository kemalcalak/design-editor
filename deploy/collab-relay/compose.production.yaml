# Waiting-queue policy is inherited from compose.yaml and is identical in both
# regions: one lease per WAITING_TIMEOUT_SECS, renewed while the peer answers
# pings. Rolling the lease needs no client rollout — already-shipped clients
# pong as a side effect of reading. See README.md, "Mixed-fleet migration".
services:
  relay:
    command:
      - --production
    environment:
      DESIGN_EDITOR_COLLAB_RELAY_TICKET_POLICY_FILE: /run/secrets/design-editor-collab-policy.json
      DESIGN_EDITOR_COLLAB_RELAY_LOCATOR_KEYS_FILE: /run/secrets/design-editor-relay-locator-keys.json
      DESIGN_EDITOR_COLLAB_RELAY_X25519_KEYS_FILE: /run/secrets/design-editor-relay-x25519-keys.json
      DESIGN_EDITOR_COLLAB_RELAY_POLICY_MAX_AGE_SECONDS: "60"
    secrets:
      - source: design_editor_collab_policy
        target: design-editor-collab-policy.json
      - source: design_editor_relay_locator_keys
        target: design-editor-relay-locator-keys.json
      - source: design_editor_relay_x25519_keys
        target: design-editor-relay-x25519-keys.json

secrets:
  design_editor_collab_policy:
    file: ${DESIGN_EDITOR_COLLAB_POLICY_HOST_FILE:?set an absolute signed-policy file path}
  design_editor_relay_locator_keys:
    file: ${DESIGN_EDITOR_RELAY_LOCATOR_KEYS_HOST_FILE:?set an absolute locator-key file path}
  design_editor_relay_x25519_keys:
    file: ${DESIGN_EDITOR_RELAY_X25519_KEYS_HOST_FILE:?set an absolute relay X25519 key file path}
