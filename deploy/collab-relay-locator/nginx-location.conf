# Include inside the TLS-enabled server block for the locator hostname.
# TLS certificates, HSTS, and operator-specific network ACLs belong to that
# server block. Do not expose the Rust container port directly.

location = /v1/locator {
    if ($request_uri != "/v1/locator") {
        return 404;
    }
    if ($http_host = "") {
        return 400;
    }

    access_log off;
    limit_req zone=openpencil_locator_per_source burst=20 nodelay;
    limit_req_status 429;
    limit_conn openpencil_locator_connections 16;
    limit_conn_status 429;
    client_max_body_size 191;
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Accept $http_accept;
    proxy_pass http://locator:8092/v1/locator;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_buffering off;
}

# Short pairing-code endpoints. Body ceilings mirror the Rust wire bounds:
# publish = 55-byte header + sealed blob (<= 569) = 624; claim = exactly 49.
location = /v1/pairing-code {
    if ($request_uri != "/v1/pairing-code") {
        return 404;
    }
    if ($http_host = "") {
        return 400;
    }
    limit_except POST {
        deny all;
    }
    if ($http_transfer_encoding != "") {
        return 400;
    }
    if ($http_content_encoding != "") {
        return 415;
    }
    if ($http_content_type != "application/vnd.openpencil.relay-pairing-publish-v1") {
        return 415;
    }

    access_log off;
    limit_req zone=openpencil_locator_per_source burst=20 nodelay;
    limit_req_status 429;
    limit_conn openpencil_locator_connections 16;
    limit_conn_status 429;
    client_max_body_size 624;
    client_body_buffer_size 624;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Connection close;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Content-Length $content_length;
    proxy_set_header Transfer-Encoding "";
    proxy_set_header Content-Encoding "";
    proxy_pass http://locator:8092/v1/pairing-code;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_request_buffering on;
    proxy_buffering off;
}

location = /v1/pairing-code/claim {
    if ($request_uri != "/v1/pairing-code/claim") {
        return 404;
    }
    if ($http_host = "") {
        return 400;
    }
    limit_except POST {
        deny all;
    }
    if ($http_transfer_encoding != "") {
        return 400;
    }
    if ($http_content_encoding != "") {
        return 415;
    }
    if ($content_length != "49") {
        return 400;
    }
    if ($http_content_type != "application/vnd.openpencil.relay-pairing-claim-v1") {
        return 415;
    }
    if ($http_accept != "application/vnd.openpencil.relay-sealed-invite-v1") {
        return 406;
    }

    access_log off;
    limit_req zone=openpencil_locator_per_source burst=20 nodelay;
    limit_req_status 429;
    limit_conn openpencil_locator_connections 16;
    limit_conn_status 429;
    client_max_body_size 49;
    client_body_buffer_size 49;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Connection close;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Accept $http_accept;
    proxy_set_header Content-Length 49;
    proxy_set_header Transfer-Encoding "";
    proxy_set_header Content-Encoding "";
    proxy_pass http://locator:8092/v1/pairing-code/claim;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_request_buffering on;
    proxy_buffering off;
}

location = /healthz {
    access_log off;
    limit_req zone=openpencil_locator_per_source burst=20 nodelay;
    limit_req_status 429;
    limit_conn openpencil_locator_connections 16;
    limit_conn_status 429;
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_pass http://locator:8092/healthz;
}

location / {
    return 404;
}
