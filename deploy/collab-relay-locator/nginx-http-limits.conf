# Include once in the trusted TLS ingress `http` block, outside every server.
# If another proxy sits in front, configure Nginx real_ip only for that proxy's
# fixed addresses before using $binary_remote_addr. Never trust public
# X-Forwarded-For values.

limit_req_zone $binary_remote_addr zone=openpencil_locator_per_source:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=openpencil_locator_connections:10m;
client_header_buffer_size 64k;
large_client_header_buffers 2 64k;
