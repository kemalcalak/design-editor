name: Feature
description: A new capability or a change to an existing one.
labels: ["feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: What has to be true for this to be closed.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [high, medium, low]
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: [S, M, L]
    validations:
      required: true
