name: Chore
description: Maintenance, renames, tooling or CI.
labels: ["chore"]
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: What has to be true for this to be closed.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [high, medium, low]
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: [S, M, L]
    validations:
      required: true
