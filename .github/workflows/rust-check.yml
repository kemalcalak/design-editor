name: Rust check (native)

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'crates/**'
      # Parity with the push leg: a PR touching a vendored dep (the
      # casement winit fork, jian, agent) must not ride green with
      # zero CI.
      - 'vendor/**'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'deny.toml'
      - 'tools/check-jian-boundaries.sh'
      - 'tools/check-web-server-headless.sh'
      - 'tools/check-widget-boundary.sh'
      - 'tools/check-text-measure.sh'
      - 'tools/check-rustls-client-policy.sh'
      - 'tools/check-file-line-cap.sh'
      - '.github/workflows/rust-release.yml'
      - '.github/workflows/rust-check.yml'
      - '.github/ci/rust-check-apt-packages.txt'
  # The release workflow runs these checks on the commit it releases.
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'crates/**'
      - 'vendor/**'
      - 'deny.toml'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'tools/check-jian-boundaries.sh'
      - 'tools/check-web-server-headless.sh'
      - 'tools/check-widget-boundary.sh'
      - 'tools/check-text-measure.sh'
      - 'tools/check-rustls-client-policy.sh'
      - 'tools/check-file-line-cap.sh'
      - '.github/workflows/rust-release.yml'
      - '.github/workflows/rust-check.yml'
      - '.github/ci/rust-check-apt-packages.txt'

# One run per PR (or per branch push); a newer push to a PR cancels the
# older run. Pushes to main are never cancelled.
concurrency:
  # Inside the release workflow's `workflow_call`, github.workflow is the
  # caller's name: give each called run its own group so it never queues
  # behind (or is cancelled by) a regular push run of this workflow.
  group: rust-check-${{ github.workflow == 'Rust check (native)' && (github.event.pull_request.number || github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.os }} / 1.94
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      # Keep LF line endings on the Windows runner so `cargo fmt --check`
      # does not trip over CRLF-converted vendored sources.
      - name: Disable autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Linux GL, font and tooling prerequisites; the package list and why each
      # one is needed live in .github/ci/rust-check-apt-packages.txt.
      # The downloaded .deb files are cached: fetching fonts-noto-cjk (61 MB)
      # from the Azure Ubuntu mirror stalled past every timeout on 2026-10-22
      # and failed the job before any build ran (#64).
      - name: Linux apt cache key
        id: apt-key
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          # The month suffix rolls the cache forward so package updates get saved;
          # a new month restores the previous archives through `prefix`, so only
          # changed packages are downloaded.
          prefix="apt-archives-${{ runner.os }}-${{ runner.arch }}-${VERSION_CODENAME}-${{ hashFiles('.github/ci/rust-check-apt-packages.txt') }}-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore Linux apt archives
        id: apt-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: ${{ steps.apt-key.outputs.prefix }}
      - name: Install Linux GL prereqs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Runner images ship third-party apt sources (Google Chrome, Microsoft) this job never installs
          # from; a bad index on one of those mirrors ("Hash Sum mismatch", 2026-09-10) fails `apt-get
          # update` for everything. Drop them so only Ubuntu's own sources gate the prerequisites.
          # Removed: google-chrome*.list/.sources, microsoft-*.list/.sources (azure-cli, edge,
          # microsoft-prod). Ubuntu's own sources and the unused PPAs stay untouched.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources \
                     /etc/apt/sources.list.d/microsoft-*.list /etc/apt/sources.list.d/microsoft-*.sources
          # apt-get reads and keeps .deb files in the cached directory; a cached
          # file whose version still matches is installed without a download. The
          # sandbox user `_apt` cannot enter the runner's home, so apt downloads
          # as root (it would fall back to that anyway, with a warning).
          apt_archives="$HOME/apt-archives"
          mkdir -p "$apt_archives/partial"
          apt_options=(
            -o Acquire::ForceIPv4=true
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Dir::Cache::Archives="$apt_archives"
            -o APT::Sandbox::User=root
          )
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' .github/ci/rust-check-apt-packages.txt)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::no packages read from .github/ci/rust-check-apt-packages.txt"
            exit 1
          fi
          for attempt in 1 2 3 4; do
            # 600s install budget: a cold cache still downloads fonts-noto-cjk.
            if sudo env DEBIAN_FRONTEND=noninteractive \
              timeout 180s apt-get "${apt_options[@]}" update && \
              sudo env DEBIAN_FRONTEND=noninteractive \
              timeout 600s apt-get "${apt_options[@]}" install --yes "${packages[@]}"; then
              break
            fi
            if [[ "$attempt" == 4 ]]; then
              echo "::error::apt prerequisites failed after $attempt attempts"
              exit 1
            fi
            sleep $((attempt * 20))
          done
          # Drop archives the mirror no longer serves so a rolled-forward cache
          # does not keep superseded versions.
          sudo apt-get "${apt_options[@]}" autoclean
          echo "apt archives (cache hit: ${{ steps.apt-cache.outputs.cache-hit == 'true' }}):"
          du -sh "$apt_archives"
          ls "$apt_archives"/fonts-noto-cjk_*.deb 2>/dev/null \
            || echo "::warning::fonts-noto-cjk .deb missing from $apt_archives; the next run downloads it again"
      # Saved right after the install, not in a post-job step, so a later test
      # failure still keeps the archives for the next run.
      - name: Save Linux apt archives
        if: runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.apt-key.outputs.key }}
      # macOS runners ship no ripgrep and have no apt block above; same
      # dependency, same reason (see .github/ci/rust-check-apt-packages.txt).
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
      - run: cargo fmt --all -- --check
      - run: tools/check-rustls-client-policy.sh
      - run: tools/check-file-line-cap.sh
      - run: cargo build --workspace
      # GitHub-hosted runners are headless with no reliable Mesa software
      # EGL, so STEP1A_REQUIRE_GPU is left unset: the de-host-native GPU
      # smoke (memory_loop) self-uses the raster fallback instead of
      # hard-failing on EGL init. Real-GPU coverage runs on dev machines.
      - name: Test workspace (non-Windows, parallel)
        if: runner.os != 'Windows'
        run: cargo test --workspace
      # Windows: skia's `FontMgr` is DirectWrite, which segfaults
      # (STATUS_ACCESS_VIOLATION) when a test spawns a worker thread doing
      # font layout (SkiaMeasure) concurrently with the main thread — an
      # intra-test race `--test-threads=1` can NOT serialize (it only
      # serializes tests against each other, not threads inside one test).
      # nextest runs every test in its OWN process, so such a crash is
      # isolated + named instead of taking down the whole test binary.
      # Keep those test processes serial on Windows: DirectWrite/Skia still
      # aborts in CI when several native text-layout processes run at once.
      # Doctests run separately (nextest doesn't execute them).
      - name: Install cargo-nextest (Windows)
        if: runner.os == 'Windows'
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Test workspace (Windows, nextest per-process isolation)
        if: runner.os == 'Windows'
        env:
          DE_TEST_ESTIMATE_TEXT_MEASURE: "1"
        # --no-fail-fast: the windows runner surfaces latent platform-only
        # failures one per round when the run cancels on the first one;
        # enumerating them all in a single run is what ends that loop.
        run: cargo nextest run --workspace --test-threads=1 --no-fail-fast
      - name: Doctests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --doc
      - name: Run CanvasKit web host tests
        run: cargo test -p de-host-web --features canvaskit -- --test-threads=1
      # `gl-host` is a NON-DEFAULT feature, so the workspace test step above
      # never compiles the native widget host (the entire desktop editor
      # chrome). One Linux leg is enough to hold that contract; Windows is
      # excluded for the same DirectWrite/Skia reason as above.
      - name: Run native widget-host tests (non-default gl-host feature)
        if: runner.os == 'Linux'
        run: cargo test -p de-host-native --features gl-host
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The workspace clippy above only sees DEFAULT features, so the
      # CanvasKit web host and the native widget host are both invisible
      # to it — a real `collapsible_if` sat in
      # `canvaskit/mount_keyboard.rs` from 26b91658d until 0827 for exactly
      # that reason. Lint those two surfaces explicitly.
      - name: Clippy non-default feature surfaces
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p de-host-web --features canvaskit --all-targets -- -D warnings
          cargo clippy -p de-host-native --features gl-host --all-targets -- -D warnings
      # Step 1a Phase C Task 4: spec v19 §11 + §12.3 boundary invariants.
      - name: Verify Jian boundary invariants
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown
          bash tools/check-jian-boundaries.sh

      - name: Verify Step 1b widget boundary (spec §1.4)
        if: runner.os == 'Linux'
        run: bash tools/check-widget-boundary.sh

      # Family-blind text measurement is invisible to every other check:
      # it compiles, it passes the test suite (test backends measure blind
      # and family-aware identically), and it only shows as sheared or
      # off-centre glyphs on a real machine.
      - name: Verify chrome text is measured in its paint family
        if: runner.os == 'Linux'
        run: bash tools/check-text-measure.sh

      - name: Verify de-host-web-server headless boundary (no winit/glutin/GL)
        if: runner.os == 'Linux'
        run: bash tools/check-web-server-headless.sh

  deny:
    name: cargo-deny (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2 # auto-updates within v2.x; runner cargo at this stage carries cargo-deny 0.18+ which handles modern transitive manifests (Phase 1 Task 1.8 finding)
        with:
          command: check
