name: Version consistency

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "README*.md"
      - "crates/**/Cargo.toml"
      - "crates/**/*.rs"
      - "crates/de-cli/assets/skill-bundle.json"
      - "packages/package.json"
      - "packages/*/package.json"
      - "packages/de-chrome-extension/manifest.json"
      - "packages/de-chrome-extension/scripts/package-extension.sh"
      - "scripts/workspace-version.sh"
      - "scripts/workspace-version.test.sh"
      - "scripts/bump-version.sh"
      - "scripts/bump-version.test.sh"
      - "scripts/bundle-macos.sh"
      - "crates/de-host-desktop/Info.plist"
      - "scripts/package-windows.nsi"
      - "scripts/install-de.sh"
      - "tools/check-version-sync.sh"
      - "tools/check-version-sync.test.sh"
      - "tools/check-version-sync-policy.test-cases.sh"
      - "tools/pinned-release-tools.sh"
      - "tools/pinned-release-tools.test.sh"
      - "tools/bundle-macos.sh"
      - ".githooks/pre-commit"
      - ".github/workflows/rust-release.yml"
      - ".github/workflows/version-sync.yml"
  # The release workflow runs these checks on the commit it releases.
  workflow_call:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "README*.md"
      - "crates/**/Cargo.toml"
      - "crates/**/*.rs"
      - "crates/de-cli/assets/skill-bundle.json"
      - "packages/package.json"
      - "packages/*/package.json"
      - "packages/de-chrome-extension/manifest.json"
      - "packages/de-chrome-extension/scripts/package-extension.sh"
      - "scripts/workspace-version.sh"
      - "scripts/workspace-version.test.sh"
      - "scripts/bump-version.sh"
      - "scripts/bump-version.test.sh"
      - "scripts/bundle-macos.sh"
      - "crates/de-host-desktop/Info.plist"
      - "scripts/package-windows.nsi"
      - "scripts/install-de.sh"
      - "tools/check-version-sync.sh"
      - "tools/check-version-sync.test.sh"
      - "tools/check-version-sync-policy.test-cases.sh"
      - "tools/pinned-release-tools.sh"
      - "tools/pinned-release-tools.test.sh"
      - "tools/bundle-macos.sh"
      - ".githooks/pre-commit"
      - ".github/workflows/rust-release.yml"
      - ".github/workflows/version-sync.yml"

permissions:
  contents: read

# One run per PR (or per branch push); a newer push to a PR cancels the
# older run. Pushes to main are never cancelled.
concurrency:
  # Inside the release workflow's `workflow_call`, github.workflow is the
  # caller's name: give each called run its own group so it never queues
  # behind (or is cancelled by) a regular push run of this workflow.
  group: version-sync-${{ github.workflow == 'Version consistency' && (github.event.pull_request.number || github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version-sync:
    name: Verify the single product version
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-15
        with:
          toolchain: '1.94'

      - name: Test pinned release tool contracts
        run: tools/pinned-release-tools.test.sh

      - name: Install digest-pinned ripgrep
        run: tools/pinned-release-tools.sh ripgrep "$RUNNER_TEMP/ripgrep-15.2.0"

      - name: Verify pinned ripgrep
        run: rg --version

      - name: Test canonical version reader
        run: scripts/workspace-version.test.sh

      - name: Test version bump entrypoint
        run: scripts/bump-version.test.sh

      - name: Test repository version guard
        run: tools/check-version-sync.test.sh

      - name: Check repository version consistency
        run: tools/check-version-sync.sh
