name: Nix flake checks

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "crates/**/Cargo.toml"
      - "deny.toml"
      - "flake.nix"
      - "flake.lock"
      - "nix/release-manifest.json"
      - "nix/integration/**"
      - "packages/package.json"
      - "packages/bun.lock"
      - "packages/*/package.json"
      - "packages/de-web-sdk*/tsup.config.ts"
      - "packages/de-web-sdk*/vitest.config.ts"
      - "packages/scripts/workspace-version.mjs"
      - "scripts/workspace-version.sh"
      - "scripts/update-nix-release-manifest.sh"
      - "crates/de-host-desktop/assets/icon.png"
      - ".github/workflows/nix-check.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "crates/**/Cargo.toml"
      - "deny.toml"
      - "flake.nix"
      - "flake.lock"
      - "nix/release-manifest.json"
      - "nix/integration/**"
      - "packages/package.json"
      - "packages/bun.lock"
      - "packages/*/package.json"
      - "packages/de-web-sdk*/tsup.config.ts"
      - "packages/de-web-sdk*/vitest.config.ts"
      - "packages/scripts/workspace-version.mjs"
      - "scripts/workspace-version.sh"
      - "crates/de-host-desktop/assets/icon.png"
      - ".github/workflows/nix-check.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run per PR (or per branch push); a newer push to a PR cancels the
# older run. Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flake:
    name: Build and smoke-test prebuilt outputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      # The flake pins its vendor inputs as github revs while the repository
      # pins the same code as submodules; the two drift the moment a submodule
      # bump forgets the flake (this broke the whole workflow when jian gained
      # the widget-style fields). Deriving the overrides from the checked-out
      # submodule HEADs makes the workflow follow the gitlinks by construction.
      - name: Derive flake input overrides from the submodule pins
        run: |
          {
            printf 'NIX_VENDOR_OVERRIDES=--no-write-lock-file'
            printf ' --override-input jian github:ZSeven-W/jian/%s' \
              "$(git -C vendor/jian rev-parse HEAD)"
            printf ' --override-input casement github:ZSeven-W/casement/%s' \
              "$(git -C vendor/casement rev-parse HEAD)"
            printf ' --override-input agent github:ZSeven-W/agent-rs/%s' \
              "$(git -C vendor/agent rev-parse HEAD)"
            printf '\n'
          } >> "$GITHUB_ENV"

      - name: Evaluate flake checks
        run: nix flake check --no-build --show-trace $NIX_VENDOR_OVERRIDES

      # The prebuilt outputs download the Linux archives of the release named
      # in nix/release-manifest.json. That file lags Cargo.toml on purpose (the
      # hashes exist only once the release is out), and until a release has
      # published the Linux archives there is nothing to download: skip the
      # prebuilt steps with a warning instead of failing on a 404. Any other
      # HTTP answer still fails the job.
      - name: Check the manifest release publishes the Linux archives
        id: prebuilt
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er .version nix/release-manifest.json)"
          # Same URL flake.nix fetches (prebuiltDesktopPackage / prebuiltCliPackage).
          base="https://github.com/kemalcalak/design-editor/releases/download/v${version}"
          available=true
          for asset in design-editor-linux-x86_64.tar.gz de-cli-linux-x86_64.tar.gz; do
            code="$(curl -sSL --retry 3 --range 0-0 -o /dev/null -w '%{http_code}' "$base/$asset")"
            case "$code" in
              200 | 206) ;;
              404)
                echo "::warning::v${version} has no ${asset}; skipping the prebuilt checks until nix/release-manifest.json names a release that has it (scripts/update-nix-release-manifest.sh)"
                available=false
                ;;
              *)
                echo "::error::unexpected HTTP $code for $base/$asset"
                exit 1
                ;;
            esac
          done
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Build prebuilt packages
        if: steps.prebuilt.outputs.available == 'true'
        run: nix build .#prebuilt .#prebuilt-cli --no-link $NIX_VENDOR_OVERRIDES

      - name: Build representative source outputs
        run: |
          nix build \
            .#de-cli \
            .#web-server \
            .#web-bundle \
            .#web-sdk-wasm \
            .#web-sdk-packages \
            .#appimage \
            --no-link $NIX_VENDOR_OVERRIDES

      - name: Verify generated integration sidecar
        run: nix build .#checks.x86_64-linux.integration-sidecar --no-link $NIX_VENDOR_OVERRIDES

      - name: Install headless display server
        if: steps.prebuilt.outputs.available == 'true'
        run: |
          set -euo pipefail
          # Runner images ship third-party apt sources (Google Chrome, Microsoft) this job never installs
          # from; a bad index on one of those mirrors ("Hash Sum mismatch", 2026-09-10) fails `apt-get
          # update` for everything. Drop them so only Ubuntu's own sources gate the prerequisites.
          # Removed: google-chrome*.list/.sources, microsoft-*.list/.sources (azure-cli, edge,
          # microsoft-prod). Ubuntu's own sources and the unused PPAs stay untouched.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources \
                     /etc/apt/sources.list.d/microsoft-*.list /etc/apt/sources.list.d/microsoft-*.sources
          apt_options=(
            -o Acquire::ForceIPv4=true
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
          )
          packages=(libegl1 libgles2 libgl1-mesa-dri libgbm1 mesa-utils xvfb)
          for attempt in 1 2 3 4; do
            if sudo apt-get "${apt_options[@]}" update && \
              sudo apt-get "${apt_options[@]}" install --yes "${packages[@]}"; then
              break
            fi
            if [[ "$attempt" == 4 ]]; then
              echo "::error::apt prerequisites failed after $attempt attempts"
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Smoke-test prebuilt CLI
        if: steps.prebuilt.outputs.available == 'true'
        run: |
          output="$(nix run .#prebuilt-cli $NIX_VENDOR_OVERRIDES -- --version)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eq '^\{"version":"[0-9]+\.[0-9]+\.[0-9]+"\}$'

      - name: Smoke-test prebuilt desktop
        if: steps.prebuilt.outputs.available == 'true'
        shell: bash
        run: |
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 \
          MESA_LOADER_DRIVER_OVERRIDE=llvmpipe \
          GALLIUM_DRIVER=llvmpipe \
          timeout 20s xvfb-run -a -s "-screen 0 1280x720x24" nix run .#prebuilt $NIX_VENDOR_OVERRIDES \
            >/tmp/design-editor.log 2>&1
          status=$?
          set -e

          # A GUI process is expected to remain alive until timeout. Any other
          # non-zero status means startup failed before the process was usable.
          if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            cat /tmp/design-editor.log
            exit "$status"
          fi
          if grep -Eq 'error while loading|cannot open shared object' \
            /tmp/design-editor.log; then
            cat /tmp/design-editor.log
            exit 1
          fi

      - name: Run the clean NixOS runtime test
        if: steps.prebuilt.outputs.available == 'true'
        run: nix build .#checks.x86_64-linux.prebuilt-runtime --no-link $NIX_VENDOR_OVERRIDES
