name: Security

# main only, never a branch or a pull request: the scans judge what is on
# main, on every push to it and weekly. A manual dispatch can name any branch,
# so every job carries the same `if:` - no trigger alone can promise that.
on:
  push:
    branches: [main]
  schedule:
    # New advisories land against dependencies that have not changed, so a
    # push-only scan goes stale. Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-advisories:
    name: RustSec advisories
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          submodules: recursive

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-15
        with:
          toolchain: '1.94'

      # Same tool and deny.toml as the `cargo-deny` job in rust-check.yml,
      # narrowed to advisories: licenses, bans and sources already gate PRs.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  dependencies:
    name: CVEs in locked dependencies
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No submodules: vendor/* are third-party trees with their own
      # lockfiles, and the shipped versions are the ones in the root
      # Cargo.lock.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      # Trivy reads Cargo.lock and packages/bun.lock straight from the
      # checkout; nothing is built or installed.
      - name: Scan Cargo.lock and packages/bun.lock
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  secrets:
    name: Leaked secrets in history
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          # A credential removed in a later commit is still in the pack, so
          # this is the one job that genuinely needs every commit.
          fetch-depth: 0

      # Reads .gitleaks.toml from the repo root.
      - name: Scan every commit with gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
