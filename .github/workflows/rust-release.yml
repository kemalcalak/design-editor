name: Release

# Publishes a GitHub Release for every new workspace version that lands on
# `main`. A push whose root `Cargo.toml` version already has a `v<version>`
# tag does nothing, so ordinary merges never release; bumping the version
# (`scripts/bump-version.sh X.Y.Z`, which edits Cargo.toml and Cargo.lock) in
# a PR is the only manual step.
#
# Assets (names must match `asset_name_for` in
# crates/de-host-desktop/src/update_check.rs, which the in-app update check
# downloads):
#   Design-Editor-<v>-arm64-mac.dmg       macOS Apple Silicon app (ad-hoc signed, not notarized)
#   Design-Editor-<v>-x64-win-setup.exe   Windows x64 NSIS installer (unsigned)
#   de-cli-macos-aarch64.tar.gz           standalone `de` CLI
#   de-cli-windows-x86_64.zip             standalone `de.exe` CLI
#   design-editor-linux-x86_64.tar.gz     Linux x86_64 `design-editor` binary
#   de-cli-linux-x86_64.tar.gz            standalone Linux `de` CLI
#   SHA256SUMS.txt
#
# The two Linux archives are what flake.nix's `prebuilt` / `prebuilt-cli`
# outputs download (version + hashes in nix/release-manifest.json, refreshed
# after a release by scripts/update-nix-release-manifest.sh); they hold the
# bare binary at the archive root. The in-app update check has no Linux asset.
#
# `workflow_dispatch` (on main) re-runs the same pipeline, e.g. after a
# failed build: it still publishes only when the tag does not exist yet.
# The Rust check and version-sync workflows run inside this pipeline
# (`workflow_call`), so a release never depends on their path filters having
# fired for the commit being released.
#
# Pull requests that touch release files get a dry run: the same build jobs
# produce the dmg and the installer as short-lived artifacts, but nothing is
# tagged or published. The PR's own Rust check / version-sync workflows cover
# the checks, so the dry run skips them.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/rust-release.yml'
      - 'tools/pinned-release-tools.sh'
      - 'tools/install-pinned-nsis.ps1'
      - 'tools/stage-pinned-angle.ps1'
      - 'tools/stage-pinned-vcredist.ps1'
      - 'scripts/build-rust-release-host.sh'
      - 'scripts/bundle-macos.sh'
      - 'scripts/package-windows.nsi'
      - 'scripts/workspace-version.sh'
      - 'crates/de-host-desktop/assets/icon.*'
  workflow_dispatch:

permissions:
  contents: read

# Never run two releases side by side; a newer push waits for the older one.
# A PR dry run has its own group (a newer push to the PR cancels the older run)
# so it never queues behind, or blocks, a real release.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-dry-run-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Detect an unreleased version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Read the workspace version and look for its tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || {
            echo "::error::checkout does not match the pushed commit"
            exit 1
          }
          version=$(scripts/workspace-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "Pull request: dry-run build of v$version, nothing is published."
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$GITHUB_REF" == refs/heads/main ]] || {
            echo "::error::releases are cut from main only (got $GITHUB_REF)"
            exit 1
          }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version has no tag yet; releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  rust-check:
    name: Rust check
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/rust-check.yml

  version-sync:
    name: Version sync
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/version-sync.yml

  build:
    name: ${{ matrix.label }}
    needs: [version, rust-check, version-sync]
    # On a release the checks must pass; on a PR dry run they are skipped.
    if: >-
      !cancelled() && needs.version.outputs.build == 'true' &&
      !contains(needs.*.result, 'failure')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      DE_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          - label: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          # ubuntu-24.04 rather than -latest: the binaries link against the
          # runner's glibc, so the floor a Linux user needs moves only when
          # this pin does.
          - label: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: x64
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-15
        with:
          toolchain: '1.94'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - name: Stage digest-pinned Skia binary cache
        shell: bash
        run: >-
          tools/pinned-release-tools.sh skia desktop '${{ matrix.target }}'
          "$RUNNER_TEMP/design-editor-skia-${{ matrix.target }}"
      - name: Install build prerequisites (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Same list and the same third-party-source cleanup as the Linux leg
          # of rust-check.yml, which builds and tests these crates every PR.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources \
                     /etc/apt/sources.list.d/microsoft-*.list /etc/apt/sources.list.d/microsoft-*.sources
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' .github/ci/rust-check-apt-packages.txt)
          [[ ${#packages[@]} -gt 0 ]] || {
            echo "::error::no packages read from .github/ci/rust-check-apt-packages.txt"
            exit 1
          }
          apt_options=(-o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          for attempt in 1 2 3 4; do
            if sudo apt-get "${apt_options[@]}" update && \
              sudo apt-get "${apt_options[@]}" install --yes "${packages[@]}"; then
              break
            fi
            if [[ "$attempt" == 4 ]]; then
              echo "::error::apt prerequisites failed after $attempt attempts"
              exit 1
            fi
            sleep $((attempt * 20))
          done
      - name: Validate pinned VC++ Runtime covers Windows build toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& tools/stage-pinned-vcredist.ps1 -ValidateBuildToolset'
      - name: Build desktop app and CLI
        shell: bash
        env:
          DESIGN_EDITOR_RELEASE_TARGET: ${{ matrix.target }}
        run: scripts/build-rust-release-host.sh

      # macOS: ad-hoc signed (not notarized) app bundle inside a DMG.
      - name: Package CLI archive (macos)
        if: runner.os == 'macOS'
        shell: bash
        run: tar czf de-cli-${{ matrix.label }}.tar.gz -C target/${{ matrix.target }}/release de
      - name: Install digest-pinned cargo-bundle
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          tools/pinned-release-tools.sh cargo-cli cargo-bundle
          "$RUNNER_TEMP/cargo-bundle-0.10.0"
      - name: Bundle macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          DESIGN_EDITOR_VERSION: ${{ env.DE_VERSION }}
          DESIGN_EDITOR_TARGET: ${{ matrix.target }}
          # Hand over the binaries built above: the bundle script skips its
          # own cargo build and embeds exactly these (app + de CLI).
          DESIGN_EDITOR_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/design-editor
          DESIGN_EDITOR_CLI_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/de
        run: bash scripts/bundle-macos.sh
      - name: Package DMG (macos)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="target/${{ matrix.target }}/release/bundle/osx/Design Editor.app"
          DMG="Design-Editor-$DE_VERSION-${{ matrix.arch }}-mac.dmg"
          STAGE="$(mktemp -d)"
          ditto "$APP" "$STAGE/Design Editor.app"
          ln -s /Applications "$STAGE/Applications"
          # HFS+ instead of the APFS default: mountable on every macOS the
          # binary itself supports.
          hdiutil create \
            -volname "Design Editor $DE_VERSION" \
            -srcfolder "$STAGE" \
            -fs HFS+ -format UDZO -ov \
            "$DMG"

      # Linux: bare binaries in tarballs, the layout flake.nix unpacks.
      - name: Package desktop and CLI archives (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tar czf design-editor-${{ matrix.label }}.tar.gz -C target/${{ matrix.target }}/release design-editor
          tar czf de-cli-${{ matrix.label }}.tar.gz -C target/${{ matrix.target }}/release de

      # Windows: NSIS installer with the ANGLE DLLs and the VC++ runtime.
      - name: Package CLI archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target\${{ matrix.target }}\release\de.exe `
            -DestinationPath de-cli-${{ matrix.label }}.zip
      - name: Install NSIS (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & tools/install-pinned-nsis.ps1 -SelfTest
          & tools/install-pinned-nsis.ps1
      - name: Stage ANGLE DLLs (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & tools/stage-pinned-angle.ps1 -SelfTest
          & tools/stage-pinned-angle.ps1 `
            -Architecture '${{ matrix.arch }}' -Target '${{ matrix.target }}'
      - name: Stage pinned Microsoft Visual C++ Redistributable (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & tools/stage-pinned-vcredist.ps1 -SelfTest
          $vcRedist = Join-Path $env:RUNNER_TEMP 'VC_redist.x64.exe'
          & tools/stage-pinned-vcredist.ps1 -Destination $vcRedist
          "VC_REDIST_FILE=$vcRedist" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Package NSIS installer (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Defines are absolute because NSIS resolves relative paths against
          # the .nsi's own directory (scripts/).
          makensis `
            "/DVERSION=$env:DE_VERSION" `
            "/DARCH=${{ matrix.arch }}" `
            "/DBIN_DIR=$env:GITHUB_WORKSPACE\target\${{ matrix.target }}\release" `
            "/DICON_FILE=$env:GITHUB_WORKSPACE\crates\de-host-desktop\assets\icon.ico" `
            "/DOUT_FILE=$env:GITHUB_WORKSPACE\Design-Editor-$env:DE_VERSION-${{ matrix.arch }}-win-setup.exe" `
            "/DVC_REDIST_FILE=$env:VC_REDIST_FILE" `
            scripts\package-windows.nsi

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.label }}
          path: |
            Design-Editor-*-mac.dmg
            Design-Editor-*-win-setup.exe
            design-editor-${{ matrix.label }}.tar.gz
            de-cli-${{ matrix.label }}.tar.gz
            de-cli-${{ matrix.label }}.zip
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}

  publish:
    name: Tag and publish v${{ needs.version.outputs.version }}
    needs: [version, build]
    if: needs.version.outputs.release == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      DE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      - name: Check the asset set and write SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          for asset in \
            "Design-Editor-$DE_VERSION-arm64-mac.dmg" \
            "Design-Editor-$DE_VERSION-x64-win-setup.exe" \
            de-cli-macos-aarch64.tar.gz \
            de-cli-windows-x86_64.zip \
            design-editor-linux-x86_64.tar.gz \
            de-cli-linux-x86_64.tar.gz; do
            [[ -s "$asset" ]] || { echo "::error::missing release asset $asset"; exit 1; }
          done
          # Hash into the parent first: writing inside release-files while the
          # glob expands could list the checksum file itself.
          sha256sum -- * | sort -k2 > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          ## Install

          - **macOS (Apple Silicon):** open `Design-Editor-<v>-arm64-mac.dmg` and drag Design Editor to Applications.
          - **Windows x64:** run `Design-Editor-<v>-x64-win-setup.exe`.
          - **Linux x86_64:** `design-editor-linux-x86_64.tar.gz` holds the bare `design-editor` binary
            (needs glibc 2.39+, GL/EGL and X11 or Wayland).
          - **CLI only:** `de-cli-macos-aarch64.tar.gz` / `de-cli-windows-x86_64.zip` / `de-cli-linux-x86_64.tar.gz`.

          These builds are **not code-signed** yet:

          - macOS Gatekeeper blocks the first launch. Right-click the app > **Open**, or run
            `xattr -dr com.apple.quarantine "/Applications/Design Editor.app"`.
          - Windows SmartScreen may warn on the installer. Choose **More info** > **Run anyway**.

          Verify a download against `SHA256SUMS.txt` (`shasum -a 256 <file>` / `Get-FileHash <file>`).
          NOTES
          sed -i "s/<v>/$DE_VERSION/g" release-notes.md
      - name: Create the tag and the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v$DE_VERSION" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Design Editor v$DE_VERSION" \
            --notes-file release-notes.md \
            --generate-notes \
            --latest
