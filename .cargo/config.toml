[build]
# wasm32 target enabled via rust-toolchain.toml; no override here

[net]
git-fetch-with-cli = true

[env]
# Design Editor deliberately uses the user's installed Copilot CLI. SDK 1.x
# downloads its pinned CLI even with `bundled-cli` disabled unless this opt-out
# is present, which would make ordinary builds network-dependent.
COPILOT_SKIP_CLI_DOWNLOAD = { value = "1", force = false }

[term]
verbose = false

[alias]
# Native desktop dev loop — incremental rebuild + relaunch on save
# (needs `cargo install cargo-watch`). Pass extra binary args after `--`,
# e.g. `cargo dev-desktop -- --live-mcp`.
dev-desktop = ["watch", "-w", "crates", "-w", "vendor", "--", "cargo", "run", "-p", "de-host-desktop"]
# Fast UI inner loop — verify widget layout/paint geometry without
# launching a window (~0.05s).
test-ui = "test -p de-editor-ui"
