[package]
name       = "de-engine-napi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish    = false
description = "OpenHarmony (OHOS) NAPI marshalling layer for the OpenPencil engine player (de-engine-ffi)"

[lib]
# The ArkTS import specifier IS the library file name
# (`import native from 'libopenpencil.so'`), so the lib name is part of the
# ABI contract with `packaging/harmony`. rlib so the host-triple contract
# tests link the same code.
name       = "openpencil"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# EGL/GLES rendering (forwards to the engine's `gl`). NOTE: the engine's GL
# surface backend is still `target_os = "android"`-gated inside
# de-engine-ffi/jian-skia, so on OHOS this currently compiles but yields no
# GPU surface — see README "UNVERIFIED-UNTIL-NDK".
gl = ["de-engine-ffi/gl", "de-engine-jni/gl"]
# Full-editor mode (forwards to the engine's editor feature).
editor = ["de-engine-ffi/editor", "de-engine-jni/editor"]
# Production release lane: require the digest-pinned Skia archive instead of
# downloading or compiling one.
pinned-skia-binaries = [
  "de-engine-ffi/pinned-skia-binaries",
  "de-engine-jni/pinned-skia-binaries",
]
# Local-only authentication for OHOS editor builds (debug profile only).
mobile-auth-dev = ["de-engine-ffi/mobile-auth-dev", "de-engine-jni/mobile-auth-dev"]

[dependencies]
de-engine-ffi = { path = "../de-engine-ffi" }
# The engine-thread queue + tombstoning handle registry are platform-free
# (pure `std`) and are the SINGLE source for both mobile bindings. They live
# in the JNI crate today; this crate deliberately reuses them instead of
# forking a byte-identical twin (the workspace has been bitten by drifted
# copy-paste twins before — see crates/CLAUDE.md "Shared host logic").
de-engine-jni = { path = "../de-engine-jni" }

[target.'cfg(all(target_os = "linux", target_env = "ohos"))'.dependencies]
# ohos-rs (https://github.com/ohos-rs/ohos-rs) — the OpenHarmony fork of
# napi-rs. `compat-mode` is required for `register_module_exports`, which is
# how the XComponent object is picked out of the module exports at load time.
napi-ohos        = { version = "1.2.0", features = ["compat-mode"] }
napi-derive-ohos = "1.2.0"
