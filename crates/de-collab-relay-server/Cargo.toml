[package]
name = "de-collab-relay-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Blind WebSocket relay for Design Editor collaboration tunnels"
publish = false

[dependencies]
base64 = "0.22"
blake3 = "1.5"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
futures-util = "0.3"
de-auth-bridge = { path = "../de-auth-bridge" }
de-collab-policy-file = { path = "../de-collab-policy-file" }
de-collab-relay-protocol = { path = "../de-collab-relay-protocol" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
subtle = "2.6"
thiserror.workspace = true
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-tungstenite = "0.24"
tracing.workspace = true
tracing-subscriber.workspace = true
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
de-auth-bridge = { path = "../de-auth-bridge", features = ["test-issuer"] }
tempfile = "3"
