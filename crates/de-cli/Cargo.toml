[package]
name = "de-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Design Editor `de` CLI — drives the editor via the HTTP MCP transport and runs the design agent headless"

# The binary is `de` (the command users type); the crate is `de-cli`.
[[bin]]
name = "de"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
# `de agent`: progress deltas and token counts of the shared design-agent engine.
de-ai = { path = "../de-ai", optional = true }
de-ai-skills = { path = "../de-ai-skills" }
de-config-store = { path = "../de-config-store" }
# Shared MCP defaults (port + local endpoint URL helpers). Already in the
# build graph transitively via de-pen-loader, so this adds no new crates.
de-editor-core = { path = "../de-editor-core" }
jian-ops-schema = { path = "../../vendor/jian/crates/jian-ops-schema" }
de-figma = { path = "../de-figma" }
# `de agent` runs the in-app design agent in process: the shared
# `design_agent_run` engine, document load / atomic save, the exporters and
# the app's saved provider settings. Optional: it brings skia, tokio and
# reqwest, ~50 MiB of the release binary.
de-host-services = { path = "../de-host-services", optional = true }
de-pptx = { path = "../de-pptx" }
de-html = { path = "../de-html" }
de-pen-loader = { path = "../de-pen-loader", default-features = false }
de-process-io = { path = "../de-process-io" }
de-rpc-transport = { path = "../de-rpc-transport" }
# Canonical JSON string escaping (dependency-free).
de-util = { path = "../de-util" }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
# `de agent --tasks`: YAML (and JSON) task files. Panic-free parser with
# line / column error reports; pinned exactly like the other parsers.
serde-saphyr = { version = "=2.1.1", default-features = false, features = ["deserialize"], optional = true }
# `de agent`: Ctrl+C cancels the run instead of killing it mid-save.
signal-hook = { version = "0.3", optional = true }

[features]
default = ["agent"]
# `de agent`: the headless design agent (#397). Releases build it; turn it
# off (`--no-default-features`) for a slim `de` that only drives a running
# editor over MCP. CI checks both.
agent = [
  "dep:de-ai",
  "dep:de-host-services",
  "dep:serde",
  "dep:serde-saphyr",
  "dep:signal-hook",
]

[target.'cfg(unix)'.dev-dependencies]
# The Ctrl+C integration test signals the child `de` process.
libc = "0.2"

[lints]
workspace = true
