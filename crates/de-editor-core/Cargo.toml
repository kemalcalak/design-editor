[package]
name = "de-editor-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Design Editor editor state — selection/tool/history/viewport on jian PenDocument"

[dependencies]
jian-ops-schema = { path = "../../vendor/jian/crates/jian-ops-schema" }
jian-core = { path = "../../vendor/jian/crates/jian-core" }
jian-widgets = { path = "../../vendor/jian/crates/jian-widgets" }

# Locale enum for the chrome UI state (ui_chrome.rs). de-i18n is
# dependency-free + wasm32-clean, so it doesn't compromise the
# wasm-clean invariant of de-editor-core.
de-i18n = { path = "../de-i18n" }

# Chat-request data shapes (ThinkingMode / EffortLevel / ChatAttachment)
# the chat sub-state carries. de-ai is dependency-free + wasm32-clean
# and never imports de-editor-core, so this edge is acyclic + safe.
de-ai = { path = "../de-ai" }

# Canonical hex-color parsing (dependency-free + wasm32-clean).
de-util = { path = "../de-util" }
base64 = "0.22"

# render_backend.rs uses glam::Vec2 as Point2D (spec §5.2). Pinned to the
# same version de-editor-ui uses so both crates resolve one glam.
glam = { version = "0.29", default-features = false, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# Test-only: the Home task wrappers must keep steering the orchestrator's
# design-type detection. de-orchestrator depends on this crate, so this
# can only ever be a dev-dependency (a legal cycle in Cargo).
[dev-dependencies]
de-orchestrator = { path = "../de-orchestrator" }
