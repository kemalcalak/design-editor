# In-app release notes, shown once on the first launch after an update.
#
# One [[note]] block per (version, locale); keep the newest release at the
# top for readers (the window sorts by version itself). Every release needs
# all 15 UI locales (see `de_i18n::Locale::ALL`), each with an `intro`
# exactly when en-US has one and the same number of `item` lines; a test
# enforces this. A missing locale falls back to en-US at runtime.
#
# Fields: `version`, `locale` (BCP-47 code), `title`, optional `intro`
# (one short paragraph) and one `item = "..."` line per bullet, in order.
# Write for users: short, plain, no issue numbers or technical terms.

[[note]]
version = "0.5.7"
locale = "en-US"
title = "Smoother scrolling and better web imports"
item = "On Windows the editor no longer freezes after you minimize the window and bring it back."
item = "The mouse wheel now scrolls the canvas: hold Shift to scroll sideways and Ctrl or Cmd to zoom. Side panels scroll one line per notch."
item = "Imported web pages stay editable: centred text stays centred, buttons grow with their label, cut-off text keeps its \"…\", empty fields keep their placeholder, and layers are named after what they are."
item = "A web page brings its own fonts along, and medium-weight text looks the same as in your browser."
item = "In the agent settings, the install command is shown in full and has a copy button."
item = "Layer names stay readable in deeply nested designs."

[[note]]
version = "0.5.7"
locale = "tr"
title = "Daha akıcı kaydırma ve daha iyi web içe aktarma"
item = "Windows'ta pencereyi simge durumuna küçültüp geri açınca düzenleyici artık donmuyor."
item = "Fare tekerleği artık tuvali kaydırıyor: yana kaydırmak için Shift'e, yakınlaştırmak için Ctrl ya da Cmd'ye basılı tutun. Yan paneller her çentikte bir satır kayıyor."
item = "İçe aktarılan web sayfaları düzenlenebilir kalıyor: ortalanmış metin ortada kalıyor, butonlar etiketleriyle birlikte büyüyor, kesilen metin \"…\" ile bitiyor, boş alanlar yer tutucu metinlerini koruyor ve katmanlar ne olduklarına göre adlandırılıyor."
item = "Web sayfası kendi fontlarını da getiriyor; orta kalınlıktaki metin tarayıcınızdakiyle aynı görünüyor."
item = "Ajan ayarlarında kurulum komutu tamamı görünecek şekilde gösteriliyor ve bir kopyalama butonu var."
item = "Çok iç içe tasarımlarda katman adları okunur kalıyor."

[[note]]
version = "0.5.7"
locale = "zh-CN"
title = "更顺畅的滚动与更好的网页导入"
item = "在 Windows 上,最小化窗口后再恢复,编辑器不再卡死。"
item = "鼠标滚轮现在会滚动画布:按住 Shift 横向滚动,按住 Ctrl 或 Cmd 缩放。侧边面板每格滚动一行。"
item = "导入的网页保持可编辑:居中的文字保持居中,按钮随文字变长,被截断的文字保留「…」,空输入框保留占位文字,图层按其内容命名。"
item = "网页会一并带来自己的字体,中等粗细的文字与浏览器中显示一致。"
item = "在代理设置中,安装命令会完整显示,并带有复制按钮。"
item = "在层级很深的设计中,图层名称依然清晰可读。"

[[note]]
version = "0.5.7"
locale = "zh-TW"
title = "更流暢的捲動與更好的網頁匯入"
item = "在 Windows 上,將視窗最小化後再還原,編輯器不再當住。"
item = "滑鼠滾輪現在會捲動畫布:按住 Shift 橫向捲動,按住 Ctrl 或 Cmd 縮放。側邊面板每格捲動一行。"
item = "匯入的網頁保持可編輯:置中的文字維持置中,按鈕隨文字變長,被截斷的文字保留「…」,空白欄位保留預留文字,圖層依其內容命名。"
item = "網頁會一併帶來自己的字型,中等粗細的文字與瀏覽器中顯示一致。"
item = "在代理設定中,安裝指令會完整顯示,並附有複製按鈕。"
item = "在層級很深的設計中,圖層名稱依然清楚易讀。"

[[note]]
version = "0.5.7"
locale = "ja"
title = "なめらかなスクロールと Web 取り込みの改善"
item = "Windows でウィンドウを最小化して元に戻しても、エディタが固まらなくなりました。"
item = "マウスホイールでキャンバスがスクロールするようになりました。Shift で横方向、Ctrl または Cmd でズームします。サイドパネルは 1 目盛りで 1 行ずつスクロールします。"
item = "取り込んだ Web ページは編集しやすいままです。中央揃えのテキストは中央のまま、ボタンはラベルに合わせて広がり、切れたテキストは「…」を保ち、空の入力欄はプレースホルダーを保ち、レイヤーは中身に合った名前になります。"
item = "Web ページは自分のフォントも一緒に持ち込み、中くらいの太さの文字がブラウザと同じに見えます。"
item = "エージェント設定のインストールコマンドが全文表示され、コピーボタンが付きました。"
item = "深く入れ子になったデザインでもレイヤー名が読みやすくなりました。"

[[note]]
version = "0.5.7"
locale = "ko"
title = "더 매끄러운 스크롤과 더 나은 웹 가져오기"
item = "Windows에서 창을 최소화했다가 다시 열어도 편집기가 더 이상 멈추지 않습니다."
item = "이제 마우스 휠로 캔버스를 스크롤합니다. Shift를 누르면 가로로, Ctrl 또는 Cmd를 누르면 확대/축소합니다. 사이드 패널은 한 칸에 한 줄씩 스크롤됩니다."
item = "가져온 웹 페이지가 편집하기 쉬운 상태로 유지됩니다. 가운데 정렬된 텍스트는 가운데에 남고, 버튼은 레이블에 맞춰 늘어나며, 잘린 텍스트는 \"…\"를 유지하고, 빈 입력란은 자리 표시자를 유지하며, 레이어는 내용에 맞는 이름을 갖습니다."
item = "웹 페이지가 자신의 글꼴도 함께 가져오며, 중간 굵기의 텍스트가 브라우저와 똑같이 보입니다."
item = "에이전트 설정에서 설치 명령이 전부 표시되고 복사 버튼이 생겼습니다."
item = "깊게 중첩된 디자인에서도 레이어 이름을 읽기 쉽습니다."

[[note]]
version = "0.5.7"
locale = "fr"
title = "Un défilement plus fluide et de meilleurs imports web"
item = "Sous Windows, l'éditeur ne se fige plus quand vous réduisez la fenêtre puis la rouvrez."
item = "La molette fait maintenant défiler le canevas : maintenez Maj pour défiler horizontalement et Ctrl ou Cmd pour zoomer. Les panneaux latéraux défilent d'une ligne par cran."
item = "Les pages web importées restent modifiables : le texte centré reste centré, les boutons s'agrandissent avec leur libellé, le texte coupé garde ses « … », les champs vides gardent leur texte indicatif et les calques portent un nom qui dit ce qu'ils sont."
item = "Une page web apporte ses propres polices, et le texte de graisse moyenne s'affiche comme dans votre navigateur."
item = "Dans les réglages des agents, la commande d'installation s'affiche en entier, avec un bouton pour la copier."
item = "Les noms de calques restent lisibles dans les designs très imbriqués."

[[note]]
version = "0.5.7"
locale = "es"
title = "Desplazamiento más fluido y mejores importaciones web"
item = "En Windows, el editor ya no se congela al minimizar la ventana y volver a abrirla."
item = "La rueda del ratón ahora desplaza el lienzo: mantén Mayús para desplazarte en horizontal y Ctrl o Cmd para hacer zoom. Los paneles laterales avanzan una línea por muesca."
item = "Las páginas web importadas siguen siendo editables: el texto centrado se mantiene centrado, los botones crecen con su etiqueta, el texto recortado conserva sus «…», los campos vacíos conservan su texto de ejemplo y las capas se nombran según lo que son."
item = "Una página web trae sus propias fuentes, y el texto de grosor medio se ve igual que en tu navegador."
item = "En los ajustes de agentes, el comando de instalación se muestra completo y tiene un botón para copiarlo."
item = "Los nombres de las capas siguen siendo legibles en diseños muy anidados."

[[note]]
version = "0.5.7"
locale = "de"
title = "Flüssigeres Scrollen und bessere Web-Importe"
item = "Unter Windows friert der Editor nicht mehr ein, wenn Sie das Fenster minimieren und wiederherstellen."
item = "Das Mausrad scrollt jetzt die Arbeitsfläche: Halten Sie Umschalt für seitliches Scrollen und Strg oder Cmd zum Zoomen. Seitenleisten scrollen eine Zeile pro Raste."
item = "Importierte Webseiten bleiben bearbeitbar: Zentrierter Text bleibt zentriert, Schaltflächen wachsen mit ihrer Beschriftung, abgeschnittener Text behält sein „…“, leere Felder behalten ihren Platzhalter, und Ebenen heißen nach dem, was sie sind."
item = "Eine Webseite bringt ihre eigenen Schriften mit, und Text in mittlerer Stärke sieht aus wie in Ihrem Browser."
item = "In den Agenten-Einstellungen wird der Installationsbefehl vollständig angezeigt und hat eine Schaltfläche zum Kopieren."
item = "Ebenennamen bleiben auch in tief verschachtelten Designs lesbar."

[[note]]
version = "0.5.7"
locale = "pt"
title = "Rolagem mais suave e importações web melhores"
item = "No Windows, o editor não trava mais ao minimizar a janela e abri-la de novo."
item = "A roda do mouse agora rola a tela: segure Shift para rolar na horizontal e Ctrl ou Cmd para dar zoom. Os painéis laterais rolam uma linha por clique."
item = "Páginas web importadas continuam editáveis: texto centralizado fica centralizado, botões crescem com o rótulo, texto cortado mantém as \"…\", campos vazios mantêm o texto de exemplo e as camadas recebem nomes que dizem o que são."
item = "Uma página web traz as próprias fontes, e o texto de peso médio aparece igual ao do seu navegador."
item = "Nas configurações de agentes, o comando de instalação aparece inteiro e tem um botão para copiar."
item = "Os nomes das camadas continuam legíveis em designs muito aninhados."

[[note]]
version = "0.5.7"
locale = "ru"
title = "Плавная прокрутка и улучшенный импорт веб-страниц"
item = "В Windows редактор больше не зависает, если свернуть окно и снова его открыть."
item = "Колесо мыши теперь прокручивает холст: удерживайте Shift для прокрутки по горизонтали и Ctrl или Cmd для масштабирования. Боковые панели прокручиваются на одну строку за щелчок."
item = "Импортированные веб-страницы остаются редактируемыми: текст по центру остаётся по центру, кнопки растут вместе с подписью, обрезанный текст сохраняет «…», пустые поля сохраняют подсказку, а слои называются по тому, что они собой представляют."
item = "Веб-страница приносит с собой свои шрифты, а текст средней насыщенности выглядит так же, как в браузере."
item = "В настройках агентов команда установки показана полностью и имеет кнопку копирования."
item = "Названия слоёв остаются читаемыми в глубоко вложенных макетах."

[[note]]
version = "0.5.7"
locale = "hi"
title = "ज़्यादा सहज स्क्रॉलिंग और बेहतर वेब आयात"
item = "Windows पर विंडो को छोटा करके दोबारा खोलने पर एडिटर अब नहीं अटकता।"
item = "माउस व्हील अब कैनवास को स्क्रॉल करता है: बगल में स्क्रॉल करने के लिए Shift और ज़ूम के लिए Ctrl या Cmd दबाए रखें। साइड पैनल हर क्लिक पर एक पंक्ति खिसकते हैं।"
item = "आयात किए गए वेब पेज बदले जा सकते हैं: बीच में रखा टेक्स्ट बीच में रहता है, बटन अपने लेबल के साथ बढ़ते हैं, कटा हुआ टेक्स्ट \"…\" बनाए रखता है, खाली फ़ील्ड अपना संकेत टेक्स्ट रखते हैं, और लेयर का नाम उसकी सामग्री के हिसाब से होता है।"
item = "वेब पेज अपने फ़ॉन्ट भी साथ लाता है, और मध्यम मोटाई का टेक्स्ट आपके ब्राउज़र जैसा ही दिखता है।"
item = "एजेंट सेटिंग्स में इंस्टॉल कमांड पूरी दिखती है और उसे कॉपी करने का बटन है।"
item = "बहुत गहराई तक नेस्ट किए गए डिज़ाइनों में भी लेयर के नाम पढ़ने में आसान रहते हैं।"

[[note]]
version = "0.5.7"
locale = "th"
title = "เลื่อนลื่นขึ้นและนำเข้าเว็บได้ดีขึ้น"
item = "บน Windows เอดิเตอร์ไม่ค้างอีกต่อไปเมื่อย่อหน้าต่างแล้วเปิดกลับมา"
item = "ตอนนี้ล้อเมาส์เลื่อนแคนวาส: กด Shift ค้างไว้เพื่อเลื่อนแนวนอน และ Ctrl หรือ Cmd เพื่อซูม แผงด้านข้างเลื่อนทีละหนึ่งบรรทัดต่อหนึ่งจังหวะ"
item = "หน้าเว็บที่นำเข้ายังแก้ไขได้ง่าย: ข้อความที่จัดกึ่งกลางยังคงอยู่ตรงกลาง ปุ่มขยายตามป้ายกำกับ ข้อความที่ถูกตัดยังคงมี \"…\" ช่องว่างยังคงมีข้อความตัวอย่าง และเลเยอร์มีชื่อตามสิ่งที่มันเป็น"
item = "หน้าเว็บนำฟอนต์ของตัวเองมาด้วย และข้อความน้ำหนักปานกลางดูเหมือนในเบราว์เซอร์ของคุณ"
item = "ในการตั้งค่าเอเจนต์ คำสั่งติดตั้งแสดงเต็มบรรทัดและมีปุ่มคัดลอก"
item = "ชื่อเลเยอร์ยังอ่านได้ง่ายในงานออกแบบที่ซ้อนกันหลายชั้น"

[[note]]
version = "0.5.7"
locale = "vi"
title = "Cuộn mượt hơn và nhập trang web tốt hơn"
item = "Trên Windows, trình chỉnh sửa không còn bị treo khi bạn thu nhỏ cửa sổ rồi mở lại."
item = "Con lăn chuột giờ cuộn khung vẽ: giữ Shift để cuộn ngang và Ctrl hoặc Cmd để thu phóng. Các bảng bên cuộn một dòng mỗi nấc."
item = "Trang web đã nhập vẫn dễ chỉnh sửa: chữ căn giữa vẫn ở giữa, nút dài ra theo nhãn, chữ bị cắt vẫn giữ dấu \"…\", ô trống vẫn giữ chữ gợi ý, và các lớp được đặt tên theo đúng nội dung."
item = "Trang web mang theo phông chữ của riêng nó, và chữ đậm vừa trông giống như trong trình duyệt của bạn."
item = "Trong phần cài đặt tác nhân, lệnh cài đặt hiển thị đầy đủ và có nút sao chép."
item = "Tên lớp vẫn dễ đọc trong các thiết kế lồng nhau nhiều tầng."

[[note]]
version = "0.5.7"
locale = "id"
title = "Gulir lebih mulus dan impor web lebih baik"
item = "Di Windows, editor tidak lagi macet saat jendela diperkecil lalu dibuka kembali."
item = "Roda mouse kini menggulir kanvas: tahan Shift untuk menggulir ke samping dan Ctrl atau Cmd untuk zoom. Panel samping bergulir satu baris per takik."
item = "Halaman web yang diimpor tetap bisa diedit: teks di tengah tetap di tengah, tombol melebar mengikuti labelnya, teks yang terpotong tetap berakhiran \"…\", kolom kosong tetap menampilkan teks petunjuk, dan lapisan diberi nama sesuai isinya."
item = "Halaman web membawa fontnya sendiri, dan teks berketebalan sedang tampak sama seperti di browser Anda."
item = "Di pengaturan agen, perintah instalasi ditampilkan utuh dan punya tombol salin."
item = "Nama lapisan tetap mudah dibaca dalam desain yang sangat bertingkat."

[[note]]
version = "0.5.6"
locale = "en-US"
title = "Web pages you can edit"
item = "A web page brought in through the browser can now arrive as auto layout: change a label, a spacing or a size, and everything around it moves along, like a design made in the editor."
item = "Lucide icons on imported pages come in as real icons you can swap and recolour, and scrolling areas stay clipped."

[[note]]
version = "0.5.6"
locale = "tr"
title = "Düzenlenebilir web sayfaları"
item = "Tarayıcıdan getirilen bir web sayfası artık otomatik yerleşimle gelebiliyor: bir etiketi, boşluğu ya da boyutu değiştirin, çevresindeki her şey editörde yapılmış bir tasarımdaki gibi kayıyor."
item = "İçe aktarılan sayfalardaki Lucide ikonları değiştirilip yeniden renklendirilebilen gerçek ikonlar olarak geliyor; kaydırılan alanlar kırpılı kalıyor."

[[note]]
version = "0.5.6"
locale = "zh-CN"
title = "可编辑的网页"
item = "通过浏览器导入的网页现在可以采用自动布局:修改文字、间距或尺寸时,周围的内容会像在编辑器中做的设计一样随之移动。"
item = "导入页面中的 Lucide 图标会成为可替换、可重新着色的真正图标,滚动区域也会保持裁剪。"

[[note]]
version = "0.5.6"
locale = "zh-TW"
title = "可編輯的網頁"
item = "透過瀏覽器匯入的網頁現在可以使用自動版面:修改文字、間距或尺寸時,周圍的內容會像在編輯器中製作的設計一樣跟著移動。"
item = "匯入頁面中的 Lucide 圖示會成為可替換、可重新上色的真正圖示,捲動區域也會維持裁切。"

[[note]]
version = "0.5.6"
locale = "ja"
title = "編集できるウェブページ"
item = "ブラウザから取り込んだウェブページを自動レイアウトで取り込めるようになりました。ラベルや余白、サイズを変えると、エディタで作ったデザインと同じように周りも合わせて動きます。"
item = "取り込んだページの Lucide アイコンは、差し替えや色の変更ができる本物のアイコンになり、スクロール領域は切り抜かれたままです。"

[[note]]
version = "0.5.6"
locale = "ko"
title = "편집할 수 있는 웹 페이지"
item = "브라우저로 가져온 웹 페이지를 이제 자동 레이아웃으로 가져올 수 있습니다. 레이블, 간격, 크기를 바꾸면 편집기에서 만든 디자인처럼 주변 요소도 함께 움직입니다."
item = "가져온 페이지의 Lucide 아이콘은 바꾸고 색을 다시 입힐 수 있는 실제 아이콘으로 들어오며, 스크롤 영역은 잘린 상태로 유지됩니다."

[[note]]
version = "0.5.6"
locale = "fr"
title = "Des pages web modifiables"
item = "Une page web importée par le navigateur peut maintenant arriver en mise en page automatique : changez un libellé, un espacement ou une taille, et tout ce qui l'entoure suit, comme dans un design fait dans l'éditeur."
item = "Les icônes Lucide des pages importées deviennent de vraies icônes que vous pouvez remplacer et recolorer, et les zones défilantes restent rognées."

[[note]]
version = "0.5.6"
locale = "es"
title = "Páginas web editables"
item = "Una página web traída con el navegador ahora puede llegar con diseño automático: cambia una etiqueta, un espaciado o un tamaño y todo lo que la rodea se mueve con ella, como en un diseño hecho en el editor."
item = "Los iconos de Lucide de las páginas importadas llegan como iconos reales que puedes cambiar y recolorear, y las zonas con desplazamiento siguen recortadas."

[[note]]
version = "0.5.6"
locale = "de"
title = "Bearbeitbare Webseiten"
item = "Eine über den Browser geholte Webseite kann jetzt mit automatischem Layout ankommen: Ändern Sie eine Beschriftung, einen Abstand oder eine Größe, und alles darum herum rückt mit, wie bei einem im Editor erstellten Design."
item = "Lucide-Symbole importierter Seiten kommen als echte Symbole an, die Sie austauschen und umfärben können, und scrollbare Bereiche bleiben beschnitten."

[[note]]
version = "0.5.6"
locale = "pt"
title = "Páginas web editáveis"
item = "Uma página web trazida pelo navegador agora pode chegar com layout automático: mude um rótulo, um espaçamento ou um tamanho, e tudo ao redor acompanha, como num design feito no editor."
item = "Os ícones Lucide das páginas importadas chegam como ícones reais que você pode trocar e recolorir, e as áreas com rolagem continuam recortadas."

[[note]]
version = "0.5.6"
locale = "ru"
title = "Веб-страницы, которые можно редактировать"
item = "Веб-страницу, загруженную через браузер, теперь можно получить с автоматической раскладкой: измените подпись, отступ или размер, и всё вокруг сдвинется, как в макете, созданном в редакторе."
item = "Иконки Lucide на импортированных страницах приходят как настоящие иконки, которые можно заменить и перекрасить, а прокручиваемые области остаются обрезанными."

[[note]]
version = "0.5.6"
locale = "hi"
title = "बदले जा सकने वाले वेब पेज"
item = "ब्राउज़र से लाया गया वेब पेज अब ऑटो लेआउट के साथ आ सकता है: कोई लेबल, दूरी या आकार बदलें, और उसके आसपास का सब कुछ एडिटर में बने डिज़ाइन की तरह साथ में खिसकता है।"
item = "आयात किए गए पेजों के Lucide आइकन असली आइकन बनकर आते हैं जिन्हें आप बदल और दोबारा रंग सकते हैं, और स्क्रॉल होने वाले हिस्से कटे हुए रहते हैं।"

[[note]]
version = "0.5.6"
locale = "th"
title = "หน้าเว็บที่แก้ไขได้"
item = "หน้าเว็บที่นำเข้ามาผ่านเบราว์เซอร์สามารถมาพร้อมเลย์เอาต์อัตโนมัติได้แล้ว: เปลี่ยนป้ายกำกับ ระยะห่าง หรือขนาด แล้วทุกอย่างรอบ ๆ จะขยับตาม เหมือนงานออกแบบที่ทำในเอดิเตอร์"
item = "ไอคอน Lucide ในหน้าที่นำเข้าจะเป็นไอคอนจริงที่เปลี่ยนและเปลี่ยนสีได้ และพื้นที่ที่เลื่อนได้ยังคงถูกตัดขอบไว้"

[[note]]
version = "0.5.6"
locale = "vi"
title = "Trang web có thể chỉnh sửa"
item = "Trang web đưa vào qua trình duyệt giờ có thể đến với bố cục tự động: đổi một nhãn, khoảng cách hay kích thước, mọi thứ xung quanh sẽ dịch theo, giống như một thiết kế làm trong trình chỉnh sửa."
item = "Biểu tượng Lucide trên các trang đã nhập trở thành biểu tượng thật mà bạn có thể thay và đổi màu, còn các vùng cuộn vẫn được cắt gọn."

[[note]]
version = "0.5.6"
locale = "id"
title = "Halaman web yang bisa diedit"
item = "Halaman web yang dibawa lewat browser kini bisa datang dengan tata letak otomatis: ubah label, jarak, atau ukuran, dan semua di sekitarnya ikut bergeser, seperti desain yang dibuat di editor."
item = "Ikon Lucide di halaman yang diimpor datang sebagai ikon sungguhan yang bisa Anda ganti dan warnai ulang, dan area yang bisa digulir tetap terpotong."

[[note]]
version = "0.5.5"
locale = "en-US"
title = "Outlined text and local pages"
item = "Text can have an outline: give it a stroke in the properties panel. Outlined text from pen.dev files now comes through, and it exports to PNG, PDF, SVG, HTML and PowerPoint."
item = "Radial and angular gradients from pen.dev files keep their off-centre position."
item = "A browser element can show a page from your project folder, such as ./video/player.html. Pages in pen.dev files are found next to the design, and a page that cannot load says why."
item = "Importing a pen.dev file from its own folder on the command line brings in all its images and effects."
item = "Starting the editor in the background waits for large files, and tells you when another one is already running."

[[note]]
version = "0.5.5"
locale = "tr"
title = "Konturlu metin ve yerel sayfalar"
item = "Metne kontur verilebiliyor: özellikler panelinde ona bir kenarlık ekleyin. pen.dev dosyalarındaki konturlu metin artık korunuyor ve PNG, PDF, SVG, HTML ve PowerPoint'e aktarılıyor."
item = "pen.dev dosyalarındaki radyal ve açısal gradyanlar merkez dışındaki konumlarını koruyor."
item = "Tarayıcı öğesi proje klasörünüzdeki bir sayfayı gösterebiliyor, örneğin ./video/player.html. pen.dev dosyalarındaki sayfalar tasarımın yanında bulunuyor; yüklenemeyen bir sayfa nedenini söylüyor."
item = "Komut satırında bir pen.dev dosyasını kendi klasöründen içe aktarmak tüm görsellerini ve efektlerini getiriyor."
item = "Düzenleyiciyi arka planda başlatmak büyük dosyaları bekliyor ve zaten çalışan bir tane varsa bunu söylüyor."

[[note]]
version = "0.5.5"
locale = "zh-CN"
title = "描边文字与本地页面"
item = "文字可以加描边:在属性面板中为它添加描边。pen.dev 文件中的描边文字现在会保留,并可导出为 PNG、PDF、SVG、HTML 和 PowerPoint。"
item = "pen.dev 文件中的径向和角度渐变会保留偏离中心的位置。"
item = "浏览器元素可以显示项目文件夹中的页面,例如 ./video/player.html。pen.dev 文件中的页面会在设计文件旁边查找,无法加载的页面会显示原因。"
item = "在命令行中从 pen.dev 文件所在的文件夹导入时,会带上它的所有图片和效果。"
item = "在后台启动编辑器时会等待大文件加载完成,如果已有一个在运行也会提示你。"

[[note]]
version = "0.5.5"
locale = "zh-TW"
title = "描邊文字與本機頁面"
item = "文字可以加上描邊:在屬性面板中為它加上描邊。pen.dev 檔案中的描邊文字現在會保留,並可匯出為 PNG、PDF、SVG、HTML 和 PowerPoint。"
item = "pen.dev 檔案中的放射狀和角度漸層會保留偏離中心的位置。"
item = "瀏覽器元素可以顯示專案資料夾中的頁面,例如 ./video/player.html。pen.dev 檔案中的頁面會在設計檔旁邊尋找,無法載入的頁面會說明原因。"
item = "在命令列中從 pen.dev 檔案所在的資料夾匯入時,會帶入它的所有圖片和效果。"
item = "在背景啟動編輯器時會等待大型檔案載入完成,若已有一個在執行也會告訴你。"

[[note]]
version = "0.5.5"
locale = "ja"
title = "アウトライン文字とローカルページ"
item = "テキストにアウトラインを付けられるようになりました。プロパティパネルで線を追加してください。pen.dev ファイルのアウトライン文字も保持され、PNG、PDF、SVG、HTML、PowerPoint に書き出せます。"
item = "pen.dev ファイルの放射状・角度グラデーションが、中心からずれた位置を保つようになりました。"
item = "ブラウザ要素でプロジェクトフォルダ内のページ（例: ./video/player.html）を表示できます。pen.dev ファイルのページはデザインの隣から探し、読み込めないページは理由を表示します。"
item = "コマンドラインで pen.dev ファイルをそのフォルダから読み込むと、画像とエフェクトがすべて取り込まれます。"
item = "エディタをバックグラウンドで起動すると大きなファイルの読み込みを待ち、すでに起動中のものがあればそれを知らせます。"

[[note]]
version = "0.5.5"
locale = "ko"
title = "윤곽선 텍스트와 로컬 페이지"
item = "텍스트에 윤곽선을 줄 수 있습니다. 속성 패널에서 선을 추가하세요. pen.dev 파일의 윤곽선 텍스트도 유지되며 PNG, PDF, SVG, HTML, PowerPoint로 내보낼 수 있습니다."
item = "pen.dev 파일의 방사형·각도 그라데이션이 중심에서 벗어난 위치를 유지합니다."
item = "브라우저 요소에서 프로젝트 폴더의 페이지(예: ./video/player.html)를 표시할 수 있습니다. pen.dev 파일의 페이지는 디자인 옆에서 찾고, 불러올 수 없는 페이지는 이유를 알려 줍니다."
item = "명령줄에서 pen.dev 파일을 해당 폴더에서 가져오면 모든 이미지와 효과가 함께 들어옵니다."
item = "편집기를 백그라운드에서 시작하면 큰 파일을 기다리며, 이미 실행 중인 편집기가 있으면 알려 줍니다."

[[note]]
version = "0.5.5"
locale = "fr"
title = "Texte détouré et pages locales"
item = "Le texte peut avoir un contour : ajoutez-lui un trait dans le panneau des propriétés. Le texte détouré des fichiers pen.dev est désormais conservé, et il s'exporte en PNG, PDF, SVG, HTML et PowerPoint."
item = "Les dégradés radiaux et angulaires des fichiers pen.dev gardent leur centre décalé."
item = "Un élément navigateur peut afficher une page de votre dossier de projet, comme ./video/player.html. Les pages des fichiers pen.dev sont recherchées à côté du design, et une page qui ne se charge pas indique pourquoi."
item = "Importer un fichier pen.dev depuis son propre dossier en ligne de commande récupère toutes ses images et tous ses effets."
item = "Lancer l'éditeur en arrière-plan attend le chargement des gros fichiers et vous prévient si un autre est déjà en cours d'exécution."

[[note]]
version = "0.5.5"
locale = "es"
title = "Texto con contorno y páginas locales"
item = "El texto puede tener contorno: añádele un trazo en el panel de propiedades. El texto con contorno de los archivos pen.dev ahora se conserva y se exporta a PNG, PDF, SVG, HTML y PowerPoint."
item = "Los degradados radiales y angulares de los archivos pen.dev mantienen su centro desplazado."
item = "Un elemento de navegador puede mostrar una página de la carpeta de tu proyecto, como ./video/player.html. Las páginas de los archivos pen.dev se buscan junto al diseño y una página que no se puede cargar indica por qué."
item = "Importar un archivo pen.dev desde su propia carpeta en la línea de comandos trae todas sus imágenes y efectos."
item = "Al iniciar el editor en segundo plano, espera a que carguen los archivos grandes y te avisa si ya hay otro en ejecución."

[[note]]
version = "0.5.5"
locale = "de"
title = "Konturtext und lokale Seiten"
item = "Text kann eine Kontur haben: Gib ihm im Eigenschaftenbereich eine Kontur. Konturtext aus pen.dev-Dateien bleibt jetzt erhalten und lässt sich als PNG, PDF, SVG, HTML und PowerPoint exportieren."
item = "Radiale und Winkelverläufe aus pen.dev-Dateien behalten ihre außermittige Position."
item = "Ein Browser-Element kann eine Seite aus deinem Projektordner anzeigen, etwa ./video/player.html. Seiten in pen.dev-Dateien werden neben dem Design gesucht, und eine Seite, die nicht lädt, nennt den Grund."
item = "Wird eine pen.dev-Datei über die Befehlszeile aus ihrem eigenen Ordner importiert, kommen alle ihre Bilder und Effekte mit."
item = "Beim Start des Editors im Hintergrund wird auf große Dateien gewartet, und du erfährst, wenn bereits einer läuft."

[[note]]
version = "0.5.5"
locale = "pt"
title = "Texto com contorno e páginas locais"
item = "O texto pode ter contorno: adicione um traço no painel de propriedades. O texto com contorno dos arquivos pen.dev agora é mantido e pode ser exportado para PNG, PDF, SVG, HTML e PowerPoint."
item = "Gradientes radiais e angulares dos arquivos pen.dev mantêm o centro deslocado."
item = "Um elemento de navegador pode mostrar uma página da pasta do seu projeto, como ./video/player.html. As páginas dos arquivos pen.dev são procuradas ao lado do design, e uma página que não carrega diz por quê."
item = "Importar um arquivo pen.dev a partir da própria pasta pela linha de comando traz todas as suas imagens e efeitos."
item = "Iniciar o editor em segundo plano aguarda arquivos grandes e avisa quando outro já está em execução."

[[note]]
version = "0.5.5"
locale = "ru"
title = "Обводка текста и локальные страницы"
item = "У текста может быть обводка: добавьте ему контур на панели свойств. Текст с обводкой из файлов pen.dev теперь сохраняется и экспортируется в PNG, PDF, SVG, HTML и PowerPoint."
item = "Радиальные и угловые градиенты из файлов pen.dev сохраняют смещённый центр."
item = "Элемент браузера может показывать страницу из папки проекта, например ./video/player.html. Страницы из файлов pen.dev ищутся рядом с макетом, а страница, которая не загрузилась, сообщает причину."
item = "Импорт файла pen.dev из его собственной папки в командной строке переносит все его изображения и эффекты."
item = "Запуск редактора в фоне дожидается загрузки больших файлов и сообщает, если другой уже запущен."

[[note]]
version = "0.5.5"
locale = "hi"
title = "आउटलाइन वाला टेक्स्ट और स्थानीय पेज"
item = "टेक्स्ट पर आउटलाइन दी जा सकती है: प्रॉपर्टी पैनल में उसे स्ट्रोक दें। pen.dev फ़ाइलों का आउटलाइन वाला टेक्स्ट अब बना रहता है और PNG, PDF, SVG, HTML और PowerPoint में एक्सपोर्ट होता है।"
item = "pen.dev फ़ाइलों के रेडियल और कोणीय ग्रेडिएंट अपनी केंद्र से हटी स्थिति बनाए रखते हैं।"
item = "ब्राउज़र एलिमेंट आपके प्रोजेक्ट फ़ोल्डर का पेज दिखा सकता है, जैसे ./video/player.html। pen.dev फ़ाइलों के पेज डिज़ाइन के पास खोजे जाते हैं, और जो पेज लोड नहीं होता वह कारण बताता है।"
item = "कमांड लाइन से pen.dev फ़ाइल को उसके अपने फ़ोल्डर से इम्पोर्ट करने पर उसकी सभी इमेज और इफ़ेक्ट आ जाते हैं।"
item = "एडिटर को बैकग्राउंड में शुरू करने पर यह बड़ी फ़ाइलों का इंतज़ार करता है, और अगर कोई पहले से चल रहा हो तो बताता है।"

[[note]]
version = "0.5.5"
locale = "th"
title = "ข้อความแบบเส้นขอบและหน้าเว็บในเครื่อง"
item = "ข้อความมีเส้นขอบได้แล้ว: เพิ่มเส้นขอบให้ในแผงคุณสมบัติ ข้อความแบบเส้นขอบจากไฟล์ pen.dev จะคงอยู่ และส่งออกเป็น PNG, PDF, SVG, HTML และ PowerPoint ได้"
item = "ไล่ระดับสีแบบรัศมีและแบบมุมจากไฟล์ pen.dev คงตำแหน่งที่เยื้องจากกึ่งกลางไว้"
item = "องค์ประกอบเบราว์เซอร์แสดงหน้าจากโฟลเดอร์โปรเจกต์ได้ เช่น ./video/player.html หน้าในไฟล์ pen.dev จะค้นหาข้างไฟล์ดีไซน์ และหน้าที่โหลดไม่ได้จะบอกสาเหตุ"
item = "การนำเข้าไฟล์ pen.dev จากโฟลเดอร์ของไฟล์เองผ่านบรรทัดคำสั่ง จะนำรูปภาพและเอฟเฟกต์ทั้งหมดเข้ามาด้วย"
item = "การเริ่มโปรแกรมแก้ไขในเบื้องหลังจะรอไฟล์ขนาดใหญ่ และแจ้งให้ทราบหากมีตัวหนึ่งทำงานอยู่แล้ว"

[[note]]
version = "0.5.5"
locale = "vi"
title = "Chữ viền và trang cục bộ"
item = "Chữ có thể có viền: thêm nét viền trong bảng thuộc tính. Chữ viền trong tệp pen.dev giờ được giữ lại và xuất được sang PNG, PDF, SVG, HTML và PowerPoint."
item = "Dải màu dạng tỏa tròn và dạng góc trong tệp pen.dev giữ nguyên vị trí lệch tâm."
item = "Phần tử trình duyệt có thể hiển thị một trang trong thư mục dự án, như ./video/player.html. Các trang trong tệp pen.dev được tìm bên cạnh bản thiết kế, và trang không tải được sẽ cho biết lý do."
item = "Nhập tệp pen.dev từ chính thư mục của nó bằng dòng lệnh sẽ mang theo tất cả hình ảnh và hiệu ứng."
item = "Khởi động trình chỉnh sửa ở chế độ nền sẽ chờ các tệp lớn và báo cho bạn khi đã có một phiên đang chạy."

[[note]]
version = "0.5.5"
locale = "id"
title = "Teks bergaris tepi dan halaman lokal"
item = "Teks bisa diberi garis tepi: tambahkan goresan di panel properti. Teks bergaris tepi dari file pen.dev kini tetap terbawa dan bisa diekspor ke PNG, PDF, SVG, HTML, dan PowerPoint."
item = "Gradien radial dan sudut dari file pen.dev mempertahankan posisi tengahnya yang bergeser."
item = "Elemen browser dapat menampilkan halaman dari folder proyek Anda, seperti ./video/player.html. Halaman dalam file pen.dev dicari di samping desain, dan halaman yang gagal dimuat menyebutkan alasannya."
item = "Mengimpor file pen.dev dari foldernya sendiri lewat baris perintah membawa semua gambar dan efeknya."
item = "Menjalankan editor di latar belakang akan menunggu file besar dan memberi tahu jika sudah ada yang berjalan."

[[note]]
version = "0.5.4"
locale = "en-US"
title = "Security update"
item = "The libraries that read zip and tar archives are updated to close known security issues."

[[note]]
version = "0.5.4"
locale = "tr"
title = "Güvenlik güncellemesi"
item = "Zip ve tar arşivlerini okuyan kitaplıklar, bilinen güvenlik açıklarını kapatmak için güncellendi."

[[note]]
version = "0.5.4"
locale = "zh-CN"
title = "安全更新"
item = "读取 zip 和 tar 压缩包的库已更新,修复了已知的安全问题。"

[[note]]
version = "0.5.4"
locale = "zh-TW"
title = "安全性更新"
item = "讀取 zip 和 tar 壓縮檔的程式庫已更新,修正了已知的安全性問題。"

[[note]]
version = "0.5.4"
locale = "ja"
title = "セキュリティ更新"
item = "zip と tar アーカイブを読み込むライブラリを更新し、既知のセキュリティ問題を修正しました。"

[[note]]
version = "0.5.4"
locale = "ko"
title = "보안 업데이트"
item = "zip 및 tar 압축 파일을 읽는 라이브러리를 업데이트해 알려진 보안 문제를 해결했습니다."

[[note]]
version = "0.5.4"
locale = "fr"
title = "Mise à jour de sécurité"
item = "Les bibliothèques qui lisent les archives zip et tar sont mises à jour pour corriger des failles de sécurité connues."

[[note]]
version = "0.5.4"
locale = "es"
title = "Actualización de seguridad"
item = "Las bibliotecas que leen archivos zip y tar se han actualizado para corregir problemas de seguridad conocidos."

[[note]]
version = "0.5.4"
locale = "de"
title = "Sicherheitsupdate"
item = "Die Bibliotheken, die zip- und tar-Archive lesen, wurden aktualisiert, um bekannte Sicherheitslücken zu schließen."

[[note]]
version = "0.5.4"
locale = "pt"
title = "Atualização de segurança"
item = "As bibliotecas que leem arquivos zip e tar foram atualizadas para corrigir problemas de segurança conhecidos."

[[note]]
version = "0.5.4"
locale = "ru"
title = "Обновление безопасности"
item = "Библиотеки для чтения архивов zip и tar обновлены, чтобы устранить известные уязвимости."

[[note]]
version = "0.5.4"
locale = "hi"
title = "सुरक्षा अपडेट"
item = "zip और tar संग्रह पढ़ने वाली लाइब्रेरी को ज्ञात सुरक्षा समस्याएँ ठीक करने के लिए अपडेट किया गया है।"

[[note]]
version = "0.5.4"
locale = "th"
title = "อัปเดตความปลอดภัย"
item = "อัปเดตไลบรารีที่อ่านไฟล์ zip และ tar เพื่อแก้ไขปัญหาความปลอดภัยที่ทราบแล้ว"

[[note]]
version = "0.5.4"
locale = "vi"
title = "Bản cập nhật bảo mật"
item = "Các thư viện đọc tệp nén zip và tar đã được cập nhật để khắc phục các lỗ hổng bảo mật đã biết."

[[note]]
version = "0.5.4"
locale = "id"
title = "Pembaruan keamanan"
item = "Pustaka yang membaca arsip zip dan tar diperbarui untuk menutup masalah keamanan yang diketahui."

[[note]]
version = "0.5.3"
locale = "en-US"
title = "Smoother work with agents"
item = "When an agent adds a board, the canvas moves to it so you can watch it being designed."
item = "Agents keep the colours you asked for and tell you when text may be hard to read or overlaps other text."
item = "Images an agent picks from a file on your computer now show up, and vector shapes from older files are no longer lost."
item = "Letter-spaced text no longer squeezes letter pairs like \"Ya\" into each other."
item = "Content hidden by its frame can no longer be hovered or picked on empty canvas."

[[note]]
version = "0.5.3"
locale = "tr"
title = "Ajanlarla daha rahat çalışma"
item = "Bir ajan pano eklediğinde tuval ona gider; tasarlanışını izleyebilirsiniz."
item = "Ajanlar istediğiniz renkleri korur; metin zor okunabilecekse ya da başka bir metnin üstüne biniyorsa bunu söyler."
item = "Ajanın bilgisayarınızdaki bir dosyadan seçtiği görseller artık görünür; eski dosyalardaki vektör şekiller de kaybolmaz."
item = "Harf aralığı verilmiş metinlerde \"Ya\" gibi harf çiftleri artık birbirine girmez."
item = "Çerçevesinin gizlediği içerik, boş tuval üzerinde artık vurgulanmaz ve seçilmez."

[[note]]
version = "0.5.3"
locale = "zh-CN"
title = "与智能体协作更顺畅"
item = "智能体添加画板时,画布会移到那里,方便你观看设计过程。"
item = "智能体会保留你要求的颜色,并在文字可能难以阅读或与其他文字重叠时告诉你。"
item = "智能体从你电脑上的文件中选取的图片现在可以正常显示,旧文件中的矢量形状也不会再丢失。"
item = "设置了字间距的文字中,像 \"Ya\" 这样的字母组合不再挤在一起。"
item = "被画框裁切掉的内容,不会再在空白画布上被悬停高亮或选中。"

[[note]]
version = "0.5.3"
locale = "zh-TW"
title = "與智慧代理協作更順暢"
item = "智慧代理新增畫板時,畫布會移到那裡,方便你觀看設計過程。"
item = "智慧代理會保留你要求的顏色,並在文字可能難以閱讀或與其他文字重疊時告訴你。"
item = "智慧代理從你電腦上的檔案選取的圖片現在可以正常顯示,舊檔案中的向量形狀也不會再遺失。"
item = "設定了字距的文字中,像 \"Ya\" 這樣的字母組合不再擠在一起。"
item = "被畫框裁切掉的內容,不會再在空白畫布上被懸停醒目提示或選取。"

[[note]]
version = "0.5.3"
locale = "ja"
title = "エージェントとの作業がスムーズに"
item = "エージェントがボードを追加すると、キャンバスがそこへ移動し、デザインされる様子を見られます。"
item = "エージェントは指定した色をそのまま使い、文字が読みにくいときや他の文字と重なるときは知らせます。"
item = "エージェントがパソコン上のファイルから選んだ画像が表示されるようになり、古いファイルのベクター図形も失われなくなりました。"
item = "字間を設定したテキストで、\"Ya\" のような文字の組み合わせが重ならなくなりました。"
item = "フレームで隠れている内容は、何もないキャンバス上でハイライトされたり選択されたりしなくなりました。"

[[note]]
version = "0.5.3"
locale = "ko"
title = "에이전트와 더 매끄럽게 작업"
item = "에이전트가 보드를 추가하면 캔버스가 그쪽으로 이동해 디자인되는 과정을 볼 수 있습니다."
item = "에이전트가 요청한 색상을 그대로 유지하고, 글자가 읽기 어렵거나 다른 글자와 겹치면 알려 줍니다."
item = "에이전트가 컴퓨터의 파일에서 고른 이미지가 이제 표시되며, 이전 파일의 벡터 도형도 사라지지 않습니다."
item = "자간을 설정한 텍스트에서 \"Ya\" 같은 글자 쌍이 더 이상 서로 겹치지 않습니다."
item = "프레임에 가려진 콘텐츠는 빈 캔버스에서 더 이상 강조 표시되거나 선택되지 않습니다."

[[note]]
version = "0.5.3"
locale = "fr"
title = "Travailler plus facilement avec les agents"
item = "Quand un agent ajoute un plan de travail, le canevas s'y déplace pour que vous suiviez sa conception."
item = "Les agents gardent les couleurs demandées et signalent un texte peu lisible ou qui en chevauche un autre."
item = "Les images qu'un agent prend dans un fichier de votre ordinateur s'affichent désormais, et les formes vectorielles des anciens fichiers ne se perdent plus."
item = "Avec un espacement des lettres, les paires comme \"Ya\" ne se chevauchent plus."
item = "Le contenu masqué par son cadre ne peut plus être survolé ni sélectionné sur le canevas vide."

[[note]]
version = "0.5.3"
locale = "es"
title = "Trabajo más fluido con agentes"
item = "Cuando un agente añade un tablero, el lienzo se desplaza hasta él para que veas cómo se diseña."
item = "Los agentes mantienen los colores que pediste y avisan si un texto puede ser difícil de leer o se superpone a otro."
item = "Las imágenes que un agente toma de un archivo de tu ordenador ahora se ven, y las formas vectoriales de archivos antiguos ya no se pierden."
item = "En textos con espaciado entre letras, pares como \"Ya\" ya no se montan uno sobre otro."
item = "El contenido que oculta su marco ya no se resalta ni se selecciona sobre el lienzo vacío."

[[note]]
version = "0.5.3"
locale = "de"
title = "Reibungsloser mit Agenten arbeiten"
item = "Fügt ein Agent eine Zeichenfläche hinzu, springt die Ansicht dorthin, damit du beim Entwerfen zusehen kannst."
item = "Agenten behalten die gewünschten Farben und melden, wenn Text schwer lesbar ist oder anderen Text überlappt."
item = "Bilder, die ein Agent aus einer Datei auf deinem Computer nimmt, werden jetzt angezeigt, und Vektorformen aus älteren Dateien gehen nicht mehr verloren."
item = "Bei Text mit Zeichenabstand überlappen Buchstabenpaare wie \"Ya\" nicht mehr."
item = "Inhalte, die ihr Rahmen verdeckt, lassen sich auf leerer Fläche nicht mehr hervorheben oder auswählen."

[[note]]
version = "0.5.3"
locale = "pt"
title = "Trabalho mais fluido com agentes"
item = "Quando um agente adiciona uma prancheta, a tela vai até ela para você acompanhar o design."
item = "Os agentes mantêm as cores que você pediu e avisam quando um texto pode ficar difícil de ler ou se sobrepõe a outro."
item = "Imagens que um agente pega de um arquivo do seu computador agora aparecem, e formas vetoriais de arquivos antigos não se perdem mais."
item = "Em textos com espaçamento entre letras, pares como \"Ya\" não se sobrepõem mais."
item = "Conteúdo oculto pelo seu quadro não é mais destacado nem selecionado na tela vazia."

[[note]]
version = "0.5.3"
locale = "ru"
title = "Удобнее работать с агентами"
item = "Когда агент добавляет монтажную область, холст переходит к ней, и вы видите, как идёт работа."
item = "Агенты сохраняют заданные вами цвета и сообщают, если текст плохо читается или наезжает на другой текст."
item = "Изображения, которые агент берёт из файла на вашем компьютере, теперь отображаются, а векторные фигуры из старых файлов больше не теряются."
item = "В тексте с межбуквенным интервалом пары вроде \"Ya\" больше не наползают друг на друга."
item = "Содержимое, скрытое рамкой, больше не подсвечивается и не выбирается на пустом холсте."

[[note]]
version = "0.5.3"
locale = "hi"
title = "एजेंट के साथ आसान काम"
item = "जब कोई एजेंट बोर्ड जोड़ता है, तो कैनवास वहीं चला जाता है ताकि आप डिज़ाइन बनते हुए देख सकें।"
item = "एजेंट आपके चुने हुए रंग बनाए रखते हैं और बताते हैं जब टेक्स्ट पढ़ने में कठिन हो या किसी दूसरे टेक्स्ट पर चढ़ रहा हो।"
item = "एजेंट आपके कंप्यूटर की किसी फ़ाइल से जो चित्र चुनता है, वे अब दिखते हैं, और पुरानी फ़ाइलों की वेक्टर आकृतियाँ अब नहीं खोतीं।"
item = "अक्षर-अंतराल वाले टेक्स्ट में \"Ya\" जैसे अक्षर-जोड़े अब एक-दूसरे पर नहीं चढ़ते।"
item = "फ़्रेम से छिपी सामग्री अब खाली कैनवास पर हाइलाइट या चुनी नहीं जाती।"

[[note]]
version = "0.5.3"
locale = "th"
title = "ทำงานร่วมกับเอเจนต์ได้ลื่นขึ้น"
item = "เมื่อเอเจนต์เพิ่มบอร์ด แคนวาสจะเลื่อนไปที่บอร์ดนั้นให้คุณดูการออกแบบได้"
item = "เอเจนต์จะคงสีที่คุณกำหนดไว้ และแจ้งเมื่อข้อความอาจอ่านยากหรือทับข้อความอื่น"
item = "รูปภาพที่เอเจนต์เลือกจากไฟล์ในคอมพิวเตอร์ของคุณแสดงผลได้แล้ว และรูปทรงเวกเตอร์จากไฟล์เก่าไม่หายอีกต่อไป"
item = "ข้อความที่ตั้งระยะห่างตัวอักษร คู่ตัวอักษรอย่าง \"Ya\" จะไม่ซ้อนกันอีกแล้ว"
item = "เนื้อหาที่เฟรมซ่อนไว้จะไม่ถูกไฮไลต์หรือเลือกบนแคนวาสว่างอีกต่อไป"

[[note]]
version = "0.5.3"
locale = "vi"
title = "Làm việc với tác tử mượt mà hơn"
item = "Khi tác tử thêm một bảng vẽ, khung vẽ sẽ chuyển tới đó để bạn theo dõi quá trình thiết kế."
item = "Tác tử giữ đúng màu bạn yêu cầu và báo khi chữ có thể khó đọc hoặc chồng lên chữ khác."
item = "Hình ảnh mà tác tử lấy từ một tệp trên máy tính của bạn nay đã hiển thị, và hình vector trong các tệp cũ không còn bị mất."
item = "Với chữ có giãn cách ký tự, các cặp chữ như \"Ya\" không còn đè lên nhau."
item = "Nội dung bị khung che đi không còn được tô sáng hay chọn trên vùng vẽ trống."

[[note]]
version = "0.5.3"
locale = "id"
title = "Bekerja dengan agen lebih lancar"
item = "Saat agen menambahkan papan, kanvas berpindah ke sana agar Anda bisa melihat desainnya dibuat."
item = "Agen mempertahankan warna yang Anda minta dan memberi tahu jika teks sulit dibaca atau menumpuk teks lain."
item = "Gambar yang diambil agen dari file di komputer Anda kini tampil, dan bentuk vektor dari file lama tidak lagi hilang."
item = "Pada teks dengan jarak huruf, pasangan huruf seperti \"Ya\" tidak lagi saling bertumpuk."
item = "Konten yang disembunyikan bingkainya tidak lagi disorot atau dipilih di kanvas kosong."

[[note]]
version = "0.5.2"
locale = "en-US"
title = "Bring your slides in"
intro = "Open slide decks made elsewhere and keep working on them here."
item = "Open HTML slide decks, including ones made with Claude, and each slide becomes its own editable board."
item = "Open PowerPoint files the same way: text, shapes, images and speaker notes come with them."
item = "Animations come along too. They play when you present and stay when you export the deck again."
item = "After each update, this window shows what changed, in your language."

[[note]]
version = "0.5.2"
locale = "tr"
title = "Slaytlarınızı getirin"
intro = "Başka yerde hazırlanmış sunumları açın ve burada üzerinde çalışmaya devam edin."
item = "Claude ile hazırlananlar dahil HTML sunumlarını açın; her slayt ayrı, düzenlenebilir bir pano olur."
item = "PowerPoint dosyalarını da aynı şekilde açın: metinler, şekiller, görseller ve konuşmacı notları birlikte gelir."
item = "Animasyonlar da korunur. Sunum yaparken oynar, sunumu yeniden dışa aktardığınızda da kalır."
item = "Her güncellemeden sonra bu pencere nelerin değiştiğini kendi dilinizde gösterir."

[[note]]
version = "0.5.2"
locale = "zh-CN"
title = "导入你的幻灯片"
intro = "打开在其他地方制作的幻灯片,在这里继续编辑。"
item = "打开 HTML 幻灯片(包括用 Claude 制作的),每张幻灯片都会成为一个可编辑的画板。"
item = "PowerPoint 文件也能这样打开:文字、形状、图片和演讲者备注都会一并带入。"
item = "动画也会保留:演示时会播放,再次导出幻灯片时也不会丢失。"
item = "每次更新后,这个窗口会用你的语言告诉你有哪些变化。"

[[note]]
version = "0.5.2"
locale = "zh-TW"
title = "匯入你的投影片"
intro = "開啟在其他地方製作的投影片,在這裡繼續編輯。"
item = "開啟 HTML 投影片(包括用 Claude 製作的),每張投影片都會成為一個可編輯的畫板。"
item = "PowerPoint 檔案也能這樣開啟:文字、形狀、圖片和演講者備忘稿都會一併帶入。"
item = "動畫也會保留:簡報時會播放,再次匯出投影片時也不會遺失。"
item = "每次更新後,這個視窗會用你的語言告訴你有哪些變化。"

[[note]]
version = "0.5.2"
locale = "ja"
title = "スライドを取り込もう"
intro = "ほかのツールで作ったスライドを開いて、ここで編集を続けられます。"
item = "Claude で作ったものを含む HTML のスライドを開くと、各スライドが編集できるボードになります。"
item = "PowerPoint ファイルも同じように開けます。テキスト、図形、画像、発表者ノートもそのまま取り込まれます。"
item = "アニメーションも引き継がれます。プレゼン中に再生され、スライドを書き出し直しても残ります。"
item = "アップデートのたびに、このウィンドウで変更点をお使いの言語でお知らせします。"

[[note]]
version = "0.5.2"
locale = "ko"
title = "슬라이드를 가져오세요"
intro = "다른 곳에서 만든 슬라이드를 열고 여기서 계속 작업하세요."
item = "Claude로 만든 것을 포함해 HTML 슬라이드를 열면 각 슬라이드가 편집 가능한 보드가 됩니다."
item = "PowerPoint 파일도 같은 방식으로 열 수 있습니다. 텍스트, 도형, 이미지, 발표자 노트가 함께 들어옵니다."
item = "애니메이션도 그대로 유지됩니다. 발표할 때 재생되고, 슬라이드를 다시 내보내도 남아 있습니다."
item = "업데이트할 때마다 이 창에서 바뀐 점을 사용하는 언어로 보여 드립니다."

[[note]]
version = "0.5.2"
locale = "fr"
title = "Importez vos présentations"
intro = "Ouvrez des présentations créées ailleurs et continuez à les modifier ici."
item = "Ouvrez des présentations HTML, y compris celles créées avec Claude : chaque diapositive devient un plan de travail modifiable."
item = "Ouvrez aussi les fichiers PowerPoint : textes, formes, images et notes du présentateur sont repris."
item = "Les animations suivent aussi. Elles se jouent pendant la présentation et restent quand vous exportez à nouveau."
item = "Après chaque mise à jour, cette fenêtre présente les nouveautés dans votre langue."

[[note]]
version = "0.5.2"
locale = "es"
title = "Trae tus presentaciones"
intro = "Abre presentaciones creadas en otro lugar y sigue trabajando en ellas aquí."
item = "Abre presentaciones HTML, incluidas las creadas con Claude, y cada diapositiva se convierte en un tablero editable."
item = "Abre también archivos de PowerPoint: textos, formas, imágenes y notas del orador llegan con ellos."
item = "Las animaciones también se conservan. Se reproducen al presentar y se mantienen al volver a exportar."
item = "Después de cada actualización, esta ventana te muestra las novedades en tu idioma."

[[note]]
version = "0.5.2"
locale = "de"
title = "Bring deine Folien mit"
intro = "Öffne Präsentationen, die du woanders erstellt hast, und arbeite hier weiter."
item = "Öffne HTML-Präsentationen, auch solche aus Claude: Jede Folie wird zu einem eigenen, bearbeitbaren Board."
item = "PowerPoint-Dateien öffnest du genauso: Texte, Formen, Bilder und Sprechernotizen kommen mit."
item = "Auch Animationen bleiben erhalten. Sie laufen beim Präsentieren und bleiben beim erneuten Export."
item = "Nach jedem Update zeigt dir dieses Fenster, was neu ist, in deiner Sprache."

[[note]]
version = "0.5.2"
locale = "pt"
title = "Traga seus slides"
intro = "Abra apresentações criadas em outro lugar e continue trabalhando nelas aqui."
item = "Abra apresentações HTML, incluindo as feitas com o Claude, e cada slide vira um quadro editável."
item = "Abra arquivos do PowerPoint do mesmo jeito: textos, formas, imagens e anotações do apresentador vêm junto."
item = "As animações também vêm. Elas são reproduzidas na apresentação e continuam quando você exporta de novo."
item = "Depois de cada atualização, esta janela mostra as novidades no seu idioma."

[[note]]
version = "0.5.2"
locale = "ru"
title = "Переносите свои слайды"
intro = "Открывайте презентации, созданные в других местах, и продолжайте работу здесь."
item = "Открывайте HTML-презентации, в том числе созданные в Claude: каждый слайд становится отдельной редактируемой доской."
item = "Так же открываются файлы PowerPoint: текст, фигуры, изображения и заметки докладчика переносятся вместе с ними."
item = "Анимации тоже сохраняются. Они воспроизводятся во время показа и остаются при повторном экспорте."
item = "После каждого обновления это окно покажет, что изменилось, на вашем языке."

[[note]]
version = "0.5.2"
locale = "hi"
title = "अपनी स्लाइड्स लाएँ"
intro = "कहीं और बनी स्लाइड्स खोलें और यहाँ उन पर काम जारी रखें।"
item = "Claude से बनी प्रस्तुतियों समेत HTML प्रस्तुतियाँ खोलें, हर स्लाइड एक अलग संपादन योग्य बोर्ड बन जाती है।"
item = "PowerPoint फ़ाइलें भी इसी तरह खोलें: टेक्स्ट, आकृतियाँ, चित्र और वक्ता नोट्स साथ आते हैं।"
item = "एनिमेशन भी साथ आते हैं। प्रस्तुति के समय चलते हैं और प्रस्तुति दोबारा निर्यात करने पर भी बने रहते हैं।"
item = "हर अपडेट के बाद यह विंडो आपकी भाषा में बताती है कि क्या बदला है।"

[[note]]
version = "0.5.2"
locale = "th"
title = "นำสไลด์ของคุณเข้ามา"
intro = "เปิดสไลด์ที่สร้างจากที่อื่น แล้วทำงานต่อได้ที่นี่"
item = "เปิดสไลด์ HTML รวมถึงสไลด์ที่สร้างด้วย Claude แล้วแต่ละสไลด์จะกลายเป็นบอร์ดที่แก้ไขได้"
item = "เปิดไฟล์ PowerPoint ได้แบบเดียวกัน ทั้งข้อความ รูปร่าง รูปภาพ และบันทึกของผู้นำเสนอจะติดมาด้วย"
item = "ภาพเคลื่อนไหวก็ติดมาด้วย โดยจะเล่นขณะนำเสนอ และยังคงอยู่เมื่อส่งออกสไลด์อีกครั้ง"
item = "หลังการอัปเดตแต่ละครั้ง หน้าต่างนี้จะแสดงสิ่งที่เปลี่ยนไปเป็นภาษาของคุณ"

[[note]]
version = "0.5.2"
locale = "vi"
title = "Mang slide của bạn vào"
intro = "Mở các bản trình bày tạo ở nơi khác và tiếp tục làm việc ngay tại đây."
item = "Mở bản trình bày HTML, kể cả những bản tạo bằng Claude, mỗi slide trở thành một bảng vẽ có thể chỉnh sửa."
item = "Mở tệp PowerPoint theo cách tương tự: văn bản, hình khối, hình ảnh và ghi chú của người trình bày đều đi kèm."
item = "Hiệu ứng chuyển động cũng được giữ lại. Chúng phát khi trình chiếu và vẫn còn khi bạn xuất lại bản trình bày."
item = "Sau mỗi lần cập nhật, cửa sổ này cho bạn biết những gì đã thay đổi bằng ngôn ngữ của bạn."

[[note]]
version = "0.5.2"
locale = "id"
title = "Bawa slide Anda"
intro = "Buka presentasi yang dibuat di tempat lain dan lanjutkan pekerjaan di sini."
item = "Buka presentasi HTML, termasuk yang dibuat dengan Claude, dan setiap slide menjadi papan yang bisa diedit."
item = "Buka file PowerPoint dengan cara yang sama: teks, bentuk, gambar, dan catatan pembicara ikut terbawa."
item = "Animasi juga ikut. Animasi diputar saat presentasi dan tetap ada saat Anda mengekspor presentasi lagi."
item = "Setelah setiap pembaruan, jendela ini menunjukkan apa yang berubah dalam bahasa Anda."
