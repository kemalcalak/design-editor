# In-app release notes, shown once on the first launch after an update.
#
# One [[note]] block per (version, locale); keep the newest release at the
# top for readers (the window sorts by version itself). Every release needs
# all 15 UI locales (see `de_i18n::Locale::ALL`), each with an `intro`
# exactly when en-US has one and the same number of `item` lines; a test
# enforces this. A missing locale falls back to en-US at runtime.
#
# Fields: `version`, `locale` (BCP-47 code), `title`, optional `intro`
# (one short paragraph) and one `item = "..."` line per bullet, in order.
# Write for users: short, plain, no issue numbers or technical terms.

[[note]]
version = "0.6.3"
locale = "en-US"
title = "Variants, prototyping and faster editing"
item = "Components can now have variants and properties: one component covers every state and size, and each copy can switch its text, visibility or variant from the panel."
item = "Repeated copies of the same design can be turned into linked components in one step, so later changes reach all of them."
item = "Rename layers in one go, with AI or with simple rules. New names follow the language your document is written in."
item = "Auto layout can wrap items onto new rows or arrange them in a grid. In vector edit mode you can move single points, and combining shapes now keeps their curves."
item = "First steps in prototyping: link frames with interactions, see the flow on the canvas and open screens as overlays."
item = "Faster editing: a command palette (Cmd/Ctrl+K), find and replace across layers (Cmd/Ctrl+F), a scale tool (K), a pixel grid when you zoom in close, distances shown while you hold Alt, and copy as PNG or SVG."
item = "Design Editor is now a desktop app only; the browser version has been removed. Also fixed: copying layers no longer pastes old clipboard content, menus fit their labels, and agents can use every option of their tools."

[[note]]
version = "0.6.3"
locale = "tr"
title = "Varyantlar, prototipleme ve daha hızlı düzenleme"
item = "Bileşenlerin artık varyantları ve özellikleri olabiliyor: tek bir bileşen her durumu ve boyutu kapsıyor, her kopya da metnini, görünürlüğünü ya da varyantını panelden değiştirebiliyor."
item = "Aynı tasarımın tekrarlanan kopyaları tek adımda bağlantılı bileşenlere dönüştürülebiliyor; sonraki değişiklikler hepsine ulaşıyor."
item = "Katmanları yapay zekâyla ya da basit kurallarla tek seferde yeniden adlandırın. Yeni adlar belgenizin yazıldığı dili izliyor."
item = "Otomatik yerleşim öğeleri alt satıra geçirebiliyor ya da ızgarada dizebiliyor. Vektör düzenleme modunda tek tek noktaları taşıyabiliyorsunuz; şekilleri birleştirmek artık eğrileri koruyor."
item = "Prototiplemede ilk adımlar: çerçeveleri etkileşimlerle bağlayın, akışı tuvalde görün ve ekranları katman olarak açın."
item = "Daha hızlı düzenleme: komut paleti (Cmd/Ctrl+K), katmanlarda bul ve değiştir (Cmd/Ctrl+F), Ölçekle aracı (K), çok yakınlaştırınca piksel ızgarası, Alt basılıyken gösterilen mesafeler ve PNG ya da SVG olarak kopyalama."
item = "Design Editor artık yalnızca bir masaüstü uygulaması; tarayıcı sürümü kaldırıldı. Ayrıca düzeltildi: katman kopyalamak artık eski pano içeriğini yapıştırmıyor, menüler etiketlerine sığıyor ve ajanlar araçlarının tüm seçeneklerini kullanabiliyor."

[[note]]
version = "0.6.3"
locale = "zh-CN"
title = "变体、原型与更快的编辑"
item = "组件现在可以拥有变体和属性:一个组件即可涵盖所有状态和尺寸,每个副本都能在面板中切换文本、可见性或变体。"
item = "同一设计的重复副本可以一步转换为关联组件,之后的修改会同步到所有副本。"
item = "使用 AI 或简单规则一次性重命名图层。新名称会沿用文档所用的语言。"
item = "自动布局可以将元素换行排列或排成网格。在矢量编辑模式中可以单独移动锚点,合并形状时也会保留曲线。"
item = "原型设计的第一步:用交互连接画框,在画布上查看流程,并以浮层方式打开页面。"
item = "更快的编辑:命令面板(Cmd/Ctrl+K)、跨图层查找和替换(Cmd/Ctrl+F)、缩放工具(K)、放大到足够倍数时显示的像素网格、按住 Alt 时显示的间距,以及复制为 PNG 或 SVG。"
item = "Design Editor 现在仅提供桌面应用,浏览器版本已移除。另有修复:复制图层后不再粘贴旧的剪贴板内容,菜单能容纳完整标签,智能体可以使用工具的全部选项。"

[[note]]
version = "0.6.3"
locale = "zh-TW"
title = "變體、原型與更快的編輯"
item = "元件現在可以擁有變體與屬性:一個元件即可涵蓋所有狀態與尺寸,每個副本都能在面板中切換文字、可見性或變體。"
item = "同一設計的重複副本可以一步轉換為連結元件,之後的修改會同步到所有副本。"
item = "使用 AI 或簡單規則一次重新命名圖層。新名稱會沿用文件所使用的語言。"
item = "自動佈局可以將項目換行排列或排成格線。在向量編輯模式中可以單獨移動錨點,合併形狀時也會保留曲線。"
item = "原型設計的第一步:用互動連接畫框,在畫布上查看流程,並以浮層方式開啟畫面。"
item = "更快的編輯:命令面板(Cmd/Ctrl+K)、跨圖層尋找與取代(Cmd/Ctrl+F)、縮放工具(K)、放大到足夠倍率時顯示的像素格線、按住 Alt 時顯示的間距,以及複製為 PNG 或 SVG。"
item = "Design Editor 現在只提供桌面應用程式,瀏覽器版本已移除。另有修正:複製圖層後不再貼上舊的剪貼簿內容,選單能容納完整標籤,代理可以使用工具的所有選項。"

[[note]]
version = "0.6.3"
locale = "ja"
title = "バリアント、プロトタイプ、そしてより速い編集"
item = "コンポーネントにバリアントとプロパティを持たせられるようになりました。1つのコンポーネントであらゆる状態とサイズをまかない、各コピーはパネルからテキスト、表示、バリアントを切り替えられます。"
item = "同じデザインの繰り返しコピーを、ひと手間でリンクされたコンポーネントに変換できます。以後の変更はすべてのコピーに反映されます。"
item = "AI または簡単なルールで、レイヤー名をまとめて変更できます。新しい名前はドキュメントの言語に合わせて付けられます。"
item = "オートレイアウトで要素を折り返したり、グリッドに並べたりできます。ベクター編集モードではポイントを1つずつ動かせ、シェイプを結合しても曲線が保たれます。"
item = "プロトタイプの第一歩:インタラクションでフレームをつなぎ、キャンバス上でフローを確認し、画面をオーバーレイとして開けます。"
item = "より速い編集:コマンドパレット(Cmd/Ctrl+K)、レイヤー全体の検索と置換(Cmd/Ctrl+F)、拡大縮小ツール(K)、大きくズームしたときのピクセルグリッド、Alt を押している間の距離表示、PNG や SVG としてのコピー。"
item = "Design Editor はデスクトップアプリのみになり、ブラウザー版は削除されました。そのほかの修正:レイヤーをコピーしても古いクリップボードの内容が貼り付けられなくなり、メニューがラベルに合った幅になり、エージェントがツールのすべてのオプションを使えるようになりました。"

[[note]]
version = "0.6.3"
locale = "ko"
title = "변형, 프로토타이핑, 더 빠른 편집"
item = "이제 컴포넌트에 변형과 속성을 둘 수 있습니다. 하나의 컴포넌트로 모든 상태와 크기를 다루고, 각 사본은 패널에서 텍스트, 표시 여부, 변형을 바꿀 수 있습니다."
item = "같은 디자인의 반복된 사본을 한 번에 연결된 컴포넌트로 바꿀 수 있어, 이후 변경이 모든 사본에 반영됩니다."
item = "AI나 간단한 규칙으로 레이어 이름을 한꺼번에 바꿀 수 있습니다. 새 이름은 문서에 쓰인 언어를 따릅니다."
item = "자동 레이아웃에서 항목을 다음 줄로 넘기거나 그리드로 배치할 수 있습니다. 벡터 편집 모드에서는 점을 하나씩 옮길 수 있고, 도형을 합쳐도 곡선이 유지됩니다."
item = "프로토타이핑의 첫걸음: 인터랙션으로 프레임을 연결하고, 캔버스에서 흐름을 확인하고, 화면을 오버레이로 열 수 있습니다."
item = "더 빠른 편집: 명령 팔레트(Cmd/Ctrl+K), 레이어 전체 찾기 및 바꾸기(Cmd/Ctrl+F), 크기 조정 도구(K), 크게 확대했을 때의 픽셀 그리드, Alt를 누르고 있을 때 보이는 간격, PNG 또는 SVG로 복사."
item = "Design Editor는 이제 데스크톱 앱으로만 제공되며 브라우저 버전은 제거되었습니다. 그 밖의 수정: 레이어를 복사해도 더 이상 이전 클립보드 내용이 붙여 넣어지지 않고, 메뉴가 레이블에 맞는 크기로 표시되며, 에이전트가 도구의 모든 옵션을 사용할 수 있습니다."

[[note]]
version = "0.6.3"
locale = "fr"
title = "Variantes, prototypage et édition plus rapide"
item = "Les composants peuvent maintenant avoir des variantes et des propriétés : un seul composant couvre tous les états et toutes les tailles, et chaque copie peut changer son texte, sa visibilité ou sa variante depuis le panneau."
item = "Les copies répétées d'un même design se transforment en composants liés en une seule étape : les modifications suivantes s'appliquent à toutes."
item = "Renommez vos calques d'un coup, avec l'IA ou avec des règles simples. Les nouveaux noms suivent la langue de votre document."
item = "La mise en page auto peut renvoyer les éléments à la ligne ou les disposer en grille. Le mode d'édition vectorielle permet de déplacer chaque point, et combiner des formes conserve désormais leurs courbes."
item = "Premiers pas en prototypage : reliez des cadres par des interactions, visualisez le parcours sur le canevas et ouvrez des écrans en superposition."
item = "Édition plus rapide : une palette de commandes (Cmd/Ctrl+K), rechercher et remplacer dans les calques (Cmd/Ctrl+F), l'outil Échelle (K), une grille de pixels en zoom rapproché, les distances affichées en maintenant Alt, et la copie en PNG ou SVG."
item = "Design Editor est désormais uniquement une application de bureau ; la version navigateur a été retirée. Également corrigé : copier des calques ne colle plus l'ancien contenu du presse-papiers, les menus s'adaptent à leurs libellés et les agents peuvent utiliser toutes les options de leurs outils."

[[note]]
version = "0.6.3"
locale = "es"
title = "Variantes, prototipos y edición más rápida"
item = "Los componentes ahora pueden tener variantes y propiedades: un solo componente cubre todos los estados y tamaños, y cada copia puede cambiar su texto, su visibilidad o su variante desde el panel."
item = "Las copias repetidas de un mismo diseño se convierten en componentes vinculados en un solo paso, así los cambios posteriores llegan a todas."
item = "Renombra capas de una vez, con IA o con reglas sencillas. Los nombres nuevos siguen el idioma en que está escrito tu documento."
item = "El diseño automático puede pasar elementos a nuevas filas u ordenarlos en una cuadrícula. En el modo de edición vectorial puedes mover puntos sueltos, y al combinar formas ahora se conservan sus curvas."
item = "Primeros pasos en prototipos: enlaza marcos con interacciones, mira el flujo en el lienzo y abre pantallas como superposición."
item = "Edición más rápida: paleta de comandos (Cmd/Ctrl+K), buscar y reemplazar en las capas (Cmd/Ctrl+F), herramienta Escalar (K), cuadrícula de píxeles al acercar mucho el zoom, distancias visibles mientras mantienes Alt y copiar como PNG o SVG."
item = "Design Editor ahora es solo una aplicación de escritorio; la versión para navegador se ha retirado. También corregido: copiar capas ya no pega contenido antiguo del portapapeles, los menús se ajustan a sus etiquetas y los agentes pueden usar todas las opciones de sus herramientas."

[[note]]
version = "0.6.3"
locale = "de"
title = "Varianten, Prototyping und schnelleres Bearbeiten"
item = "Komponenten können jetzt Varianten und Eigenschaften haben: Eine Komponente deckt alle Zustände und Größen ab, und jede Kopie kann Text, Sichtbarkeit oder Variante im Panel umschalten."
item = "Wiederholte Kopien desselben Designs lassen sich in einem Schritt in verknüpfte Komponenten umwandeln, sodass spätere Änderungen alle erreichen."
item = "Benenne Ebenen in einem Durchgang um, mit KI oder mit einfachen Regeln. Neue Namen folgen der Sprache deines Dokuments."
item = "Auto-Layout kann Elemente in neue Zeilen umbrechen oder in einem Raster anordnen. Im Vektor-Bearbeitungsmodus verschiebst du einzelne Punkte, und beim Kombinieren von Formen bleiben ihre Kurven jetzt erhalten."
item = "Erste Schritte im Prototyping: Verbinde Rahmen mit Interaktionen, sieh den Ablauf auf der Leinwand und öffne Screens als Overlay."
item = "Schnelleres Bearbeiten: eine Befehlspalette (Cmd/Strg+K), Suchen und Ersetzen über alle Ebenen (Cmd/Strg+F), das Werkzeug Skalieren (K), ein Pixelraster bei starkem Zoom, Abstände beim Halten von Alt und Kopieren als PNG oder SVG."
item = "Design Editor gibt es jetzt nur noch als Desktop-App; die Browser-Version wurde entfernt. Außerdem behoben: Beim Kopieren von Ebenen wird kein alter Zwischenablage-Inhalt mehr eingefügt, Menüs passen zu ihren Beschriftungen und Agenten können alle Optionen ihrer Werkzeuge nutzen."

[[note]]
version = "0.6.3"
locale = "pt"
title = "Variantes, prototipagem e edição mais rápida"
item = "Os componentes agora podem ter variantes e propriedades: um único componente cobre todos os estados e tamanhos, e cada cópia pode trocar o texto, a visibilidade ou a variante pelo painel."
item = "Cópias repetidas do mesmo design podem virar componentes vinculados em uma única etapa, então as próximas alterações chegam a todas."
item = "Renomeie camadas de uma vez, com IA ou com regras simples. Os novos nomes seguem o idioma em que o documento está escrito."
item = "O layout automático pode quebrar itens em novas linhas ou organizá-los em grade. No modo de edição vetorial você move pontos individuais, e combinar formas agora preserva as curvas."
item = "Primeiros passos em prototipagem: ligue quadros com interações, veja o fluxo no canvas e abra telas como sobreposição."
item = "Edição mais rápida: paleta de comandos (Cmd/Ctrl+K), localizar e substituir nas camadas (Cmd/Ctrl+F), ferramenta Escalar (K), grade de pixels com zoom bem próximo, distâncias exibidas enquanto você segura Alt e copiar como PNG ou SVG."
item = "O Design Editor agora é apenas um aplicativo para desktop; a versão para navegador foi removida. Também corrigido: copiar camadas não cola mais conteúdo antigo da área de transferência, os menus se ajustam aos rótulos e os agentes podem usar todas as opções das ferramentas."

[[note]]
version = "0.6.3"
locale = "ru"
title = "Варианты, прототипирование и быстрая работа"
item = "У компонентов теперь есть варианты и свойства: один компонент охватывает все состояния и размеры, а каждая копия может менять текст, видимость или вариант прямо на панели."
item = "Повторяющиеся копии одного дизайна можно за один шаг превратить в связанные компоненты, чтобы дальнейшие правки доходили до всех."
item = "Переименовывайте слои разом, с помощью ИИ или простых правил. Новые имена следуют языку вашего документа."
item = "Автолейаут умеет переносить элементы на новые строки или выстраивать их в сетку. В режиме редактирования векторов можно двигать отдельные точки, а объединение фигур теперь сохраняет кривые."
item = "Первые шаги в прототипировании: связывайте фреймы взаимодействиями, смотрите поток на холсте и открывайте экраны как оверлеи."
item = "Быстрее работа: палитра команд (Cmd/Ctrl+K), поиск и замена по слоям (Cmd/Ctrl+F), инструмент «Масштаб» (K), пиксельная сетка при сильном увеличении, расстояния при зажатом Alt и копирование в PNG или SVG."
item = "Design Editor теперь только настольное приложение; браузерная версия удалена. Также исправлено: копирование слоёв больше не вставляет старое содержимое буфера обмена, меню подстраиваются под подписи, а агенты могут использовать все параметры своих инструментов."

[[note]]
version = "0.6.3"
locale = "hi"
title = "वेरिएंट, प्रोटोटाइपिंग और तेज़ एडिटिंग"
item = "कंपोनेंट में अब वेरिएंट और प्रॉपर्टी हो सकती हैं: एक कंपोनेंट हर स्थिति और आकार को संभालता है, और हर कॉपी पैनल से अपना टेक्स्ट, दिखना या वेरिएंट बदल सकती है।"
item = "एक ही डिज़ाइन की दोहराई गई कॉपियों को एक कदम में जुड़े हुए कंपोनेंट में बदला जा सकता है, ताकि आगे के बदलाव सभी तक पहुँचें।"
item = "AI या आसान नियमों से एक बार में लेयर के नाम बदलें। नए नाम उसी भाषा में होते हैं जिसमें आपका दस्तावेज़ लिखा है।"
item = "ऑटो लेआउट आइटम को नई पंक्तियों में ले जा सकता है या ग्रिड में सजा सकता है। वेक्टर एडिट मोड में आप एक-एक पॉइंट हिला सकते हैं, और आकार जोड़ने पर अब उनके कर्व बने रहते हैं।"
item = "प्रोटोटाइपिंग के पहले कदम: इंटरैक्शन से फ़्रेम जोड़ें, कैनवस पर फ़्लो देखें और स्क्रीन को ओवरले के रूप में खोलें।"
item = "तेज़ एडिटिंग: कमांड पैलेट (Cmd/Ctrl+K), लेयर में खोजें और बदलें (Cmd/Ctrl+F), स्केल टूल (K), ज़्यादा ज़ूम करने पर पिक्सेल ग्रिड, Alt दबाए रखने पर दिखने वाली दूरियाँ, और PNG या SVG के रूप में कॉपी।"
item = "Design Editor अब सिर्फ़ डेस्कटॉप ऐप है; ब्राउज़र वर्शन हटा दिया गया है। साथ ही ठीक किया गया: लेयर कॉपी करने पर अब पुरानी क्लिपबोर्ड सामग्री पेस्ट नहीं होती, मेन्यू अपने लेबल के हिसाब से बनते हैं, और एजेंट अपने टूल के सभी विकल्प इस्तेमाल कर सकते हैं।"

[[note]]
version = "0.6.3"
locale = "th"
title = "รูปแบบ โปรโตไทป์ และการแก้ไขที่เร็วขึ้น"
item = "คอมโพเนนต์มีรูปแบบและคุณสมบัติได้แล้ว คอมโพเนนต์เดียวครอบคลุมทุกสถานะและทุกขนาด และแต่ละสำเนาเปลี่ยนข้อความ การแสดงผล หรือรูปแบบได้จากแผง"
item = "สำเนาที่ซ้ำกันของดีไซน์เดียวกันแปลงเป็นคอมโพเนนต์ที่เชื่อมกันได้ในขั้นตอนเดียว การแก้ไขครั้งต่อไปจึงไปถึงทุกสำเนา"
item = "เปลี่ยนชื่อเลเยอร์ทีเดียวทั้งหมดด้วย AI หรือกฎง่าย ๆ ชื่อใหม่จะใช้ภาษาเดียวกับเอกสารของคุณ"
item = "เลย์เอาต์อัตโนมัติขึ้นบรรทัดใหม่หรือจัดรายการเป็นตารางกริดได้ ในโหมดแก้ไขเวกเตอร์ย้ายจุดทีละจุดได้ และการรวมรูปทรงจะคงเส้นโค้งไว้แล้ว"
item = "ก้าวแรกของการทำโปรโตไทป์: เชื่อมเฟรมด้วยการโต้ตอบ ดูโฟลว์บนแคนวาส และเปิดหน้าจอเป็นโอเวอร์เลย์"
item = "แก้ไขได้เร็วขึ้น: จานคำสั่ง (Cmd/Ctrl+K) ค้นหาและแทนที่ในเลเยอร์ (Cmd/Ctrl+F) เครื่องมือปรับขนาด (K) ตารางพิกเซลเมื่อซูมเข้าใกล้ ระยะห่างที่แสดงขณะกด Alt ค้างไว้ และคัดลอกเป็น PNG หรือ SVG"
item = "Design Editor เป็นแอปเดสก์ท็อปเท่านั้นแล้ว และเวอร์ชันเบราว์เซอร์ถูกนำออก แก้ไขเพิ่มเติม: การคัดลอกเลเยอร์ไม่วางเนื้อหาคลิปบอร์ดเก่าอีกต่อไป เมนูมีขนาดพอดีกับป้ายกำกับ และเอเจนต์ใช้ตัวเลือกทั้งหมดของเครื่องมือได้"

[[note]]
version = "0.6.3"
locale = "vi"
title = "Biến thể, tạo nguyên mẫu và chỉnh sửa nhanh hơn"
item = "Thành phần giờ có thể có biến thể và thuộc tính: một thành phần bao quát mọi trạng thái và kích thước, mỗi bản sao có thể đổi chữ, trạng thái hiển thị hoặc biến thể ngay trong bảng điều khiển."
item = "Các bản sao lặp lại của cùng một thiết kế có thể chuyển thành thành phần liên kết chỉ trong một bước, để những thay đổi sau áp dụng cho tất cả."
item = "Đổi tên lớp hàng loạt bằng AI hoặc bằng quy tắc đơn giản. Tên mới theo ngôn ngữ của tài liệu."
item = "Bố cục tự động có thể xuống dòng các phần tử hoặc xếp chúng thành lưới. Trong chế độ chỉnh sửa vector, bạn có thể di chuyển từng điểm, và việc kết hợp hình giờ giữ nguyên các đường cong."
item = "Những bước đầu của tạo nguyên mẫu: nối các khung bằng tương tác, xem luồng trên canvas và mở màn hình dưới dạng lớp phủ."
item = "Chỉnh sửa nhanh hơn: bảng lệnh (Cmd/Ctrl+K), tìm và thay thế trong các lớp (Cmd/Ctrl+F), công cụ Thu phóng (K), lưới điểm ảnh khi phóng to sát, khoảng cách hiện ra khi giữ Alt, và sao chép dưới dạng PNG hoặc SVG."
item = "Design Editor giờ chỉ còn là ứng dụng máy tính; phiên bản trình duyệt đã bị gỡ bỏ. Cũng đã sửa: sao chép lớp không còn dán nội dung cũ trong bộ nhớ tạm, menu vừa với nhãn của chúng, và tác nhân có thể dùng mọi tùy chọn của công cụ."

[[note]]
version = "0.6.3"
locale = "id"
title = "Varian, prototipe, dan pengeditan lebih cepat"
item = "Komponen kini bisa punya varian dan properti: satu komponen mencakup semua status dan ukuran, dan setiap salinan bisa mengganti teks, visibilitas, atau variannya dari panel."
item = "Salinan berulang dari desain yang sama bisa diubah menjadi komponen tertaut dalam satu langkah, jadi perubahan berikutnya sampai ke semuanya."
item = "Ganti nama layer sekaligus, dengan AI atau aturan sederhana. Nama baru mengikuti bahasa dokumen Anda."
item = "Tata letak otomatis bisa memindahkan item ke baris baru atau menyusunnya dalam grid. Di mode edit vektor Anda bisa memindahkan titik satu per satu, dan menggabungkan bentuk kini mempertahankan lengkungannya."
item = "Langkah pertama prototipe: hubungkan frame dengan interaksi, lihat alurnya di kanvas, dan buka layar sebagai overlay."
item = "Pengeditan lebih cepat: palet perintah (Cmd/Ctrl+K), cari dan ganti di seluruh layer (Cmd/Ctrl+F), alat skala (K), kisi piksel saat diperbesar dekat, jarak yang tampil saat menahan Alt, dan salin sebagai PNG atau SVG."
item = "Design Editor kini hanya berupa aplikasi desktop; versi browser telah dihapus. Juga diperbaiki: menyalin layer tidak lagi menempelkan isi clipboard lama, menu menyesuaikan labelnya, dan agen bisa memakai semua opsi alatnya."

[[note]]
version = "0.6.2"
locale = "en-US"
title = "Steadier agents and linked components"
item = "Agents load their tools right away, even while a large document is opening or another agent is busy. If the editor is still loading, they are told so instead of waiting."
item = "Components placed by agents stay linked to their main component, so one change updates every copy. Agents can also detach or swap them."
item = "Agents can add content inside components without creating duplicate layers. Files that already have duplicates show a warning with a one-click repair."
item = "When an agent saves your document, the editor now shows the file name and that it is saved."
item = "Frames can be exported as layered SVG, with text and groups kept, to bring them into other design tools."
item = "Smaller fixes for agents, including cleaner file paths on Windows."

[[note]]
version = "0.6.2"
locale = "tr"
title = "Daha kararlı ajanlar ve bağlantılı bileşenler"
item = "Ajanlar araçlarını hemen yüklüyor; büyük bir belge açılırken ya da başka bir ajan çalışırken bile. Editör hâlâ yükleniyorsa beklemek yerine bunu öğreniyorlar."
item = "Ajanların yerleştirdiği bileşenler ana bileşene bağlı kalıyor; tek bir değişiklik bütün kopyaları güncelliyor. Ajanlar bağlantıyı koparabilir ya da bileşeni değiştirebilir."
item = "Ajanlar bileşenlerin içine içerik eklerken artık yinelenen katman oluşturmuyor. Zaten yinelenen katman içeren dosyalar tek tıkla onarım sunan bir uyarı gösteriyor."
item = "Bir ajan belgenizi kaydettiğinde editör artık dosya adını ve kaydedildiğini gösteriyor."
item = "Çerçeveler metinleri ve grupları korunarak katmanlı SVG olarak dışa aktarılabiliyor; böylece başka tasarım araçlarına taşınabiliyor."
item = "Ajanlar için küçük düzeltmeler; Windows'ta daha temiz dosya yolları dahil."

[[note]]
version = "0.6.2"
locale = "zh-CN"
title = "更稳定的智能体与关联组件"
item = "即使大型文档正在打开或其他智能体正忙,智能体也能立即加载工具。如果编辑器仍在加载,它们会收到提示而不是一直等待。"
item = "智能体放置的组件会与主组件保持关联,一次修改即可更新所有副本。智能体也可以分离或替换它们。"
item = "智能体在组件内部添加内容时不再产生重复图层。已有重复图层的文件会显示警告,并提供一键修复。"
item = "智能体保存文档后,编辑器现在会显示文件名和已保存状态。"
item = "画框可导出为分层 SVG,保留文本和分组,便于导入其他设计工具。"
item = "针对智能体的小修复,包括 Windows 上更干净的文件路径。"

[[note]]
version = "0.6.2"
locale = "zh-TW"
title = "更穩定的智慧代理與連結元件"
item = "即使大型文件正在開啟或其他代理正忙,代理也能立即載入工具。若編輯器仍在載入,它們會收到提示而不是一直等待。"
item = "代理放置的元件會與主元件保持連結,一次修改即可更新所有副本。代理也可以分離或替換它們。"
item = "代理在元件內部新增內容時不再產生重複圖層。已有重複圖層的檔案會顯示警告,並提供一鍵修復。"
item = "代理儲存文件後,編輯器現在會顯示檔名與已儲存狀態。"
item = "畫框可匯出為分層 SVG,保留文字與群組,方便匯入其他設計工具。"
item = "針對代理的小修正,包括 Windows 上更乾淨的檔案路徑。"

[[note]]
version = "0.6.2"
locale = "ja"
title = "より安定したエージェントとリンクされたコンポーネント"
item = "大きなドキュメントを開いている間や別のエージェントが作業中でも、エージェントはすぐにツールを読み込めます。エディターが読み込み中なら、待たずにそのことが伝えられます。"
item = "エージェントが配置したコンポーネントはメインコンポーネントとリンクしたままになり、一度の変更ですべてのコピーが更新されます。エージェントはリンク解除や入れ替えもできます。"
item = "エージェントがコンポーネントの中に内容を追加しても、重複したレイヤーが作られなくなりました。すでに重複があるファイルでは、ワンクリックで修復できる警告が表示されます。"
item = "エージェントがドキュメントを保存すると、エディターにファイル名と保存済みの状態が表示されるようになりました。"
item = "フレームをテキストとグループを保ったままレイヤー付き SVG として書き出せるようになり、他のデザインツールに持ち込めます。"
item = "エージェント向けの細かな修正。Windows でのファイルパスもすっきりしました。"

[[note]]
version = "0.6.2"
locale = "ko"
title = "더 안정적인 에이전트와 연결된 컴포넌트"
item = "큰 문서를 여는 중이거나 다른 에이전트가 작업 중이어도 에이전트가 도구를 바로 불러옵니다. 편집기가 아직 로드 중이면 기다리는 대신 그 사실을 알려 줍니다."
item = "에이전트가 배치한 컴포넌트는 메인 컴포넌트와 연결된 상태로 남아, 한 번의 변경으로 모든 사본이 업데이트됩니다. 에이전트는 연결을 해제하거나 교체할 수도 있습니다."
item = "에이전트가 컴포넌트 안에 내용을 추가해도 더 이상 중복 레이어가 생기지 않습니다. 이미 중복이 있는 파일은 한 번의 클릭으로 고칠 수 있는 경고를 보여 줍니다."
item = "에이전트가 문서를 저장하면 이제 편집기에 파일 이름과 저장됨 상태가 표시됩니다."
item = "프레임을 텍스트와 그룹을 유지한 레이어 SVG로 내보내 다른 디자인 도구로 가져갈 수 있습니다."
item = "에이전트를 위한 작은 수정, Windows의 더 깔끔한 파일 경로 포함."

[[note]]
version = "0.6.2"
locale = "fr"
title = "Des agents plus stables et des composants liés"
item = "Les agents chargent leurs outils tout de suite, même pendant l'ouverture d'un gros document ou quand un autre agent travaille. Si l'éditeur charge encore, ils en sont informés au lieu d'attendre."
item = "Les composants placés par les agents restent liés à leur composant principal : une seule modification met à jour toutes les copies. Les agents peuvent aussi les détacher ou les remplacer."
item = "Les agents peuvent ajouter du contenu dans les composants sans créer de calques en double. Les fichiers qui en contiennent déjà affichent un avertissement avec une réparation en un clic."
item = "Quand un agent enregistre votre document, l'éditeur affiche maintenant le nom du fichier et qu'il est enregistré."
item = "Les cadres s'exportent en SVG à calques, texte et groupes conservés, pour les reprendre dans d'autres outils de design."
item = "Petites corrections pour les agents, dont des chemins de fichiers plus propres sous Windows."

[[note]]
version = "0.6.2"
locale = "es"
title = "Agentes más estables y componentes vinculados"
item = "Los agentes cargan sus herramientas al instante, incluso mientras se abre un documento grande o mientras otro agente trabaja. Si el editor aún está cargando, se les avisa en lugar de esperar."
item = "Los componentes que colocan los agentes siguen vinculados a su componente principal: un solo cambio actualiza todas las copias. Los agentes también pueden desvincularlos o cambiarlos."
item = "Los agentes pueden añadir contenido dentro de los componentes sin crear capas duplicadas. Los archivos que ya las tienen muestran un aviso con reparación en un clic."
item = "Cuando un agente guarda tu documento, el editor ahora muestra el nombre del archivo y que está guardado."
item = "Los marcos se pueden exportar como SVG por capas, conservando textos y grupos, para llevarlos a otras herramientas de diseño."
item = "Pequeñas correcciones para agentes, incluidas rutas de archivo más limpias en Windows."

[[note]]
version = "0.6.2"
locale = "de"
title = "Stabilere Agenten und verknüpfte Komponenten"
item = "Agenten laden ihre Werkzeuge sofort, auch während ein großes Dokument geöffnet wird oder ein anderer Agent arbeitet. Lädt der Editor noch, erfahren sie das, statt zu warten."
item = "Von Agenten platzierte Komponenten bleiben mit ihrer Hauptkomponente verknüpft, sodass eine Änderung alle Kopien aktualisiert. Agenten können sie auch lösen oder austauschen."
item = "Agenten können Inhalte in Komponenten einfügen, ohne doppelte Ebenen zu erzeugen. Dateien, die bereits Duplikate enthalten, zeigen eine Warnung mit Reparatur per Klick."
item = "Speichert ein Agent dein Dokument, zeigt der Editor jetzt den Dateinamen und den gespeicherten Zustand an."
item = "Rahmen lassen sich als SVG mit Ebenen exportieren, mit erhaltenem Text und Gruppen, um sie in andere Design-Tools zu übernehmen."
item = "Kleinere Korrekturen für Agenten, darunter sauberere Dateipfade unter Windows."

[[note]]
version = "0.6.2"
locale = "pt"
title = "Agentes mais estáveis e componentes vinculados"
item = "Os agentes carregam as ferramentas na hora, mesmo enquanto um documento grande abre ou outro agente está trabalhando. Se o editor ainda estiver carregando, eles são avisados em vez de esperar."
item = "Os componentes colocados por agentes continuam vinculados ao componente principal, então uma única alteração atualiza todas as cópias. Os agentes também podem desvinculá-los ou trocá-los."
item = "Os agentes podem adicionar conteúdo dentro de componentes sem criar camadas duplicadas. Arquivos que já têm duplicatas mostram um aviso com reparo em um clique."
item = "Quando um agente salva seu documento, o editor agora mostra o nome do arquivo e que ele está salvo."
item = "Os quadros podem ser exportados como SVG em camadas, mantendo textos e grupos, para levá-los a outras ferramentas de design."
item = "Pequenas correções para agentes, incluindo caminhos de arquivo mais limpos no Windows."

[[note]]
version = "0.6.2"
locale = "ru"
title = "Стабильнее агенты и связанные компоненты"
item = "Агенты сразу загружают инструменты, даже пока открывается большой документ или работает другой агент. Если редактор ещё загружается, они узнают об этом, а не ждут."
item = "Компоненты, размещённые агентами, остаются связанными с главным компонентом: одно изменение обновляет все копии. Агенты также могут отвязывать и заменять их."
item = "Агенты могут добавлять содержимое внутрь компонентов, не создавая повторяющихся слоёв. Файлы, где они уже есть, показывают предупреждение с исправлением в один клик."
item = "Когда агент сохраняет документ, редактор теперь показывает имя файла и то, что он сохранён."
item = "Фреймы можно экспортировать в SVG со слоями, сохраняя текст и группы, чтобы перенести их в другие инструменты дизайна."
item = "Небольшие исправления для агентов, включая более чистые пути к файлам в Windows."

[[note]]
version = "0.6.2"
locale = "hi"
title = "ज़्यादा स्थिर एजेंट और जुड़े हुए कॉम्पोनेंट"
item = "एजेंट अपने टूल तुरंत लोड कर लेते हैं, तब भी जब कोई बड़ा दस्तावेज़ खुल रहा हो या दूसरा एजेंट काम कर रहा हो। अगर एडिटर अभी लोड हो रहा है, तो इंतज़ार करने के बजाय उन्हें बता दिया जाता है।"
item = "एजेंट जो कॉम्पोनेंट रखते हैं, वे अपने मुख्य कॉम्पोनेंट से जुड़े रहते हैं, इसलिए एक बदलाव सभी कॉपियों को अपडेट कर देता है। एजेंट उन्हें अलग या बदल भी सकते हैं।"
item = "एजेंट कॉम्पोनेंट के अंदर सामग्री जोड़ते समय अब दोहराई गई लेयर नहीं बनाते। जिन फ़ाइलों में पहले से दोहराव है, वे एक क्लिक में ठीक करने वाली चेतावनी दिखाती हैं।"
item = "जब कोई एजेंट आपका दस्तावेज़ सेव करता है, तो एडिटर अब फ़ाइल का नाम और सेव होने की स्थिति दिखाता है।"
item = "फ़्रेम को लेयर वाले SVG के रूप में एक्सपोर्ट किया जा सकता है, टेक्स्ट और समूह बने रहते हैं, ताकि उन्हें दूसरे डिज़ाइन टूल में ले जाया जा सके।"
item = "एजेंट के लिए छोटे सुधार, जिनमें Windows पर साफ़ फ़ाइल पाथ भी शामिल हैं।"

[[note]]
version = "0.6.2"
locale = "th"
title = "เอเจนต์เสถียรขึ้นและคอมโพเนนต์ที่เชื่อมกัน"
item = "เอเจนต์โหลดเครื่องมือได้ทันที แม้ขณะเปิดเอกสารขนาดใหญ่หรือมีเอเจนต์อื่นทำงานอยู่ ถ้าเอดิเตอร์ยังโหลดอยู่ เอเจนต์จะได้รับแจ้งแทนการรอ"
item = "คอมโพเนนต์ที่เอเจนต์วางจะเชื่อมกับคอมโพเนนต์หลัก แก้ไขครั้งเดียวก็อัปเดตทุกสำเนา เอเจนต์ยังยกเลิกการเชื่อมหรือสลับคอมโพเนนต์ได้"
item = "เอเจนต์เพิ่มเนื้อหาในคอมโพเนนต์ได้โดยไม่สร้างเลเยอร์ซ้ำ ไฟล์ที่มีเลเยอร์ซ้ำอยู่แล้วจะแสดงคำเตือนพร้อมการซ่อมในคลิกเดียว"
item = "เมื่อเอเจนต์บันทึกเอกสาร เอดิเตอร์จะแสดงชื่อไฟล์และสถานะว่าบันทึกแล้ว"
item = "ส่งออกเฟรมเป็น SVG แบบมีเลเยอร์ได้ โดยคงข้อความและกลุ่มไว้ เพื่อนำไปใช้ในเครื่องมือออกแบบอื่น"
item = "การแก้ไขเล็กน้อยสำหรับเอเจนต์ รวมถึงพาธไฟล์ที่สะอาดขึ้นบน Windows"

[[note]]
version = "0.6.2"
locale = "vi"
title = "Tác nhân ổn định hơn và thành phần liên kết"
item = "Tác nhân tải công cụ ngay lập tức, kể cả khi đang mở tài liệu lớn hoặc khi tác nhân khác đang làm việc. Nếu trình chỉnh sửa vẫn đang tải, chúng được báo thay vì phải chờ."
item = "Thành phần do tác nhân đặt vẫn liên kết với thành phần chính, nên một thay đổi sẽ cập nhật mọi bản sao. Tác nhân cũng có thể tách hoặc thay thế chúng."
item = "Tác nhân có thể thêm nội dung vào bên trong thành phần mà không tạo lớp trùng lặp. Tệp đã có lớp trùng sẽ hiện cảnh báo kèm cách sửa bằng một lần nhấp."
item = "Khi tác nhân lưu tài liệu, trình chỉnh sửa giờ hiển thị tên tệp và trạng thái đã lưu."
item = "Có thể xuất khung thành SVG nhiều lớp, giữ nguyên chữ và nhóm, để đưa sang công cụ thiết kế khác."
item = "Các sửa lỗi nhỏ cho tác nhân, gồm đường dẫn tệp gọn hơn trên Windows."

[[note]]
version = "0.6.2"
locale = "id"
title = "Agen lebih stabil dan komponen tertaut"
item = "Agen langsung memuat alatnya, bahkan saat dokumen besar sedang dibuka atau agen lain sedang bekerja. Jika editor masih memuat, mereka diberi tahu alih-alih menunggu."
item = "Komponen yang ditempatkan agen tetap tertaut ke komponen utamanya, jadi satu perubahan memperbarui semua salinan. Agen juga bisa melepas atau menukarnya."
item = "Agen bisa menambahkan konten di dalam komponen tanpa membuat lapisan ganda. File yang sudah memilikinya menampilkan peringatan dengan perbaikan sekali klik."
item = "Saat agen menyimpan dokumen Anda, editor kini menampilkan nama file dan status tersimpan."
item = "Frame bisa diekspor sebagai SVG berlapis, dengan teks dan grup tetap utuh, untuk dibawa ke alat desain lain."
item = "Perbaikan kecil untuk agen, termasuk jalur file yang lebih rapi di Windows."

[[note]]
version = "0.6.1"
locale = "en-US"
title = "Smoother work with agents"
item = "Agents that read your design no longer make the canvas stutter, even in very large documents."
item = "Files with a broken animation still open: the broken part is left out and listed, so you can see what changed before you save."
item = "Animations an agent writes are checked first, so a mistake can no longer break the file."
item = "Settings ▸ System has a Check now button, so you can look for updates even with automatic checks turned off."
item = "Windows: updates install without asking for administrator approval, and if an update could not be installed, the app now tells you. Install this version once by hand; later updates install on their own."
item = "Security updates."

[[note]]
version = "0.6.1"
locale = "tr"
title = "Ajanlarla daha akıcı çalışma"
item = "Tasarımınızı okuyan ajanlar artık çok büyük belgelerde bile tuvali takıltmıyor."
item = "Bozuk animasyon içeren dosyalar yine açılıyor: bozuk kısım dışarıda bırakılıp listeleniyor, böylece kaydetmeden önce neyin değiştiğini görebiliyorsunuz."
item = "Bir ajanın yazdığı animasyonlar önce denetleniyor; bir hata artık dosyayı bozamıyor."
item = "Ayarlar ▸ Sistem'de bir Şimdi denetle düğmesi var; otomatik denetim kapalıyken de güncellemeleri kontrol edebilirsiniz."
item = "Windows: güncellemeler artık yönetici onayı istemeden kuruluyor ve bir güncelleme kurulamazsa uygulama bunu söylüyor. Bu sürümü bir kez elle kurun; sonraki güncellemeler kendiliğinden kurulur."
item = "Güvenlik güncellemeleri."

[[note]]
version = "0.6.1"
locale = "zh-CN"
title = "与智能体协作更流畅"
item = "读取设计的智能体不再让画布卡顿,即使文档非常大。"
item = "含有损坏动画的文件依然可以打开:损坏的部分会被移除并列出,保存前即可看到改动。"
item = "智能体写入的动画会先经过检查,出错也不会再损坏文件。"
item = "设置 ▸ 系统中新增“立即检查”按钮,即使关闭自动检查也能查找更新。"
item = "Windows:更新安装不再需要管理员批准;如果更新未能安装,应用会告诉你。请手动安装此版本一次,之后的更新会自动安装。"
item = "安全更新。"

[[note]]
version = "0.6.1"
locale = "zh-TW"
title = "與智慧代理協作更流暢"
item = "讀取設計的智慧代理不再讓畫布卡頓,即使文件非常大。"
item = "含有損壞動畫的檔案依然可以開啟:損壞的部分會被移除並列出,儲存前即可看到變更。"
item = "智慧代理寫入的動畫會先經過檢查,出錯也不會再損壞檔案。"
item = "設定 ▸ 系統新增「立即檢查」按鈕,即使關閉自動檢查也能尋找更新。"
item = "Windows:更新安裝不再需要系統管理員核准;若更新未能安裝,應用程式會告訴你。請手動安裝此版本一次,之後的更新會自動安裝。"
item = "安全性更新。"

[[note]]
version = "0.6.1"
locale = "ja"
title = "エージェントとの作業がよりスムーズに"
item = "デザインを読み取るエージェントが、非常に大きなドキュメントでもキャンバスをカクつかせなくなりました。"
item = "壊れたアニメーションを含むファイルも開けます。壊れた部分は除外して一覧表示されるので、保存前に変更内容を確認できます。"
item = "エージェントが書き込むアニメーションは先にチェックされるため、ミスでファイルが壊れることはなくなりました。"
item = "設定 ▸ システムに「今すぐ確認」ボタンを追加しました。自動確認をオフにしていてもアップデートを確認できます。"
item = "Windows:アップデートは管理者の承認なしでインストールされ、インストールできなかった場合はアプリが知らせます。このバージョンは一度だけ手動でインストールしてください。以降のアップデートは自動でインストールされます。"
item = "セキュリティアップデート。"

[[note]]
version = "0.6.1"
locale = "ko"
title = "에이전트와 더 매끄럽게 작업"
item = "디자인을 읽는 에이전트가 아주 큰 문서에서도 더 이상 캔버스를 버벅이게 하지 않습니다."
item = "손상된 애니메이션이 있는 파일도 열립니다. 손상된 부분은 빠지고 목록으로 표시되어 저장하기 전에 무엇이 바뀌었는지 확인할 수 있습니다."
item = "에이전트가 작성한 애니메이션은 먼저 검사되므로 실수로 파일이 손상되지 않습니다."
item = "설정 ▸ 시스템에 지금 확인 버튼이 추가되어, 자동 확인을 꺼 두어도 업데이트를 확인할 수 있습니다."
item = "Windows: 업데이트가 관리자 승인 없이 설치되며, 업데이트를 설치하지 못하면 앱이 알려 줍니다. 이 버전은 한 번만 직접 설치하세요. 이후 업데이트는 자동으로 설치됩니다."
item = "보안 업데이트."

[[note]]
version = "0.6.1"
locale = "fr"
title = "Un travail plus fluide avec les agents"
item = "Les agents qui lisent votre design ne font plus saccader le canevas, même dans de très grands documents."
item = "Les fichiers contenant une animation défectueuse s'ouvrent quand même : la partie défectueuse est retirée et listée, pour que vous voyiez ce qui a changé avant d'enregistrer."
item = "Les animations écrites par un agent sont d'abord vérifiées : une erreur ne peut plus abîmer le fichier."
item = "Réglages ▸ Système propose un bouton Vérifier : vous pouvez chercher les mises à jour même quand la vérification automatique est désactivée."
item = "Windows : les mises à jour s'installent sans demander d'autorisation administrateur, et l'app vous prévient si une mise à jour n'a pas pu s'installer. Installez cette version une fois à la main ; les suivantes s'installeront seules."
item = "Mises à jour de sécurité."

[[note]]
version = "0.6.1"
locale = "es"
title = "Trabajo más fluido con agentes"
item = "Los agentes que leen tu diseño ya no hacen que el lienzo se trabe, incluso en documentos muy grandes."
item = "Los archivos con una animación dañada se abren igualmente: la parte dañada se omite y se muestra en una lista, para que veas qué cambió antes de guardar."
item = "Las animaciones que escribe un agente se comprueban primero, así que un error ya no puede dañar el archivo."
item = "Ajustes ▸ Sistema tiene un botón Comprobar ahora para buscar actualizaciones aunque la comprobación automática esté desactivada."
item = "Windows: las actualizaciones se instalan sin pedir aprobación de administrador y, si una no se pudo instalar, la app te lo indica. Instala esta versión una vez a mano; las siguientes se instalarán solas."
item = "Actualizaciones de seguridad."

[[note]]
version = "0.6.1"
locale = "de"
title = "Flüssigeres Arbeiten mit Agenten"
item = "Agenten, die Ihr Design lesen, lassen die Arbeitsfläche nicht mehr ruckeln, auch bei sehr großen Dokumenten."
item = "Dateien mit einer fehlerhaften Animation öffnen sich trotzdem: Der fehlerhafte Teil wird weggelassen und aufgelistet, damit Sie vor dem Speichern sehen, was sich geändert hat."
item = "Animationen, die ein Agent schreibt, werden zuerst geprüft, sodass ein Fehler die Datei nicht mehr beschädigen kann."
item = "Einstellungen ▸ System hat eine Schaltfläche Jetzt prüfen, damit du auch bei ausgeschalteter automatischer Prüfung nach Updates suchen kannst."
item = "Windows: Updates werden ohne Administratorfreigabe installiert, und die App sagt dir, wenn ein Update nicht installiert werden konnte. Installiere diese Version einmal von Hand; spätere Updates installieren sich selbst."
item = "Sicherheitsupdates."

[[note]]
version = "0.6.1"
locale = "pt"
title = "Trabalho mais fluido com agentes"
item = "Os agentes que leem o seu design já não fazem a tela travar, mesmo em documentos muito grandes."
item = "Arquivos com uma animação com defeito abrem mesmo assim: a parte com defeito é removida e listada, para que você veja o que mudou antes de salvar."
item = "As animações que um agente escreve são verificadas antes, então um erro não consegue mais danificar o arquivo."
item = "Configurações ▸ Sistema tem um botão Verificar agora, para procurar atualizações mesmo com a verificação automática desligada."
item = "Windows: as atualizações são instaladas sem pedir aprovação de administrador e, se uma não puder ser instalada, o app avisa. Instale esta versão uma vez manualmente; as próximas serão instaladas sozinhas."
item = "Atualizações de segurança."

[[note]]
version = "0.6.1"
locale = "ru"
title = "Более плавная работа с агентами"
item = "Агенты, читающие ваш дизайн, больше не вызывают подтормаживания холста даже в очень больших документах."
item = "Файлы с повреждённой анимацией всё равно открываются: повреждённая часть отбрасывается и показывается в списке, чтобы вы видели изменения до сохранения."
item = "Анимации, которые пишет агент, сначала проверяются, поэтому ошибка больше не может испортить файл."
item = "В разделе Настройки ▸ Система появилась кнопка «Проверить»: обновления можно искать, даже если автоматическая проверка выключена."
item = "Windows: обновления устанавливаются без запроса прав администратора, а если обновление не удалось установить, приложение сообщит об этом. Установите эту версию один раз вручную — следующие обновления установятся сами."
item = "Обновления безопасности."

[[note]]
version = "0.6.1"
locale = "hi"
title = "एजेंटों के साथ ज़्यादा सहज काम"
item = "आपका डिज़ाइन पढ़ने वाले एजेंट अब बहुत बड़े दस्तावेज़ों में भी कैनवास को अटकाते नहीं हैं।"
item = "टूटे एनिमेशन वाली फ़ाइलें भी खुलती हैं: टूटा हिस्सा हटा दिया जाता है और सूची में दिखाया जाता है, ताकि सहेजने से पहले आप देख सकें कि क्या बदला।"
item = "एजेंट जो एनिमेशन लिखता है उनकी पहले जाँच होती है, इसलिए कोई गलती अब फ़ाइल को खराब नहीं कर सकती।"
item = "सेटिंग्स ▸ सिस्टम में अभी जाँचें बटन है, ताकि स्वचालित जाँच बंद होने पर भी आप अपडेट देख सकें।"
item = "Windows: अपडेट अब व्यवस्थापक की अनुमति माँगे बिना इंस्टॉल होते हैं, और कोई अपडेट इंस्टॉल न हो पाए तो ऐप बताता है। यह संस्करण एक बार खुद इंस्टॉल करें; आगे के अपडेट अपने आप इंस्टॉल होंगे।"
item = "सुरक्षा अपडेट।"

[[note]]
version = "0.6.1"
locale = "th"
title = "ทำงานกับเอเจนต์ได้ลื่นไหลขึ้น"
item = "เอเจนต์ที่อ่านงานออกแบบของคุณไม่ทำให้แคนวาสกระตุกอีกต่อไป แม้ในเอกสารขนาดใหญ่มาก"
item = "ไฟล์ที่มีแอนิเมชันเสียยังเปิดได้: ส่วนที่เสียจะถูกตัดออกและแสดงเป็นรายการ คุณจึงเห็นได้ว่ามีอะไรเปลี่ยนไปก่อนบันทึก"
item = "แอนิเมชันที่เอเจนต์เขียนจะถูกตรวจสอบก่อน ข้อผิดพลาดจึงไม่ทำให้ไฟล์เสียอีกต่อไป"
item = "การตั้งค่า ▸ ระบบ มีปุ่มตรวจสอบตอนนี้ คุณจึงหาอัปเดตได้แม้ปิดการตรวจสอบอัตโนมัติไว้"
item = "Windows: การอัปเดตติดตั้งได้โดยไม่ต้องขอสิทธิ์ผู้ดูแลระบบ และหากติดตั้งอัปเดตไม่สำเร็จ แอปจะแจ้งให้ทราบ ติดตั้งเวอร์ชันนี้ด้วยตนเองหนึ่งครั้ง จากนั้นอัปเดตครั้งต่อไปจะติดตั้งเอง"
item = "อัปเดตด้านความปลอดภัย"

[[note]]
version = "0.6.1"
locale = "vi"
title = "Làm việc với tác tử mượt mà hơn"
item = "Các tác tử đọc thiết kế của bạn không còn làm canvas bị giật, kể cả với tài liệu rất lớn."
item = "Tệp có hoạt ảnh bị lỗi vẫn mở được: phần bị lỗi được bỏ ra và liệt kê, để bạn thấy những gì đã thay đổi trước khi lưu."
item = "Hoạt ảnh do tác tử ghi được kiểm tra trước, nên một lỗi không còn làm hỏng tệp."
item = "Cài đặt ▸ Hệ thống có nút Kiểm tra ngay để bạn tìm bản cập nhật ngay cả khi đã tắt kiểm tra tự động."
item = "Windows: bản cập nhật được cài mà không cần quyền quản trị, và nếu một bản cập nhật không cài được, ứng dụng sẽ báo cho bạn. Hãy tự cài phiên bản này một lần; các bản cập nhật sau sẽ tự cài."
item = "Cập nhật bảo mật."

[[note]]
version = "0.6.1"
locale = "id"
title = "Bekerja dengan agen lebih lancar"
item = "Agen yang membaca desain Anda tidak lagi membuat kanvas tersendat, bahkan di dokumen yang sangat besar."
item = "File dengan animasi yang rusak tetap terbuka: bagian yang rusak dihapus dan dicantumkan, sehingga Anda bisa melihat apa yang berubah sebelum menyimpan."
item = "Animasi yang ditulis agen diperiksa terlebih dahulu, sehingga kesalahan tidak lagi bisa merusak file."
item = "Pengaturan ▸ Sistem punya tombol Periksa sekarang, jadi Anda bisa mencari pembaruan meski pemeriksaan otomatis dimatikan."
item = "Windows: pembaruan terpasang tanpa meminta izin administrator, dan aplikasi memberi tahu jika pembaruan gagal dipasang. Pasang versi ini sekali secara manual; pembaruan berikutnya terpasang sendiri."
item = "Pembaruan keamanan."

[[note]]
version = "0.6.0"
locale = "en-US"
title = "Live web pages on the canvas"
item = "Click a browser node to play its page live, animations and video included."
item = "Double-click a browser node to use the page right on the canvas: click, scroll and type. Press Escape to leave."
item = "In Preview, browser nodes play live and respond to clicks and typing straight away."
item = "Imported web pages look closer to the original: gradient text keeps its colours, uppercase labels stay uppercase, open menus and moved elements stay where they were, and 3D canvases come in with their picture."
item = "Full-screen pages import at full size, and scrolling areas can be imported fully expanded."
item = "A new Live pages switch in Settings turns live playback off."

[[note]]
version = "0.6.0"
locale = "tr"
title = "Tuvalde canlı web sayfaları"
item = "Bir tarayıcı düğümüne tıklayınca sayfası canlı oynuyor; animasyonlar ve videolar dahil."
item = "Bir tarayıcı düğümüne çift tıklayıp sayfayı doğrudan tuvalde kullanabilirsiniz: tıklayın, kaydırın, yazın. Çıkmak için Escape'e basın."
item = "Önizlemede tarayıcı düğümleri canlı oynuyor ve tıklamalara ve yazmaya hemen yanıt veriyor."
item = "İçe aktarılan web sayfaları asıllarına daha çok benziyor: gradyan metin renklerini koruyor, büyük harfli etiketler büyük harf kalıyor, açık menüler ve kaydırılmış öğeler yerinde duruyor, 3B tuvaller görüntüleriyle geliyor."
item = "Tam ekran sayfalar tam boyutta içe aktarılıyor; kaydırılan alanlar isterseniz tamamen açılmış olarak geliyor."
item = "Ayarlar'daki yeni Canlı sayfalar anahtarı canlı oynatmayı kapatıyor."

[[note]]
version = "0.6.0"
locale = "zh-CN"
title = "画布上的实时网页"
item = "点击浏览器节点即可实时播放其网页,包括动画和视频。"
item = "双击浏览器节点即可直接在画布上使用网页:点击、滚动和输入。按 Esc 退出。"
item = "在预览中,浏览器节点会实时播放,并立即响应点击和输入。"
item = "导入的网页更接近原貌:渐变文字保留颜色,大写标签保持大写,展开的菜单和移动过的元素保持原位,3D 画布带着画面一起导入。"
item = "全屏页面以完整尺寸导入,滚动区域可以完全展开后导入。"
item = "设置中新增的「实时页面」开关可以关闭实时播放。"

[[note]]
version = "0.6.0"
locale = "zh-TW"
title = "畫布上的即時網頁"
item = "點選瀏覽器節點即可即時播放其網頁,包括動畫和影片。"
item = "雙擊瀏覽器節點即可直接在畫布上使用網頁:點選、捲動和輸入。按 Esc 離開。"
item = "在預覽中,瀏覽器節點會即時播放,並立即回應點選和輸入。"
item = "匯入的網頁更接近原貌:漸層文字保留顏色,大寫標籤維持大寫,展開的選單和移動過的元素維持原位,3D 畫布連同畫面一起匯入。"
item = "全螢幕頁面以完整尺寸匯入,捲動區域可以完全展開後匯入。"
item = "設定中新增的「即時頁面」開關可以關閉即時播放。"

[[note]]
version = "0.6.0"
locale = "ja"
title = "キャンバス上のライブ Web ページ"
item = "ブラウザーノードをクリックすると、アニメーションや動画も含めてページがライブで再生されます。"
item = "ブラウザーノードをダブルクリックすると、キャンバス上でそのままページを操作できます。クリック、スクロール、入力ができ、Esc で終了します。"
item = "プレビューでは、ブラウザーノードがライブで再生され、クリックや入力にすぐ反応します。"
item = "読み込んだ Web ページが元の見た目に近づきました。グラデーションの文字は色を保ち、大文字のラベルは大文字のまま、開いたメニューや移動した要素は元の位置に、3D キャンバスは画像付きで取り込まれます。"
item = "全画面のページは実際のサイズで取り込まれ、スクロール領域はすべて展開した状態で取り込めます。"
item = "設定の新しい「ライブページ」スイッチでライブ再生をオフにできます。"

[[note]]
version = "0.6.0"
locale = "ko"
title = "캔버스 위의 라이브 웹 페이지"
item = "브라우저 노드를 클릭하면 애니메이션과 동영상을 포함해 페이지가 실시간으로 재생됩니다."
item = "브라우저 노드를 더블클릭하면 캔버스에서 바로 페이지를 사용할 수 있습니다. 클릭, 스크롤, 입력이 가능하며 Esc로 나갑니다."
item = "미리보기에서는 브라우저 노드가 실시간으로 재생되고 클릭과 입력에 바로 반응합니다."
item = "가져온 웹 페이지가 원본에 더 가까워졌습니다. 그라데이션 텍스트는 색을 유지하고, 대문자 라벨은 대문자로 남으며, 열린 메뉴와 이동된 요소는 제자리에 있고, 3D 캔버스는 그림과 함께 들어옵니다."
item = "전체 화면 페이지는 실제 크기로 가져오고, 스크롤 영역은 모두 펼친 상태로 가져올 수 있습니다."
item = "설정의 새 라이브 페이지 스위치로 실시간 재생을 끌 수 있습니다."

[[note]]
version = "0.6.0"
locale = "fr"
title = "Des pages web en direct sur le canevas"
item = "Cliquez sur un nœud navigateur pour lire sa page en direct, animations et vidéos comprises."
item = "Double-cliquez sur un nœud navigateur pour utiliser la page directement sur le canevas : cliquez, faites défiler et tapez. Appuyez sur Échap pour quitter."
item = "Dans l'aperçu, les nœuds navigateur sont lus en direct et réagissent tout de suite aux clics et à la saisie."
item = "Les pages web importées ressemblent davantage à l'original : le texte en dégradé garde ses couleurs, les libellés en majuscules restent en majuscules, les menus ouverts et les éléments déplacés restent à leur place, et les canevas 3D arrivent avec leur image."
item = "Les pages plein écran sont importées à leur taille réelle, et les zones défilantes peuvent être importées entièrement dépliées."
item = "Un nouvel interrupteur Pages en direct dans les réglages désactive la lecture en direct."

[[note]]
version = "0.6.0"
locale = "es"
title = "Páginas web en vivo en el lienzo"
item = "Haz clic en un nodo de navegador para reproducir su página en vivo, con animaciones y vídeo incluidos."
item = "Haz doble clic en un nodo de navegador para usar la página directamente en el lienzo: haz clic, desplázate y escribe. Pulsa Escape para salir."
item = "En la vista previa, los nodos de navegador se reproducen en vivo y responden al instante a los clics y a la escritura."
item = "Las páginas web importadas se parecen más al original: el texto con degradado conserva sus colores, las etiquetas en mayúsculas siguen en mayúsculas, los menús abiertos y los elementos desplazados se quedan en su sitio, y los lienzos 3D llegan con su imagen."
item = "Las páginas a pantalla completa se importan a tamaño completo, y las zonas con desplazamiento pueden importarse totalmente desplegadas."
item = "Un nuevo interruptor Páginas en vivo en Ajustes desactiva la reproducción en vivo."

[[note]]
version = "0.6.0"
locale = "de"
title = "Live-Webseiten auf der Arbeitsfläche"
item = "Klicken Sie auf einen Browser-Knoten, um seine Seite live abzuspielen, samt Animationen und Videos."
item = "Doppelklicken Sie auf einen Browser-Knoten, um die Seite direkt auf der Arbeitsfläche zu bedienen: klicken, scrollen und tippen. Mit Esc verlassen Sie den Modus."
item = "In der Vorschau laufen Browser-Knoten live und reagieren sofort auf Klicks und Eingaben."
item = "Importierte Webseiten sehen dem Original ähnlicher: Text mit Farbverlauf behält seine Farben, Beschriftungen in Großbuchstaben bleiben groß, geöffnete Menüs und verschobene Elemente bleiben an ihrem Platz, und 3D-Canvas kommen mit ihrem Bild."
item = "Vollbildseiten werden in voller Größe importiert, und scrollbare Bereiche lassen sich vollständig aufgeklappt importieren."
item = "Ein neuer Schalter Live-Seiten in den Einstellungen schaltet die Live-Wiedergabe aus."

[[note]]
version = "0.6.0"
locale = "pt"
title = "Páginas web ao vivo na tela"
item = "Clique em um nó de navegador para reproduzir a página ao vivo, com animações e vídeos."
item = "Clique duas vezes em um nó de navegador para usar a página direto na tela: clique, role e digite. Pressione Esc para sair."
item = "Na pré-visualização, os nós de navegador são reproduzidos ao vivo e respondem na hora a cliques e digitação."
item = "Páginas web importadas ficam mais parecidas com o original: texto em degradê mantém as cores, rótulos em maiúsculas continuam em maiúsculas, menus abertos e elementos deslocados ficam no lugar, e telas 3D chegam com a imagem."
item = "Páginas em tela cheia são importadas no tamanho completo, e áreas com rolagem podem ser importadas totalmente expandidas."
item = "Um novo botão Páginas ao vivo nas Configurações desativa a reprodução ao vivo."

[[note]]
version = "0.6.0"
locale = "ru"
title = "Живые веб-страницы на холсте"
item = "Щёлкните узел браузера, чтобы его страница воспроизводилась вживую, включая анимации и видео."
item = "Дважды щёлкните узел браузера, чтобы пользоваться страницей прямо на холсте: нажимать, прокручивать и вводить текст. Чтобы выйти, нажмите Esc."
item = "В предпросмотре узлы браузера воспроизводятся вживую и сразу отвечают на щелчки и ввод."
item = "Импортированные веб-страницы ближе к оригиналу: градиентный текст сохраняет цвета, подписи заглавными буквами остаются заглавными, открытые меню и смещённые элементы остаются на месте, а 3D-холсты переносятся вместе с изображением."
item = "Полноэкранные страницы импортируются в полном размере, а прокручиваемые области можно импортировать полностью развёрнутыми."
item = "Новый переключатель «Живые страницы» в настройках отключает живое воспроизведение."

[[note]]
version = "0.6.0"
locale = "hi"
title = "कैनवस पर लाइव वेब पेज"
item = "किसी ब्राउज़र नोड पर क्लिक करें और उसका पेज लाइव चलेगा, एनिमेशन और वीडियो समेत।"
item = "किसी ब्राउज़र नोड पर डबल-क्लिक करके पेज को सीधे कैनवस पर इस्तेमाल करें: क्लिक करें, स्क्रॉल करें और टाइप करें। बाहर निकलने के लिए Esc दबाएँ।"
item = "प्रीव्यू में ब्राउज़र नोड लाइव चलते हैं और क्लिक व टाइपिंग पर तुरंत प्रतिक्रिया देते हैं।"
item = "इम्पोर्ट किए गए वेब पेज मूल के और करीब दिखते हैं: ग्रेडिएंट टेक्स्ट अपने रंग रखता है, बड़े अक्षरों वाले लेबल बड़े ही रहते हैं, खुले मेनू और खिसकाए गए एलिमेंट अपनी जगह पर रहते हैं, और 3D कैनवस अपनी तस्वीर के साथ आते हैं।"
item = "फ़ुल-स्क्रीन पेज पूरे आकार में इम्पोर्ट होते हैं, और स्क्रॉल होने वाले हिस्से पूरी तरह खुले हुए इम्पोर्ट किए जा सकते हैं।"
item = "सेटिंग्स में नया लाइव पेज स्विच लाइव चलना बंद करता है।"

[[note]]
version = "0.6.0"
locale = "th"
title = "หน้าเว็บสดบนแคนวาส"
item = "คลิกโหนดเบราว์เซอร์เพื่อเล่นหน้าเว็บแบบสด รวมถึงแอนิเมชันและวิดีโอ"
item = "ดับเบิลคลิกโหนดเบราว์เซอร์เพื่อใช้หน้าเว็บบนแคนวาสได้ทันที ทั้งคลิก เลื่อน และพิมพ์ กด Esc เพื่อออก"
item = "ในการแสดงตัวอย่าง โหนดเบราว์เซอร์จะเล่นแบบสดและตอบสนองการคลิกและการพิมพ์ทันที"
item = "หน้าเว็บที่นำเข้ามีหน้าตาใกล้ต้นฉบับมากขึ้น ข้อความไล่สียังคงสีเดิม ป้ายตัวพิมพ์ใหญ่ยังเป็นตัวพิมพ์ใหญ่ เมนูที่เปิดอยู่และองค์ประกอบที่ถูกเลื่อนอยู่ที่เดิม และแคนวาส 3D มาพร้อมภาพของมัน"
item = "หน้าแบบเต็มหน้าจอนำเข้าในขนาดเต็ม และพื้นที่ที่เลื่อนได้สามารถนำเข้าแบบขยายเต็มได้"
item = "สวิตช์หน้าสดใหม่ในการตั้งค่าใช้ปิดการเล่นแบบสด"

[[note]]
version = "0.6.0"
locale = "vi"
title = "Trang web trực tiếp trên canvas"
item = "Nhấp vào một nút trình duyệt để phát trang của nó trực tiếp, kể cả hoạt ảnh và video."
item = "Nhấp đúp vào một nút trình duyệt để dùng trang ngay trên canvas: nhấp, cuộn và gõ. Nhấn Esc để thoát."
item = "Trong bản xem trước, các nút trình duyệt phát trực tiếp và phản hồi ngay khi bạn nhấp hoặc gõ."
item = "Trang web được nhập trông gần với bản gốc hơn: chữ chuyển màu giữ nguyên màu, nhãn viết hoa vẫn viết hoa, menu đang mở và phần tử bị dịch chuyển giữ đúng vị trí, và canvas 3D được nhập kèm hình ảnh."
item = "Trang toàn màn hình được nhập ở kích thước đầy đủ, và vùng cuộn có thể được nhập ở dạng mở rộng hoàn toàn."
item = "Công tắc Trang trực tiếp mới trong Cài đặt dùng để tắt phát trực tiếp."

[[note]]
version = "0.6.0"
locale = "id"
title = "Halaman web langsung di kanvas"
item = "Klik node browser untuk memutar halamannya secara langsung, termasuk animasi dan video."
item = "Klik dua kali node browser untuk memakai halaman langsung di kanvas: klik, gulir, dan ketik. Tekan Esc untuk keluar."
item = "Di pratinjau, node browser diputar secara langsung dan langsung merespons klik serta ketikan."
item = "Halaman web yang diimpor terlihat lebih mirip aslinya: teks gradien mempertahankan warnanya, label huruf kapital tetap kapital, menu yang terbuka dan elemen yang digeser tetap di tempatnya, dan kanvas 3D masuk bersama gambarnya."
item = "Halaman layar penuh diimpor dalam ukuran penuh, dan area yang dapat digulir bisa diimpor dalam keadaan terbuka penuh."
item = "Sakelar Halaman langsung yang baru di Pengaturan mematikan pemutaran langsung."

[[note]]
version = "0.5.7"
locale = "en-US"
title = "Smoother scrolling and better web imports"
item = "On Windows the editor no longer freezes after you minimize the window and bring it back."
item = "The mouse wheel now scrolls the canvas: hold Shift to scroll sideways and Ctrl or Cmd to zoom. Side panels scroll one line per notch."
item = "Imported web pages stay editable: centred text stays centred, buttons grow with their label, cut-off text keeps its \"…\", empty fields keep their placeholder, and layers are named after what they are."
item = "A web page brings its own fonts along, and medium-weight text looks the same as in your browser."
item = "In the agent settings, the install command is shown in full and has a copy button."
item = "Layer names stay readable in deeply nested designs."

[[note]]
version = "0.5.7"
locale = "tr"
title = "Daha akıcı kaydırma ve daha iyi web içe aktarma"
item = "Windows'ta pencereyi simge durumuna küçültüp geri açınca düzenleyici artık donmuyor."
item = "Fare tekerleği artık tuvali kaydırıyor: yana kaydırmak için Shift'e, yakınlaştırmak için Ctrl ya da Cmd'ye basılı tutun. Yan paneller her çentikte bir satır kayıyor."
item = "İçe aktarılan web sayfaları düzenlenebilir kalıyor: ortalanmış metin ortada kalıyor, butonlar etiketleriyle birlikte büyüyor, kesilen metin \"…\" ile bitiyor, boş alanlar yer tutucu metinlerini koruyor ve katmanlar ne olduklarına göre adlandırılıyor."
item = "Web sayfası kendi fontlarını da getiriyor; orta kalınlıktaki metin tarayıcınızdakiyle aynı görünüyor."
item = "Ajan ayarlarında kurulum komutu tamamı görünecek şekilde gösteriliyor ve bir kopyalama butonu var."
item = "Çok iç içe tasarımlarda katman adları okunur kalıyor."

[[note]]
version = "0.5.7"
locale = "zh-CN"
title = "更顺畅的滚动与更好的网页导入"
item = "在 Windows 上,最小化窗口后再恢复,编辑器不再卡死。"
item = "鼠标滚轮现在会滚动画布:按住 Shift 横向滚动,按住 Ctrl 或 Cmd 缩放。侧边面板每格滚动一行。"
item = "导入的网页保持可编辑:居中的文字保持居中,按钮随文字变长,被截断的文字保留「…」,空输入框保留占位文字,图层按其内容命名。"
item = "网页会一并带来自己的字体,中等粗细的文字与浏览器中显示一致。"
item = "在代理设置中,安装命令会完整显示,并带有复制按钮。"
item = "在层级很深的设计中,图层名称依然清晰可读。"

[[note]]
version = "0.5.7"
locale = "zh-TW"
title = "更流暢的捲動與更好的網頁匯入"
item = "在 Windows 上,將視窗最小化後再還原,編輯器不再當住。"
item = "滑鼠滾輪現在會捲動畫布:按住 Shift 橫向捲動,按住 Ctrl 或 Cmd 縮放。側邊面板每格捲動一行。"
item = "匯入的網頁保持可編輯:置中的文字維持置中,按鈕隨文字變長,被截斷的文字保留「…」,空白欄位保留預留文字,圖層依其內容命名。"
item = "網頁會一併帶來自己的字型,中等粗細的文字與瀏覽器中顯示一致。"
item = "在代理設定中,安裝指令會完整顯示,並附有複製按鈕。"
item = "在層級很深的設計中,圖層名稱依然清楚易讀。"

[[note]]
version = "0.5.7"
locale = "ja"
title = "なめらかなスクロールと Web 取り込みの改善"
item = "Windows でウィンドウを最小化して元に戻しても、エディタが固まらなくなりました。"
item = "マウスホイールでキャンバスがスクロールするようになりました。Shift で横方向、Ctrl または Cmd でズームします。サイドパネルは 1 目盛りで 1 行ずつスクロールします。"
item = "取り込んだ Web ページは編集しやすいままです。中央揃えのテキストは中央のまま、ボタンはラベルに合わせて広がり、切れたテキストは「…」を保ち、空の入力欄はプレースホルダーを保ち、レイヤーは中身に合った名前になります。"
item = "Web ページは自分のフォントも一緒に持ち込み、中くらいの太さの文字がブラウザと同じに見えます。"
item = "エージェント設定のインストールコマンドが全文表示され、コピーボタンが付きました。"
item = "深く入れ子になったデザインでもレイヤー名が読みやすくなりました。"

[[note]]
version = "0.5.7"
locale = "ko"
title = "더 매끄러운 스크롤과 더 나은 웹 가져오기"
item = "Windows에서 창을 최소화했다가 다시 열어도 편집기가 더 이상 멈추지 않습니다."
item = "이제 마우스 휠로 캔버스를 스크롤합니다. Shift를 누르면 가로로, Ctrl 또는 Cmd를 누르면 확대/축소합니다. 사이드 패널은 한 칸에 한 줄씩 스크롤됩니다."
item = "가져온 웹 페이지가 편집하기 쉬운 상태로 유지됩니다. 가운데 정렬된 텍스트는 가운데에 남고, 버튼은 레이블에 맞춰 늘어나며, 잘린 텍스트는 \"…\"를 유지하고, 빈 입력란은 자리 표시자를 유지하며, 레이어는 내용에 맞는 이름을 갖습니다."
item = "웹 페이지가 자신의 글꼴도 함께 가져오며, 중간 굵기의 텍스트가 브라우저와 똑같이 보입니다."
item = "에이전트 설정에서 설치 명령이 전부 표시되고 복사 버튼이 생겼습니다."
item = "깊게 중첩된 디자인에서도 레이어 이름을 읽기 쉽습니다."

[[note]]
version = "0.5.7"
locale = "fr"
title = "Un défilement plus fluide et de meilleurs imports web"
item = "Sous Windows, l'éditeur ne se fige plus quand vous réduisez la fenêtre puis la rouvrez."
item = "La molette fait maintenant défiler le canevas : maintenez Maj pour défiler horizontalement et Ctrl ou Cmd pour zoomer. Les panneaux latéraux défilent d'une ligne par cran."
item = "Les pages web importées restent modifiables : le texte centré reste centré, les boutons s'agrandissent avec leur libellé, le texte coupé garde ses « … », les champs vides gardent leur texte indicatif et les calques portent un nom qui dit ce qu'ils sont."
item = "Une page web apporte ses propres polices, et le texte de graisse moyenne s'affiche comme dans votre navigateur."
item = "Dans les réglages des agents, la commande d'installation s'affiche en entier, avec un bouton pour la copier."
item = "Les noms de calques restent lisibles dans les designs très imbriqués."

[[note]]
version = "0.5.7"
locale = "es"
title = "Desplazamiento más fluido y mejores importaciones web"
item = "En Windows, el editor ya no se congela al minimizar la ventana y volver a abrirla."
item = "La rueda del ratón ahora desplaza el lienzo: mantén Mayús para desplazarte en horizontal y Ctrl o Cmd para hacer zoom. Los paneles laterales avanzan una línea por muesca."
item = "Las páginas web importadas siguen siendo editables: el texto centrado se mantiene centrado, los botones crecen con su etiqueta, el texto recortado conserva sus «…», los campos vacíos conservan su texto de ejemplo y las capas se nombran según lo que son."
item = "Una página web trae sus propias fuentes, y el texto de grosor medio se ve igual que en tu navegador."
item = "En los ajustes de agentes, el comando de instalación se muestra completo y tiene un botón para copiarlo."
item = "Los nombres de las capas siguen siendo legibles en diseños muy anidados."

[[note]]
version = "0.5.7"
locale = "de"
title = "Flüssigeres Scrollen und bessere Web-Importe"
item = "Unter Windows friert der Editor nicht mehr ein, wenn Sie das Fenster minimieren und wiederherstellen."
item = "Das Mausrad scrollt jetzt die Arbeitsfläche: Halten Sie Umschalt für seitliches Scrollen und Strg oder Cmd zum Zoomen. Seitenleisten scrollen eine Zeile pro Raste."
item = "Importierte Webseiten bleiben bearbeitbar: Zentrierter Text bleibt zentriert, Schaltflächen wachsen mit ihrer Beschriftung, abgeschnittener Text behält sein „…“, leere Felder behalten ihren Platzhalter, und Ebenen heißen nach dem, was sie sind."
item = "Eine Webseite bringt ihre eigenen Schriften mit, und Text in mittlerer Stärke sieht aus wie in Ihrem Browser."
item = "In den Agenten-Einstellungen wird der Installationsbefehl vollständig angezeigt und hat eine Schaltfläche zum Kopieren."
item = "Ebenennamen bleiben auch in tief verschachtelten Designs lesbar."

[[note]]
version = "0.5.7"
locale = "pt"
title = "Rolagem mais suave e importações web melhores"
item = "No Windows, o editor não trava mais ao minimizar a janela e abri-la de novo."
item = "A roda do mouse agora rola a tela: segure Shift para rolar na horizontal e Ctrl ou Cmd para dar zoom. Os painéis laterais rolam uma linha por clique."
item = "Páginas web importadas continuam editáveis: texto centralizado fica centralizado, botões crescem com o rótulo, texto cortado mantém as \"…\", campos vazios mantêm o texto de exemplo e as camadas recebem nomes que dizem o que são."
item = "Uma página web traz as próprias fontes, e o texto de peso médio aparece igual ao do seu navegador."
item = "Nas configurações de agentes, o comando de instalação aparece inteiro e tem um botão para copiar."
item = "Os nomes das camadas continuam legíveis em designs muito aninhados."

[[note]]
version = "0.5.7"
locale = "ru"
title = "Плавная прокрутка и улучшенный импорт веб-страниц"
item = "В Windows редактор больше не зависает, если свернуть окно и снова его открыть."
item = "Колесо мыши теперь прокручивает холст: удерживайте Shift для прокрутки по горизонтали и Ctrl или Cmd для масштабирования. Боковые панели прокручиваются на одну строку за щелчок."
item = "Импортированные веб-страницы остаются редактируемыми: текст по центру остаётся по центру, кнопки растут вместе с подписью, обрезанный текст сохраняет «…», пустые поля сохраняют подсказку, а слои называются по тому, что они собой представляют."
item = "Веб-страница приносит с собой свои шрифты, а текст средней насыщенности выглядит так же, как в браузере."
item = "В настройках агентов команда установки показана полностью и имеет кнопку копирования."
item = "Названия слоёв остаются читаемыми в глубоко вложенных макетах."

[[note]]
version = "0.5.7"
locale = "hi"
title = "ज़्यादा सहज स्क्रॉलिंग और बेहतर वेब आयात"
item = "Windows पर विंडो को छोटा करके दोबारा खोलने पर एडिटर अब नहीं अटकता।"
item = "माउस व्हील अब कैनवास को स्क्रॉल करता है: बगल में स्क्रॉल करने के लिए Shift और ज़ूम के लिए Ctrl या Cmd दबाए रखें। साइड पैनल हर क्लिक पर एक पंक्ति खिसकते हैं।"
item = "आयात किए गए वेब पेज बदले जा सकते हैं: बीच में रखा टेक्स्ट बीच में रहता है, बटन अपने लेबल के साथ बढ़ते हैं, कटा हुआ टेक्स्ट \"…\" बनाए रखता है, खाली फ़ील्ड अपना संकेत टेक्स्ट रखते हैं, और लेयर का नाम उसकी सामग्री के हिसाब से होता है।"
item = "वेब पेज अपने फ़ॉन्ट भी साथ लाता है, और मध्यम मोटाई का टेक्स्ट आपके ब्राउज़र जैसा ही दिखता है।"
item = "एजेंट सेटिंग्स में इंस्टॉल कमांड पूरी दिखती है और उसे कॉपी करने का बटन है।"
item = "बहुत गहराई तक नेस्ट किए गए डिज़ाइनों में भी लेयर के नाम पढ़ने में आसान रहते हैं।"

[[note]]
version = "0.5.7"
locale = "th"
title = "เลื่อนลื่นขึ้นและนำเข้าเว็บได้ดีขึ้น"
item = "บน Windows เอดิเตอร์ไม่ค้างอีกต่อไปเมื่อย่อหน้าต่างแล้วเปิดกลับมา"
item = "ตอนนี้ล้อเมาส์เลื่อนแคนวาส: กด Shift ค้างไว้เพื่อเลื่อนแนวนอน และ Ctrl หรือ Cmd เพื่อซูม แผงด้านข้างเลื่อนทีละหนึ่งบรรทัดต่อหนึ่งจังหวะ"
item = "หน้าเว็บที่นำเข้ายังแก้ไขได้ง่าย: ข้อความที่จัดกึ่งกลางยังคงอยู่ตรงกลาง ปุ่มขยายตามป้ายกำกับ ข้อความที่ถูกตัดยังคงมี \"…\" ช่องว่างยังคงมีข้อความตัวอย่าง และเลเยอร์มีชื่อตามสิ่งที่มันเป็น"
item = "หน้าเว็บนำฟอนต์ของตัวเองมาด้วย และข้อความน้ำหนักปานกลางดูเหมือนในเบราว์เซอร์ของคุณ"
item = "ในการตั้งค่าเอเจนต์ คำสั่งติดตั้งแสดงเต็มบรรทัดและมีปุ่มคัดลอก"
item = "ชื่อเลเยอร์ยังอ่านได้ง่ายในงานออกแบบที่ซ้อนกันหลายชั้น"

[[note]]
version = "0.5.7"
locale = "vi"
title = "Cuộn mượt hơn và nhập trang web tốt hơn"
item = "Trên Windows, trình chỉnh sửa không còn bị treo khi bạn thu nhỏ cửa sổ rồi mở lại."
item = "Con lăn chuột giờ cuộn khung vẽ: giữ Shift để cuộn ngang và Ctrl hoặc Cmd để thu phóng. Các bảng bên cuộn một dòng mỗi nấc."
item = "Trang web đã nhập vẫn dễ chỉnh sửa: chữ căn giữa vẫn ở giữa, nút dài ra theo nhãn, chữ bị cắt vẫn giữ dấu \"…\", ô trống vẫn giữ chữ gợi ý, và các lớp được đặt tên theo đúng nội dung."
item = "Trang web mang theo phông chữ của riêng nó, và chữ đậm vừa trông giống như trong trình duyệt của bạn."
item = "Trong phần cài đặt tác nhân, lệnh cài đặt hiển thị đầy đủ và có nút sao chép."
item = "Tên lớp vẫn dễ đọc trong các thiết kế lồng nhau nhiều tầng."

[[note]]
version = "0.5.7"
locale = "id"
title = "Gulir lebih mulus dan impor web lebih baik"
item = "Di Windows, editor tidak lagi macet saat jendela diperkecil lalu dibuka kembali."
item = "Roda mouse kini menggulir kanvas: tahan Shift untuk menggulir ke samping dan Ctrl atau Cmd untuk zoom. Panel samping bergulir satu baris per takik."
item = "Halaman web yang diimpor tetap bisa diedit: teks di tengah tetap di tengah, tombol melebar mengikuti labelnya, teks yang terpotong tetap berakhiran \"…\", kolom kosong tetap menampilkan teks petunjuk, dan lapisan diberi nama sesuai isinya."
item = "Halaman web membawa fontnya sendiri, dan teks berketebalan sedang tampak sama seperti di browser Anda."
item = "Di pengaturan agen, perintah instalasi ditampilkan utuh dan punya tombol salin."
item = "Nama lapisan tetap mudah dibaca dalam desain yang sangat bertingkat."

[[note]]
version = "0.5.6"
locale = "en-US"
title = "Web pages you can edit"
item = "A web page brought in through the browser can now arrive as auto layout: change a label, a spacing or a size, and everything around it moves along, like a design made in the editor."
item = "Lucide icons on imported pages come in as real icons you can swap and recolour, and scrolling areas stay clipped."

[[note]]
version = "0.5.6"
locale = "tr"
title = "Düzenlenebilir web sayfaları"
item = "Tarayıcıdan getirilen bir web sayfası artık otomatik yerleşimle gelebiliyor: bir etiketi, boşluğu ya da boyutu değiştirin, çevresindeki her şey editörde yapılmış bir tasarımdaki gibi kayıyor."
item = "İçe aktarılan sayfalardaki Lucide ikonları değiştirilip yeniden renklendirilebilen gerçek ikonlar olarak geliyor; kaydırılan alanlar kırpılı kalıyor."

[[note]]
version = "0.5.6"
locale = "zh-CN"
title = "可编辑的网页"
item = "通过浏览器导入的网页现在可以采用自动布局:修改文字、间距或尺寸时,周围的内容会像在编辑器中做的设计一样随之移动。"
item = "导入页面中的 Lucide 图标会成为可替换、可重新着色的真正图标,滚动区域也会保持裁剪。"

[[note]]
version = "0.5.6"
locale = "zh-TW"
title = "可編輯的網頁"
item = "透過瀏覽器匯入的網頁現在可以使用自動版面:修改文字、間距或尺寸時,周圍的內容會像在編輯器中製作的設計一樣跟著移動。"
item = "匯入頁面中的 Lucide 圖示會成為可替換、可重新上色的真正圖示,捲動區域也會維持裁切。"

[[note]]
version = "0.5.6"
locale = "ja"
title = "編集できるウェブページ"
item = "ブラウザから取り込んだウェブページを自動レイアウトで取り込めるようになりました。ラベルや余白、サイズを変えると、エディタで作ったデザインと同じように周りも合わせて動きます。"
item = "取り込んだページの Lucide アイコンは、差し替えや色の変更ができる本物のアイコンになり、スクロール領域は切り抜かれたままです。"

[[note]]
version = "0.5.6"
locale = "ko"
title = "편집할 수 있는 웹 페이지"
item = "브라우저로 가져온 웹 페이지를 이제 자동 레이아웃으로 가져올 수 있습니다. 레이블, 간격, 크기를 바꾸면 편집기에서 만든 디자인처럼 주변 요소도 함께 움직입니다."
item = "가져온 페이지의 Lucide 아이콘은 바꾸고 색을 다시 입힐 수 있는 실제 아이콘으로 들어오며, 스크롤 영역은 잘린 상태로 유지됩니다."

[[note]]
version = "0.5.6"
locale = "fr"
title = "Des pages web modifiables"
item = "Une page web importée par le navigateur peut maintenant arriver en mise en page automatique : changez un libellé, un espacement ou une taille, et tout ce qui l'entoure suit, comme dans un design fait dans l'éditeur."
item = "Les icônes Lucide des pages importées deviennent de vraies icônes que vous pouvez remplacer et recolorer, et les zones défilantes restent rognées."

[[note]]
version = "0.5.6"
locale = "es"
title = "Páginas web editables"
item = "Una página web traída con el navegador ahora puede llegar con diseño automático: cambia una etiqueta, un espaciado o un tamaño y todo lo que la rodea se mueve con ella, como en un diseño hecho en el editor."
item = "Los iconos de Lucide de las páginas importadas llegan como iconos reales que puedes cambiar y recolorear, y las zonas con desplazamiento siguen recortadas."

[[note]]
version = "0.5.6"
locale = "de"
title = "Bearbeitbare Webseiten"
item = "Eine über den Browser geholte Webseite kann jetzt mit automatischem Layout ankommen: Ändern Sie eine Beschriftung, einen Abstand oder eine Größe, und alles darum herum rückt mit, wie bei einem im Editor erstellten Design."
item = "Lucide-Symbole importierter Seiten kommen als echte Symbole an, die Sie austauschen und umfärben können, und scrollbare Bereiche bleiben beschnitten."

[[note]]
version = "0.5.6"
locale = "pt"
title = "Páginas web editáveis"
item = "Uma página web trazida pelo navegador agora pode chegar com layout automático: mude um rótulo, um espaçamento ou um tamanho, e tudo ao redor acompanha, como num design feito no editor."
item = "Os ícones Lucide das páginas importadas chegam como ícones reais que você pode trocar e recolorir, e as áreas com rolagem continuam recortadas."

[[note]]
version = "0.5.6"
locale = "ru"
title = "Веб-страницы, которые можно редактировать"
item = "Веб-страницу, загруженную через браузер, теперь можно получить с автоматической раскладкой: измените подпись, отступ или размер, и всё вокруг сдвинется, как в макете, созданном в редакторе."
item = "Иконки Lucide на импортированных страницах приходят как настоящие иконки, которые можно заменить и перекрасить, а прокручиваемые области остаются обрезанными."

[[note]]
version = "0.5.6"
locale = "hi"
title = "बदले जा सकने वाले वेब पेज"
item = "ब्राउज़र से लाया गया वेब पेज अब ऑटो लेआउट के साथ आ सकता है: कोई लेबल, दूरी या आकार बदलें, और उसके आसपास का सब कुछ एडिटर में बने डिज़ाइन की तरह साथ में खिसकता है।"
item = "आयात किए गए पेजों के Lucide आइकन असली आइकन बनकर आते हैं जिन्हें आप बदल और दोबारा रंग सकते हैं, और स्क्रॉल होने वाले हिस्से कटे हुए रहते हैं।"

[[note]]
version = "0.5.6"
locale = "th"
title = "หน้าเว็บที่แก้ไขได้"
item = "หน้าเว็บที่นำเข้ามาผ่านเบราว์เซอร์สามารถมาพร้อมเลย์เอาต์อัตโนมัติได้แล้ว: เปลี่ยนป้ายกำกับ ระยะห่าง หรือขนาด แล้วทุกอย่างรอบ ๆ จะขยับตาม เหมือนงานออกแบบที่ทำในเอดิเตอร์"
item = "ไอคอน Lucide ในหน้าที่นำเข้าจะเป็นไอคอนจริงที่เปลี่ยนและเปลี่ยนสีได้ และพื้นที่ที่เลื่อนได้ยังคงถูกตัดขอบไว้"

[[note]]
version = "0.5.6"
locale = "vi"
title = "Trang web có thể chỉnh sửa"
item = "Trang web đưa vào qua trình duyệt giờ có thể đến với bố cục tự động: đổi một nhãn, khoảng cách hay kích thước, mọi thứ xung quanh sẽ dịch theo, giống như một thiết kế làm trong trình chỉnh sửa."
item = "Biểu tượng Lucide trên các trang đã nhập trở thành biểu tượng thật mà bạn có thể thay và đổi màu, còn các vùng cuộn vẫn được cắt gọn."

[[note]]
version = "0.5.6"
locale = "id"
title = "Halaman web yang bisa diedit"
item = "Halaman web yang dibawa lewat browser kini bisa datang dengan tata letak otomatis: ubah label, jarak, atau ukuran, dan semua di sekitarnya ikut bergeser, seperti desain yang dibuat di editor."
item = "Ikon Lucide di halaman yang diimpor datang sebagai ikon sungguhan yang bisa Anda ganti dan warnai ulang, dan area yang bisa digulir tetap terpotong."

[[note]]
version = "0.5.5"
locale = "en-US"
title = "Outlined text and local pages"
item = "Text can have an outline: give it a stroke in the properties panel. Outlined text from pen.dev files now comes through, and it exports to PNG, PDF, SVG, HTML and PowerPoint."
item = "Radial and angular gradients from pen.dev files keep their off-centre position."
item = "A browser element can show a page from your project folder, such as ./video/player.html. Pages in pen.dev files are found next to the design, and a page that cannot load says why."
item = "Importing a pen.dev file from its own folder on the command line brings in all its images and effects."
item = "Starting the editor in the background waits for large files, and tells you when another one is already running."

[[note]]
version = "0.5.5"
locale = "tr"
title = "Konturlu metin ve yerel sayfalar"
item = "Metne kontur verilebiliyor: özellikler panelinde ona bir kenarlık ekleyin. pen.dev dosyalarındaki konturlu metin artık korunuyor ve PNG, PDF, SVG, HTML ve PowerPoint'e aktarılıyor."
item = "pen.dev dosyalarındaki radyal ve açısal gradyanlar merkez dışındaki konumlarını koruyor."
item = "Tarayıcı öğesi proje klasörünüzdeki bir sayfayı gösterebiliyor, örneğin ./video/player.html. pen.dev dosyalarındaki sayfalar tasarımın yanında bulunuyor; yüklenemeyen bir sayfa nedenini söylüyor."
item = "Komut satırında bir pen.dev dosyasını kendi klasöründen içe aktarmak tüm görsellerini ve efektlerini getiriyor."
item = "Düzenleyiciyi arka planda başlatmak büyük dosyaları bekliyor ve zaten çalışan bir tane varsa bunu söylüyor."

[[note]]
version = "0.5.5"
locale = "zh-CN"
title = "描边文字与本地页面"
item = "文字可以加描边:在属性面板中为它添加描边。pen.dev 文件中的描边文字现在会保留,并可导出为 PNG、PDF、SVG、HTML 和 PowerPoint。"
item = "pen.dev 文件中的径向和角度渐变会保留偏离中心的位置。"
item = "浏览器元素可以显示项目文件夹中的页面,例如 ./video/player.html。pen.dev 文件中的页面会在设计文件旁边查找,无法加载的页面会显示原因。"
item = "在命令行中从 pen.dev 文件所在的文件夹导入时,会带上它的所有图片和效果。"
item = "在后台启动编辑器时会等待大文件加载完成,如果已有一个在运行也会提示你。"

[[note]]
version = "0.5.5"
locale = "zh-TW"
title = "描邊文字與本機頁面"
item = "文字可以加上描邊:在屬性面板中為它加上描邊。pen.dev 檔案中的描邊文字現在會保留,並可匯出為 PNG、PDF、SVG、HTML 和 PowerPoint。"
item = "pen.dev 檔案中的放射狀和角度漸層會保留偏離中心的位置。"
item = "瀏覽器元素可以顯示專案資料夾中的頁面,例如 ./video/player.html。pen.dev 檔案中的頁面會在設計檔旁邊尋找,無法載入的頁面會說明原因。"
item = "在命令列中從 pen.dev 檔案所在的資料夾匯入時,會帶入它的所有圖片和效果。"
item = "在背景啟動編輯器時會等待大型檔案載入完成,若已有一個在執行也會告訴你。"

[[note]]
version = "0.5.5"
locale = "ja"
title = "アウトライン文字とローカルページ"
item = "テキストにアウトラインを付けられるようになりました。プロパティパネルで線を追加してください。pen.dev ファイルのアウトライン文字も保持され、PNG、PDF、SVG、HTML、PowerPoint に書き出せます。"
item = "pen.dev ファイルの放射状・角度グラデーションが、中心からずれた位置を保つようになりました。"
item = "ブラウザ要素でプロジェクトフォルダ内のページ（例: ./video/player.html）を表示できます。pen.dev ファイルのページはデザインの隣から探し、読み込めないページは理由を表示します。"
item = "コマンドラインで pen.dev ファイルをそのフォルダから読み込むと、画像とエフェクトがすべて取り込まれます。"
item = "エディタをバックグラウンドで起動すると大きなファイルの読み込みを待ち、すでに起動中のものがあればそれを知らせます。"

[[note]]
version = "0.5.5"
locale = "ko"
title = "윤곽선 텍스트와 로컬 페이지"
item = "텍스트에 윤곽선을 줄 수 있습니다. 속성 패널에서 선을 추가하세요. pen.dev 파일의 윤곽선 텍스트도 유지되며 PNG, PDF, SVG, HTML, PowerPoint로 내보낼 수 있습니다."
item = "pen.dev 파일의 방사형·각도 그라데이션이 중심에서 벗어난 위치를 유지합니다."
item = "브라우저 요소에서 프로젝트 폴더의 페이지(예: ./video/player.html)를 표시할 수 있습니다. pen.dev 파일의 페이지는 디자인 옆에서 찾고, 불러올 수 없는 페이지는 이유를 알려 줍니다."
item = "명령줄에서 pen.dev 파일을 해당 폴더에서 가져오면 모든 이미지와 효과가 함께 들어옵니다."
item = "편집기를 백그라운드에서 시작하면 큰 파일을 기다리며, 이미 실행 중인 편집기가 있으면 알려 줍니다."

[[note]]
version = "0.5.5"
locale = "fr"
title = "Texte détouré et pages locales"
item = "Le texte peut avoir un contour : ajoutez-lui un trait dans le panneau des propriétés. Le texte détouré des fichiers pen.dev est désormais conservé, et il s'exporte en PNG, PDF, SVG, HTML et PowerPoint."
item = "Les dégradés radiaux et angulaires des fichiers pen.dev gardent leur centre décalé."
item = "Un élément navigateur peut afficher une page de votre dossier de projet, comme ./video/player.html. Les pages des fichiers pen.dev sont recherchées à côté du design, et une page qui ne se charge pas indique pourquoi."
item = "Importer un fichier pen.dev depuis son propre dossier en ligne de commande récupère toutes ses images et tous ses effets."
item = "Lancer l'éditeur en arrière-plan attend le chargement des gros fichiers et vous prévient si un autre est déjà en cours d'exécution."

[[note]]
version = "0.5.5"
locale = "es"
title = "Texto con contorno y páginas locales"
item = "El texto puede tener contorno: añádele un trazo en el panel de propiedades. El texto con contorno de los archivos pen.dev ahora se conserva y se exporta a PNG, PDF, SVG, HTML y PowerPoint."
item = "Los degradados radiales y angulares de los archivos pen.dev mantienen su centro desplazado."
item = "Un elemento de navegador puede mostrar una página de la carpeta de tu proyecto, como ./video/player.html. Las páginas de los archivos pen.dev se buscan junto al diseño y una página que no se puede cargar indica por qué."
item = "Importar un archivo pen.dev desde su propia carpeta en la línea de comandos trae todas sus imágenes y efectos."
item = "Al iniciar el editor en segundo plano, espera a que carguen los archivos grandes y te avisa si ya hay otro en ejecución."

[[note]]
version = "0.5.5"
locale = "de"
title = "Konturtext und lokale Seiten"
item = "Text kann eine Kontur haben: Gib ihm im Eigenschaftenbereich eine Kontur. Konturtext aus pen.dev-Dateien bleibt jetzt erhalten und lässt sich als PNG, PDF, SVG, HTML und PowerPoint exportieren."
item = "Radiale und Winkelverläufe aus pen.dev-Dateien behalten ihre außermittige Position."
item = "Ein Browser-Element kann eine Seite aus deinem Projektordner anzeigen, etwa ./video/player.html. Seiten in pen.dev-Dateien werden neben dem Design gesucht, und eine Seite, die nicht lädt, nennt den Grund."
item = "Wird eine pen.dev-Datei über die Befehlszeile aus ihrem eigenen Ordner importiert, kommen alle ihre Bilder und Effekte mit."
item = "Beim Start des Editors im Hintergrund wird auf große Dateien gewartet, und du erfährst, wenn bereits einer läuft."

[[note]]
version = "0.5.5"
locale = "pt"
title = "Texto com contorno e páginas locais"
item = "O texto pode ter contorno: adicione um traço no painel de propriedades. O texto com contorno dos arquivos pen.dev agora é mantido e pode ser exportado para PNG, PDF, SVG, HTML e PowerPoint."
item = "Gradientes radiais e angulares dos arquivos pen.dev mantêm o centro deslocado."
item = "Um elemento de navegador pode mostrar uma página da pasta do seu projeto, como ./video/player.html. As páginas dos arquivos pen.dev são procuradas ao lado do design, e uma página que não carrega diz por quê."
item = "Importar um arquivo pen.dev a partir da própria pasta pela linha de comando traz todas as suas imagens e efeitos."
item = "Iniciar o editor em segundo plano aguarda arquivos grandes e avisa quando outro já está em execução."

[[note]]
version = "0.5.5"
locale = "ru"
title = "Обводка текста и локальные страницы"
item = "У текста может быть обводка: добавьте ему контур на панели свойств. Текст с обводкой из файлов pen.dev теперь сохраняется и экспортируется в PNG, PDF, SVG, HTML и PowerPoint."
item = "Радиальные и угловые градиенты из файлов pen.dev сохраняют смещённый центр."
item = "Элемент браузера может показывать страницу из папки проекта, например ./video/player.html. Страницы из файлов pen.dev ищутся рядом с макетом, а страница, которая не загрузилась, сообщает причину."
item = "Импорт файла pen.dev из его собственной папки в командной строке переносит все его изображения и эффекты."
item = "Запуск редактора в фоне дожидается загрузки больших файлов и сообщает, если другой уже запущен."

[[note]]
version = "0.5.5"
locale = "hi"
title = "आउटलाइन वाला टेक्स्ट और स्थानीय पेज"
item = "टेक्स्ट पर आउटलाइन दी जा सकती है: प्रॉपर्टी पैनल में उसे स्ट्रोक दें। pen.dev फ़ाइलों का आउटलाइन वाला टेक्स्ट अब बना रहता है और PNG, PDF, SVG, HTML और PowerPoint में एक्सपोर्ट होता है।"
item = "pen.dev फ़ाइलों के रेडियल और कोणीय ग्रेडिएंट अपनी केंद्र से हटी स्थिति बनाए रखते हैं।"
item = "ब्राउज़र एलिमेंट आपके प्रोजेक्ट फ़ोल्डर का पेज दिखा सकता है, जैसे ./video/player.html। pen.dev फ़ाइलों के पेज डिज़ाइन के पास खोजे जाते हैं, और जो पेज लोड नहीं होता वह कारण बताता है।"
item = "कमांड लाइन से pen.dev फ़ाइल को उसके अपने फ़ोल्डर से इम्पोर्ट करने पर उसकी सभी इमेज और इफ़ेक्ट आ जाते हैं।"
item = "एडिटर को बैकग्राउंड में शुरू करने पर यह बड़ी फ़ाइलों का इंतज़ार करता है, और अगर कोई पहले से चल रहा हो तो बताता है।"

[[note]]
version = "0.5.5"
locale = "th"
title = "ข้อความแบบเส้นขอบและหน้าเว็บในเครื่อง"
item = "ข้อความมีเส้นขอบได้แล้ว: เพิ่มเส้นขอบให้ในแผงคุณสมบัติ ข้อความแบบเส้นขอบจากไฟล์ pen.dev จะคงอยู่ และส่งออกเป็น PNG, PDF, SVG, HTML และ PowerPoint ได้"
item = "ไล่ระดับสีแบบรัศมีและแบบมุมจากไฟล์ pen.dev คงตำแหน่งที่เยื้องจากกึ่งกลางไว้"
item = "องค์ประกอบเบราว์เซอร์แสดงหน้าจากโฟลเดอร์โปรเจกต์ได้ เช่น ./video/player.html หน้าในไฟล์ pen.dev จะค้นหาข้างไฟล์ดีไซน์ และหน้าที่โหลดไม่ได้จะบอกสาเหตุ"
item = "การนำเข้าไฟล์ pen.dev จากโฟลเดอร์ของไฟล์เองผ่านบรรทัดคำสั่ง จะนำรูปภาพและเอฟเฟกต์ทั้งหมดเข้ามาด้วย"
item = "การเริ่มโปรแกรมแก้ไขในเบื้องหลังจะรอไฟล์ขนาดใหญ่ และแจ้งให้ทราบหากมีตัวหนึ่งทำงานอยู่แล้ว"

[[note]]
version = "0.5.5"
locale = "vi"
title = "Chữ viền và trang cục bộ"
item = "Chữ có thể có viền: thêm nét viền trong bảng thuộc tính. Chữ viền trong tệp pen.dev giờ được giữ lại và xuất được sang PNG, PDF, SVG, HTML và PowerPoint."
item = "Dải màu dạng tỏa tròn và dạng góc trong tệp pen.dev giữ nguyên vị trí lệch tâm."
item = "Phần tử trình duyệt có thể hiển thị một trang trong thư mục dự án, như ./video/player.html. Các trang trong tệp pen.dev được tìm bên cạnh bản thiết kế, và trang không tải được sẽ cho biết lý do."
item = "Nhập tệp pen.dev từ chính thư mục của nó bằng dòng lệnh sẽ mang theo tất cả hình ảnh và hiệu ứng."
item = "Khởi động trình chỉnh sửa ở chế độ nền sẽ chờ các tệp lớn và báo cho bạn khi đã có một phiên đang chạy."

[[note]]
version = "0.5.5"
locale = "id"
title = "Teks bergaris tepi dan halaman lokal"
item = "Teks bisa diberi garis tepi: tambahkan goresan di panel properti. Teks bergaris tepi dari file pen.dev kini tetap terbawa dan bisa diekspor ke PNG, PDF, SVG, HTML, dan PowerPoint."
item = "Gradien radial dan sudut dari file pen.dev mempertahankan posisi tengahnya yang bergeser."
item = "Elemen browser dapat menampilkan halaman dari folder proyek Anda, seperti ./video/player.html. Halaman dalam file pen.dev dicari di samping desain, dan halaman yang gagal dimuat menyebutkan alasannya."
item = "Mengimpor file pen.dev dari foldernya sendiri lewat baris perintah membawa semua gambar dan efeknya."
item = "Menjalankan editor di latar belakang akan menunggu file besar dan memberi tahu jika sudah ada yang berjalan."

