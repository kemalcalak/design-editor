# Scene Template Center catalogue prefix.
#
# The catalogue parser concatenates this prefix with scene_templates.toml so
# each checked-in source file remains below the repository's 800-line limit.
# These are the first thirteen entries in catalogue order.
#
# One entry per shipped template document. `id` must match both the embedded
# document (assets/scene_templates/<id>.op) and its card preview
# (de-editor-ui/assets/scene_template_previews/<id>.jpg) — `scene_template_catalog`
# asserts that at load time, so a half-added template fails loudly instead of
# rendering as a blank card.
#
# Parsed by `scene_template_catalog.rs` with the same small TOML subset the
# Prompt Center uses: quoted strings, string arrays, plain integers.
#
# `style_guide` is optional and names an entry in the style-guide registry
# (`de-ai-skills/skills/style-guides/<name>.md`). Its presence is what puts the
# "generate from this" action on a card, so it is only set where generating
# from the template would actually reproduce it: the deck and web templates.
# The card / tutorial / carousel / comparison / infographic templates are left
# without one because the generation pipeline has no design type for them yet —
# "card" classifies as a 400px Component (`de_orchestrator::detect_design_type`),
# so a button here would promise a knowledge card and deliver a widget, and
# "infographic" triggers no branch at all, so a 1080-wide long-form graphic would come
# back as a 1200-wide landing page.

[[template]]
id = "screenshot-tutorial"
scene = "tutorial"
title_key = "sceneTemplate.item.screenshotTutorial.title"
title_fallback = "Three-Step Screenshot Tutorial Cards"
summary_key = "sceneTemplate.item.screenshotTutorial.summary"
summary_fallback = "A cover, three how-to steps, and a closing call to action. Replace the screenshots and instructions to publish."
tags = ["tutorial", "howto"]
frames = 5
frame_width = 1080
frame_height = 1440
