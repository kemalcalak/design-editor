# Leaf utility crate — MUST stay dependency-free and wasm32-clean.
# It is depped by wasm-facing crates (de-editor-core / de-editor-ui via
# de-host-web) as well as native-only ones, so nothing platform-specific
# may ever land here.
[package]
name = "de-util"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Design Editor dependency-free leaf utilities: ids, colors, escaping, and image metadata"

