[package]
name = "de-host-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Design Editor headless host services — the GUI-free backend (serve-web daemon, MCP, AI chat/orchestration, export, persistence) shared by de-host-desktop + de-host-web-server; no winit/skia-GL"

[lib]
name = "de_host_services"
path = "src/lib.rs"

[features]
default = []
# Mirrors de-host-desktop's debug-tools toggle for the MCP server.
mcp-debug-tools = ["de-mcp/debug-tools", "de-chat-agent/mcp-debug-tools"]
# Production release lane; forwarded by de-host-web-server.
pinned-skia-binaries = ["skia-safe/no-compile"]
# Dev-only: links the locally built ABI-v2 op-auth archive for the serve-web
# daemon, mirroring de-host-desktop's flag of the same name (debug profile
# only; see de-auth-bridge/README).
dev-op-auth-abi-v2 = ["de-auth-bridge/dev-abi-v2"]

[dependencies]
# --- workspace path deps (the headless daemon's closure; modules land in
#     Phases 2-5). Conditional deps (de-codegen / de-config-store) are added
#     when a moved module proves it needs them, per the plan. de-figma landed
#     for the VS Code plugin's offline `.fig` -> `.op` convert endpoint
#     (figma_convert.rs). ---
de-figma = { path = "../de-figma" }
de-html = { path = "../de-html" }
de-editor-core = { path = "../de-editor-core" }
de-builtin-model-discovery = { path = "../de-builtin-model-discovery" }
# Device-login proxy for the web editor (prebuilt library or inert stub).
de-auth-bridge = { path = "../de-auth-bridge" }
de-config-store = { path = "../de-config-store" }
de-editor-ui = { path = "../de-editor-ui" }
de-editor-host-core = { path = "../de-editor-host-core", features = [
  "settings-io",
] }
de-mcp = { path = "../de-mcp", features = ["script"] }
de-ai = { path = "../de-ai" }
# The builtin-provider agent loop + canvas/design tool surface, factored out
# so mobile hosts share it; this crate re-exports it under the original paths.
de-chat-agent = { path = "../de-chat-agent" }
de-ai-skills = { path = "../de-ai-skills" }
de-orchestrator = { path = "../de-orchestrator" }
de-design-lint = { path = "../de-design-lint" }
de-pen-loader = { path = "../de-pen-loader" }
de-render-export = { path = "../de-render-export" }
# Shared image-slot detection + result write-back for the MCP
# `enrich_images` tool (also used by de-host-desktop's search session).
de-image-enrich = { path = "../de-image-enrich", features = ["net"] }
de-process-io = { path = "../de-process-io" }
de-acp = { path = "../de-acp" }
de-i18n = { path = "../de-i18n" }
# Canonical JSON/HTML string escaping (dependency-free).
de-util = { path = "../de-util" }
jian-ops-schema = { path = "../../vendor/jian/crates/jian-ops-schema" }
agent = { path = "../../vendor/agent/crates/agent", default-features = false }
anthropic-agent-sdk = { path = "../../vendor/anthropic-agent-sdk" }

# --- external (crates.io / forks) ---
# Keep the product's explicit installed-CLI contract; the SDK's default
# `bundled-cli` feature would otherwise embed a platform CLI archive.
github-copilot-sdk = { version = "=1.0.11", default-features = false }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "io-util",
  "process",
  "net",
  "time",
] }
futures = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
tracing = { workspace = true }
signal-hook = "0.3"

zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
memmap2 = "0.9"
dirs = "5"
# Raster + PDF Skia shared with `de-render-export`, plus chat image processing
# in this crate — NO `gl` (the headless server links no GL). Cargo keeps this
# gl-free in the isolated `-p de-host-services` build.
skia-safe = { version = "0.97.0", default-features = false, features = [
  "binary-cache",
  "textlayout",
  "pdf",
] }

# Unix signal handling for the online daemon's controlled shutdown. Already in
# the dependency graph transitively; named here so the SIGTERM handler can use
# it directly. Unix-only — the online daemon is a container deployment.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
