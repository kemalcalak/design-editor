[package]
name       = "de-engine-jni"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish    = false
description = "Android JNI marshalling layer for the Design Editor engine player (de-engine-ffi)"

[lib]
# cdylib for the Android Player; rlib so the host-triple queue tests link.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# EGL/GLES rendering on Android (jian-skia surface/egl_android).
gl = ["de-engine-ffi/gl"]
# Metal rendering on iOS — forwards to the engine so the cross-target
# compile guard can pass the same platform feature on every mobile target.
metal = ["de-engine-ffi/metal"]
# Full-editor mode (forwards to the engine's editor feature).
editor = ["de-engine-ffi/editor"]
# Production Android release lane: require the digest-pinned Skia archive
# staged by the reviewed workflow instead of downloading or compiling one.
pinned-skia-binaries = ["de-engine-ffi/pinned-skia-binaries"]
# Local-only authentication for Android editor builds. The underlying bridge
# rejects unsigned archives outside Cargo's debug profile.
mobile-auth-dev = ["de-engine-ffi/mobile-auth-dev"]

[dependencies]
de-engine-ffi = { path = "../de-engine-ffi" }

[target.'cfg(target_os = "android")'.dependencies]
jni     = "0.21"
ndk-sys = "0.6"
zeroize = "1"
